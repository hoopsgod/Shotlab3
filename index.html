<body>
  <div id="root">
    <div class="boot-auth-shell" aria-label="Loading ShotLab" role="status">
      <div class="boot-auth-card">
        <div class="boot-wordmark" aria-label="ShotLab"><span>SHOT</span><strong>LAB</strong></div>
        <div class="boot-tagline">Train with intent</div>
        <div class="boot-progress" aria-hidden="true"><span></span></div>
        <div class="boot-auth-copy">Loading your workspace</div>
      </div>
    </div>
  </div>
  <div id="team-store-root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script type="module" src="/src/teamStoreEntry.jsx"></script>
  <script type="module" src="/src/lib/phase1EvidenceClosure.js"></script>
  <script>
    window.addEventListener('load', function () {
      var requestedDemo = String(new URLSearchParams(window.location.search).get('demo') || '').toLowerCase();
      var directDemoRequested = requestedDemo === 'player' || requestedDemo === 'coach';
      var directDemoStarted = false;

      var revealDemoActions = function () {
        document.querySelectorAll('.auth-demo-enter').forEach(function (node) {
          node.style.setProperty('display','flex','important');
          node.style.setProperty('opacity','1','important');
          node.style.setProperty('visibility','visible','important');
          node.style.setProperty('pointer-events','auto','important');
        });
      };

      var enterRequestedDemo = function () {
        if (!directDemoRequested || directDemoStarted) return;
        var buttons = Array.prototype.slice.call(document.querySelectorAll('.auth-demo-enter button'));
        var expectedLabel = requestedDemo === 'coach' ? 'demo coach' : 'demo player';
        var target = buttons.find(function (button) {
          return String(button.textContent || '').trim().toLowerCase() === expectedLabel;
        });
        if (!target) return;
        directDemoStarted = true;
        target.click();
      };

      var refreshAuthEntry = function () {
        revealDemoActions();
        enterRequestedDemo();
      };

      refreshAuthEntry();
      new MutationObserver(refreshAuthEntry).observe(document.getElementById('root'), { childList:true, subtree:true });
    }, { once: true });
  </script>
