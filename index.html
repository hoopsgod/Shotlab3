<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ShotLab" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#F4F3EF" />
  <title>ShotLab</title>
  <script>
    (function () {
      try {
        var queryDemo = new URLSearchParams(window.location.search).get('demo') === '1';
        var demoEmails = ['demo@shotlab.app', 'coach.demo@shotlab.app'];
        var clearStaleDemoAuth = function (storage) {
          if (!storage) return;
          storage.removeItem('sl:demoMode');
          storage.removeItem('sl:demoSession');
          var keys = [];
          for (var i = 0; i < storage.length; i += 1) keys.push(storage.key(i));
          keys.forEach(function (key) {
            if (!key) return;
            var normalizedKey = String(key).toLowerCase();
            var authLikeKey = key === 'sl:session' || normalizedKey.indexOf('auth-token') >= 0 || normalizedKey.indexOf('supabase.auth') >= 0;
            if (!authLikeKey) return;
            var raw = String(storage.getItem(key) || '').toLowerCase();
            var isDemoAuth = demoEmails.some(function (email) { return raw.indexOf(email) >= 0; });
            if (isDemoAuth) storage.removeItem(key);
          });
        };

        clearStaleDemoAuth(window.localStorage);
        clearStaleDemoAuth(window.sessionStorage);
        document.documentElement.classList.remove('shotlab-demo');
        if (queryDemo) document.documentElement.classList.add('shotlab-demo');
      } catch (_) {}
    })();
  </script>
  <style>
    html,body{margin:0;padding:0;background:#F4F3EF;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    #root{min-height:100dvh}
    #team-store-root{position:relative;z-index:0}
    .boot-auth-shell{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));box-sizing:border-box;background:#F4F3EF}
    .boot-auth-card{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
    .boot-wordmark{display:flex;align-items:baseline;gap:3px;color:#101310;font:800 clamp(42px,13vw,58px)/.9 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;letter-spacing:-.05em}
    .boot-wordmark strong{color:#7F9E1E;font:inherit}
    .boot-tagline{font:700 10px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#6D746F}
    .boot-progress{width:124px;height:3px;margin-top:18px;overflow:hidden;border-radius:999px;background:rgba(16,19,16,.10)}
    .boot-progress span{display:block;width:44%;height:100%;border-radius:inherit;background:#7F9E1E;animation:boot-progress 1.15s cubic-bezier(.22,.78,.22,1) infinite alternate}
    .boot-auth-copy{margin-top:4px;font:600 11px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#6D746F}
    @keyframes boot-progress{from{transform:translateX(-95%)}to{transform:translateX(225%)}}
    @media(prefers-reduced-motion:reduce){.boot-progress span{width:100%;animation:none;opacity:.75}}
  </style>
  <link id="shotlab-v3-authority" rel="stylesheet" href="/shotlab-v3-foundation.css" />
  <link id="shotlab-v3-mobile-corrections" rel="stylesheet" href="/shotlab-v3-mobile-corrections.css" />
  <link id="shotlab-v4-reference" rel="stylesheet" href="/shotlab-v4-reference.css" />
  <link id="shotlab-v5-coach-integrity" rel="stylesheet" href="/shotlab-v5-coach-integrity.css" />
  <link id="shotlab-v6-decision-workspaces" rel="stylesheet" href="/shotlab-v6-decision-workspaces.css" />
  <link id="shotlab-v7-page-authority" rel="stylesheet" href="/shotlab-v7-page-authority.css" />
  <link id="shotlab-v8-demo-parity" rel="stylesheet" href="/shotlab-v8-demo-parity.css" />
  <link id="shotlab-v9-secondary-polish" rel="stylesheet" href="/shotlab-v9-secondary-polish.css" />
</head>
<body>
  <div id="root">
    <div class="boot-auth-shell" aria-label="Loading ShotLab" role="status">
      <div class="boot-auth-card">
        <div class="boot-wordmark" aria-label="ShotLab"><span>SHOT</span><strong>LAB</strong></div>
        <div class="boot-tagline">Train with intent</div>
        <div class="boot-progress" aria-hidden="true"><span></span></div>
        <div class="boot-auth-copy">Loading your workspace</div>
      </div>
    </div>
  </div>
  <div id="team-store-root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script type="module" src="/src/teamStoreEntry.jsx"></script>
  <script>
    window.addEventListener('load', function () {
      ['shotlab-v3-authority','shotlab-v3-mobile-corrections','shotlab-v4-reference','shotlab-v5-coach-integrity','shotlab-v6-decision-workspaces','shotlab-v7-page-authority','shotlab-v8-demo-parity','shotlab-v9-secondary-polish'].forEach(function (id) {
        var sheet = document.getElementById(id);
        if (sheet) document.head.appendChild(sheet);
      });
    }, { once: true });
  </script>
</body>
</html>
