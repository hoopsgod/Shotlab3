<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ShotLab" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#F5F5F2" />
  <title>ShotLab</title>
  <script>
    (function () {
      try {
        var requestedDemo = String(new URLSearchParams(window.location.search).get('demo') || '').toLowerCase();
        var queryDemo = requestedDemo === '1' || requestedDemo === 'player' || requestedDemo === 'coach';
        document.documentElement.classList.toggle('shotlab-demo', queryDemo);
      } catch (_) {}
    })();
  </script>
  <style>
    html,body{margin:0;padding:0;background:#F5F5F2;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    #root{min-height:100dvh}
    #team-store-root{position:relative;z-index:0}
    .boot-auth-shell{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));box-sizing:border-box;background:#F5F5F2}
    .boot-auth-card{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
    .boot-wordmark{display:flex;align-items:baseline;gap:3px;color:#101310;font:800 clamp(42px,13vw,58px)/.9 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;letter-spacing:-.05em}
    .boot-wordmark strong{color:#7F9E1E;font:inherit}
    .boot-tagline{font:700 10px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#6D746F}
    .boot-progress{width:124px;height:3px;margin-top:18px;overflow:hidden;border-radius:999px;background:rgba(16,19,16,.10)}
    .boot-progress span{display:block;width:44%;height:100%;border-radius:inherit;background:#7F9E1E;animation:boot-progress 1.15s cubic-bezier(.22,.78,.22,1) infinite alternate}
    .boot-auth-copy{margin-top:4px;font:600 11px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#6D746F}
    .auth-demo-enter{display:flex!important;opacity:1!important;visibility:visible!important;pointer-events:auto!important}
    .auth-demo-enter button{opacity:1!important;visibility:visible!important;pointer-events:auto!important}
    @keyframes boot-progress{from{transform:translateX(-95%)}to{transform:translateX(225%)}}
    @media(prefers-reduced-motion:reduce){.boot-progress span{width:100%;animation:none;opacity:.75}}
  </style>
  <link id="shotlab-v3-authority" rel="stylesheet" href="/shotlab-v3-foundation.css" />

  <link id="shotlab-v7-page-authority" rel="stylesheet" href="/shotlab-v7-page-authority.css" />

  <link id="shotlab-v9-secondary-polish" rel="stylesheet" href="/shotlab-v9-secondary-polish.css" />
  <link id="shotlab-v11-decision-first" rel="stylesheet" href="/shotlab-v11-decision-first.css?v=8a79ecde" />
  <link id="shotlab-v12-auth-demo-entry" rel="stylesheet" href="/shotlab-v12-auth-demo-entry.css?v=75ba7ae2" />

  <link id="shotlab-phase3-native-route-framing" rel="stylesheet" href="/shotlab-phase3-native-route-framing.css" />

  <link id="shotlab-phase3d-analytics-root-lock" rel="stylesheet" href="/shotlab-phase3d-analytics-root-lock.css" />
  <link id="shotlab-phase3e-profile-hierarchy" rel="stylesheet" href="/shotlab-phase3e-profile-hierarchy.css" />
  <link id="shotlab-phase3f-profile-intelligence" rel="stylesheet" href="/shotlab-phase3f-profile-intelligence.css" />
  <link id="shotlab-phase3g-coach-drills-hierarchy" rel="stylesheet" href="/shotlab-phase3g-coach-drills-hierarchy.css" />
  <link id="shotlab-phase3h-coach-players-hierarchy" rel="stylesheet" href="/shotlab-phase3h-coach-players-hierarchy.css" />
  <link id="shotlab-phase3i-team-store-immersive" rel="stylesheet" href="/shotlab-phase3i-team-store-immersive.css" />

<body>
  <div id="root">
    <div class="boot-auth-shell" aria-label="Loading ShotLab" role="status">
      <div class="boot-auth-card">
        <div class="boot-wordmark" aria-label="ShotLab"><span>SHOT</span><strong>LAB</strong></div>
        <div class="boot-tagline">Train with intent</div>
        <div class="boot-progress" aria-hidden="true"><span></span></div>
        <div class="boot-auth-copy">Loading your workspace</div>
      </div>
    </div>
  </div>
  <div id="team-store-root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script type="module" src="/src/teamStoreEntry.jsx"></script>
  <script>
    window.addEventListener('load', function () {
      var requestedDemo = String(new URLSearchParams(window.location.search).get('demo') || '').toLowerCase();
      var directDemoRequested = requestedDemo === 'player' || requestedDemo === 'coach';
      var directDemoStarted = false;

      var revealDemoActions = function () {
        document.querySelectorAll('.auth-demo-enter').forEach(function (node) {
          node.style.setProperty('display','flex','important');
          node.style.setProperty('opacity','1','important');
          node.style.setProperty('visibility','visible','important');
          node.style.setProperty('pointer-events','auto','important');
        });
      };

      var enterRequestedDemo = function () {
        if (!directDemoRequested || directDemoStarted) return;
        var buttons = Array.prototype.slice.call(document.querySelectorAll('.auth-demo-enter button'));
        var expectedLabel = requestedDemo === 'coach' ? 'demo coach' : 'demo player';
        var target = buttons.find(function (button) {
          return String(button.textContent || '').trim().toLowerCase() === expectedLabel;
        });
        if (!target) return;
        directDemoStarted = true;
        target.click();
      };

      var refreshAuthEntry = function () {
        revealDemoActions();
        enterRequestedDemo();
      };

      refreshAuthEntry();
      new MutationObserver(refreshAuthEntry).observe(document.getElementById('root'), { childList:true, subtree:true });
    }, { once: true });
  </script>
</body>
</html>
