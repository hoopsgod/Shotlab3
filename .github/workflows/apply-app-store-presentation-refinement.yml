name: Apply App Store Presentation Refinement

on:
  push:
    branches:
      - agent/app-store-presentation-readiness
    paths:
      - "scripts/refine-app-store-screenshot-composition.mjs"
      - ".github/workflows/apply-app-store-presentation-refinement.yml"

permissions:
  contents: write

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/app-store-presentation-readiness
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply proportional screenshot composition
        run: node scripts/refine-app-store-screenshot-composition.mjs

      - name: Verify listing contracts
        run: node --test tests/app-store-presentation-readiness.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Generate and validate refined assets
        run: |
          npx playwright test --config=playwright.screenshots.config.mjs
          node scripts/validate-app-store-screenshots.mjs

      - name: Commit verified composition
        run: |
          if git diff --quiet -- tests/e2e/app-store-screenshots.spec.mjs; then
            echo "No composition changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/app-store-screenshots.spec.mjs
          git commit -m "refine App Store screenshot composition"
          git push origin HEAD:agent/app-store-presentation-readiness
