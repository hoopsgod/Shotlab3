name: Mobile Clarity and Role Integrity
run-name: Mobile clarity certification · ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - src/components/PlayerProgressStory.module.css
      - src/lib/playerPerformanceNarrative.js
      - tests/dashboard-showstopper-phase-1.test.mjs
      - tests/mobile-clarity-role-integrity.test.mjs
      - tests/e2e/phase-3r-player-progress-story-screenshots.spec.mjs
      - .github/workflows/mobile-clarity-role-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-clarity-role-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile-clarity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify focused contracts
        run: node --test tests/mobile-clarity-role-integrity.test.mjs tests/dashboard-showstopper-phase-1.test.mjs tests/mobile-geometry-precision.test.mjs tests/player-operational-workspaces.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Progress at the required mobile widths
        run: npx playwright test tests/e2e/phase-3r-player-progress-story-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload mobile clarity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-clarity-role-integrity-evidence
          path: |
            artifacts/design-audit/iphone/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
