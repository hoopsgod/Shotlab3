name: Production Performance Budget

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and enforce production budget
        run: npm run build:performance

      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-performance-metrics
          path: artifacts/performance/build-metrics.json
          if-no-files-found: ignore
          retention-days: 14
