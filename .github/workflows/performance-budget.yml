name: Production Performance Budget

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - "src/**"
      - "tests/performance-decomposition.test.mjs"
      - "tests/coach-administration-decomposition.test.mjs"
      - "tests/player-interface-decomposition.test.mjs"
      - "tests/app-shell-decomposition.test.mjs"
      - "vendor/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - "performance-budget.json"
      - "scripts/verify-performance-budget.mjs"
      - "scripts/report-phase5a1-source-weight.mjs"
      - ".github/workflows/performance-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-production-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify performance decomposition contracts
        run: node --test tests/performance-decomposition.test.mjs tests/coach-administration-decomposition.test.mjs tests/player-interface-decomposition.test.mjs tests/app-shell-decomposition.test.mjs

      - name: Build production bundle
        run: npm run build

      - name: Report production source weight
        run: node scripts/report-phase5a1-source-weight.mjs

      - name: Enforce performance budget
        run: npm run verify:performance-budget

      - name: Upload bundle metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-performance-metrics
          path: |
            artifacts/performance/build-metrics.json
            artifacts/performance/bundle-ownership.json
            artifacts/performance/source-weight.json
          if-no-files-found: error
          retention-days: 14
