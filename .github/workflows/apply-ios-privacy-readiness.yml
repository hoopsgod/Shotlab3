name: Apply iOS Privacy Readiness

on:
  push:
    branches:
      - agent/app-store-privacy-review-readiness
    paths:
      - "scripts/configure-ios-privacy-readiness.mjs"
      - ".github/workflows/apply-ios-privacy-readiness.yml"

permissions:
  contents: write

concurrency:
  group: apply-ios-privacy-readiness
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/app-store-privacy-review-readiness
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply privacy configuration
        run: node scripts/configure-ios-privacy-readiness.mjs

      - name: Verify privacy and native contracts
        run: |
          node --test tests/app-store-privacy-review-readiness.test.mjs
          node --test tests/app-store-release-hardening.test.mjs
          node --test tests/phase-4-native-ios-foundation.test.mjs
          node --test tests/phase-4-signed-device-layer.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Commit verified native integration
        run: |
          if git diff --quiet -- ios/App/App.xcodeproj/project.pbxproj ios/App/App/Info.plist; then
            echo "No native privacy integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add ios/App/App.xcodeproj/project.pbxproj ios/App/App/Info.plist
          git commit -m "integrate native privacy manifest and network security"
          git push origin HEAD:agent/app-store-privacy-review-readiness
