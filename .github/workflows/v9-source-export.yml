name: V9 Source Export

on:
  push:
    branches:
      - agent/performance-decomposition-v9
  pull_request:
    branches:
      - march-3-reset-85393dd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install analysis dependencies
        run: npm ci --ignore-scripts
      - name: Apply App shell extraction
        if: github.event_name == 'push'
        run: node scripts/refactor-app-shell-v9.cjs
      - name: Commit generated extraction
        if: github.event_name == 'push'
        run: |
          git config user.name "shotlab-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/components/AuthWorkspace.jsx src/components/ShotLabBrand.jsx src/styles/appLegacyStyles.js
          if ! git diff --cached --quiet; then
            git commit -m "refactor: extract authentication and brand shell"
            git push origin HEAD:agent/performance-decomposition-v9
          fi
      - name: Package source and analysis tooling
        run: |
          tar -czf shotlab-v9-source.tar.gz \
            src \
            tests \
            scripts \
            .github/workflows \
            public \
            vendor \
            index.html \
            vite.config.js \
            package.json \
            package-lock.json \
            performance-budget.json \
            playwright.config.mjs
          tar -czf shotlab-v9-node-modules.tar.gz node_modules
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-v9-source
          path: |
            shotlab-v9-source.tar.gz
            shotlab-v9-node-modules.tar.gz
          retention-days: 1
