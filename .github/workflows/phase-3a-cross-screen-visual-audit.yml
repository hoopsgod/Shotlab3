name: Phase 3A Cross-Screen Visual Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: true

jobs:
  cross-screen-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 5 reconciliation and premium mobile contracts
        run: node --test tests/phase-5-cross-screen-reconciliation.test.mjs tests/app-feedback-system.test.mjs tests/mobile-premium-visual-system-2026.test.mjs tests/mobile-secondary-page-parity-contract.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start built production preview
        run: |
          npm run preview:agent > /tmp/phase-3a-preview.log 2>&1 &
          echo $! > /tmp/phase-3a-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase-3a-preview.log
          exit 1

      - name: Capture Phase 3A production visual audit
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase-3a-cross-screen-visual-audit.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Upload Phase 3A visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3a-cross-screen-visual-audit
          path: artifacts/phase-3a-cross-screen-visual-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3a-cross-screen-visual-audit-failure
          path: |
            playwright-report/
            test-results/
            /tmp/phase-3a-preview.log
          if-no-files-found: ignore
          retention-days: 7
