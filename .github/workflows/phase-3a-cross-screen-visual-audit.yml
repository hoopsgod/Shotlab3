name: Phase 3A Cross-Screen Visual Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: true

jobs:
  cross-screen-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 5 reconciliation contracts
        run: node --test tests/phase-5-cross-screen-reconciliation.test.mjs

      - name: Verify app feedback contracts
        run: node --test tests/app-feedback-system.test.mjs

      - name: Verify premium mobile visual contracts
        run: node --test tests/mobile-premium-visual-system-2026.test.mjs

      - name: Verify first-impression regression contracts
        run: node --test tests/mobile-premium-first-impression-regression.test.mjs

      - name: Verify secondary-page parity contracts
        run: node --test tests/mobile-secondary-page-parity-contract.test.mjs

      - name: Verify Events shared grammar
        run: node --test --test-name-pattern="Coach and Player use one Events design grammar" tests/mobile-events-system-reset.test.mjs

      - name: Verify Events Next Up hierarchy
        run: node --test --test-name-pattern="Next Up owns the first-view date" tests/mobile-events-system-reset.test.mjs

      - name: Verify Player Events privacy
        run: node --test --test-name-pattern="Player Events makes personal RSVP state" tests/mobile-events-system-reset.test.mjs

      - name: Verify Coach Events management intelligence
        run: node --test --test-name-pattern="Coach Events keeps management intelligence" tests/mobile-events-system-reset.test.mjs

      - name: Verify Events RSVP persistence
        run: node --test --test-name-pattern="stable RSVP persistence path" tests/mobile-events-system-reset.test.mjs

      - name: Verify Events mobile density
        run: node --test --test-name-pattern="mobile density and safe-area rules" tests/mobile-events-system-reset.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start built production preview
        run: |
          npm run preview:agent > /tmp/phase-3a-preview.log 2>&1 &
          echo $! > /tmp/phase-3a-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase-3a-preview.log
          exit 1

      - name: Capture Phase 3A and Events production visual audit
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase-3a-cross-screen-visual-audit.spec.mjs tests/e2e/mobile-events-system-reset-screenshots.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Upload production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3a-cross-screen-visual-audit
          path: |
            artifacts/phase-3a-cross-screen-visual-audit/
            artifacts/design-audit/mobile-events-reset/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3a-cross-screen-visual-audit-failure
          path: |
            playwright-report/
            test-results/
            /tmp/phase-3a-preview.log
          if-no-files-found: ignore
          retention-days: 7
