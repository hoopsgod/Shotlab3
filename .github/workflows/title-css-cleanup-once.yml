name: One-time obsolete title CSS cleanup

on:
  pull_request:
    branches: [march-3-reset-85393dd]
    types: [reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/title-authority-repair-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/title-authority-repair-2026
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove dead parallel Player title CSS
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/components/PlayerCommitmentCenter.module.css';
          let css = readFileSync(path, 'utf8');
          const selectors = [
            '.routeHeader',
            '.routeEyebrow',
            '.routeTitleRow',
            '.routeTitleRow h1',
            '.routeTitleRow > span',
            '.routeHeader > p',
          ];
          for (const selector of selectors) {
            const escaped = selector.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            css = css.replace(new RegExp(`\\n?${escaped}\\s*\\{[^{}]*\\}\\s*`, 'g'), '\n');
          }
          for (const legacy of ['.routeHeader', '.routeEyebrow', '.routeTitleRow']) {
            if (css.includes(legacy)) throw new Error(`Obsolete title selector remains: ${legacy}`);
          }
          writeFileSync(path, css.replace(/\n{3,}/g, '\n\n'));
          NODE
          git diff --check
      - name: Self-delete cleanup workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/title-css-cleanup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PlayerCommitmentCenter.module.css
          git commit -m 'Remove obsolete Player commitment title CSS'
          git push origin HEAD:agent/title-authority-repair-2026
