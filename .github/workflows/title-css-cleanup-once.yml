name: One-time obsolete title CSS cleanup

on:
  pull_request:
    branches: [march-3-reset-85393dd]
    types: [reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/title-authority-repair-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/title-authority-repair-2026
          fetch-depth: 0
      - name: Remove dead parallel Player title CSS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/PlayerCommitmentCenter.module.css')
          css = path.read_text()
          selectors = [
              '.routeHeader',
              '.routeEyebrow',
              '.routeTitleRow',
              '.routeTitleRow h1',
              '.routeTitleRow > span',
              '.routeHeader > p',
          ]
          for selector in sorted(selectors, key=len, reverse=True):
              css = re.sub(r'\n?' + re.escape(selector) + r'\s*\{[^{}]*\}\s*', '\n', css)
          for legacy in ('.routeHeader', '.routeEyebrow', '.routeTitleRow'):
              if legacy in css:
                  raise SystemExit(f'Obsolete title selector remains: {legacy}')
          path.write_text(re.sub(r'\n{3,}', '\n\n', css))
          PY
          git diff --check
      - name: Self-delete cleanup workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/title-css-cleanup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PlayerCommitmentCenter.module.css
          git commit -m 'Remove obsolete Player commitment title CSS'
          git push origin HEAD:agent/title-authority-repair-2026
