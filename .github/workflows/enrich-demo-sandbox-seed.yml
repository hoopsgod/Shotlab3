name: Enrich Demo Sandbox Seed

on:
  push:
    branches:
      - agent/demo-paid-experience-unification
    paths:
      - ".github/workflows/enrich-demo-sandbox-seed.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/demo-paid-experience-unification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enrich deterministic demo sandbox data
        run: node scripts/enrich-demo-sandbox-seed.mjs
      - name: Run demo architecture and isolation tests
        run: node --test tests/account-capabilities.test.mjs tests/demo-capability-boundary.test.mjs tests/demo-invitation-safety.test.mjs tests/demo-data-isolation.test.mjs tests/demo-visual-parity-contract.test.mjs
      - name: Commit enriched source and remove one-time tooling
        run: |
          rm scripts/enrich-demo-sandbox-seed.mjs
          rm .github/workflows/enrich-demo-sandbox-seed.yml
          git config user.name "shotlab-unification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Enrich isolated demo sandbox data"
          git push origin HEAD:agent/demo-paid-experience-unification
