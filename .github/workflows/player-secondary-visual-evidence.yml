name: Player Secondary Visual Evidence
run-name: Player secondary visual evidence · ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - src/components/PlayerOperationalWorkspace.jsx
      - src/components/PlayerProgressStory.jsx
      - src/components/PlayerSecondaryVisualSystem.css
      - tests/e2e/player-secondary-visual-evidence.spec.mjs
      - .github/workflows/player-secondary-visual-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-secondary-visual-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact prototype head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out exact production baseline
        uses: actions/checkout@v4
        with:
          ref: 4bb11be8da71989a1d5935185ddeebd75e03ade4
          path: baseline

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install prototype dependencies
        run: npm ci

      - name: Verify prototype production build
        run: npm run build

      - name: Install baseline dependencies and build
        working-directory: baseline
        run: |
          npm ci
          npm run build

      - name: Start exact production baseline preview
        working-directory: baseline
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/player-secondary-baseline.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/player-secondary-baseline.log
          exit 1

      - name: Install pinned Playwright runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture exact-SHA before and after evidence
        env:
          PLAYER_SECONDARY_BASELINE_ORIGIN: http://127.0.0.1:4174
          PLAYER_SECONDARY_PROTOTYPE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx playwright test tests/e2e/player-secondary-visual-evidence.spec.mjs --project=chromium-desktop --reporter=line

      - name: Upload Player secondary visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-secondary-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/player-secondary-visual-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: player-secondary-visual-evidence-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7
