name: Team Store Production Release Gate

on:
  pull_request:
    paths:
      - src/components/TeamStorePortal.jsx
      - src/lib/teamStore.js
      - src/teamStoreEntry.jsx
      - index.html
      - tests/e2e/team-store-production.spec.mjs
      - .github/workflows/team-store-production-gate.yml
  push:
    branches:
      - march-3-reset-85393dd
  workflow_dispatch:
    inputs:
      target_url:
        description: Deployed ShotLab Pages URL to verify
        required: false
        default: https://shotlab3.pages.dev

permissions:
  contents: read
  checks: read

concurrency:
  group: team-store-production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  team-store-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve exact deployed target
        if: github.event_name == 'push'
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            checks="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs?per_page=100")"
            conclusion="$(jq -r --arg sha "$CANDIDATE_SHA" '[.check_runs[] | select(.name == "Cloudflare Pages" and .head_sha == $sha)] | sort_by(.started_at) | last | .conclusion // empty' <<< "$checks")"
            summary="$(jq -r --arg sha "$CANDIDATE_SHA" '[.check_runs[] | select(.name == "Cloudflare Pages" and .head_sha == $sha)] | sort_by(.started_at) | last | .output.summary // empty' <<< "$checks")"
            preview_url="$(grep -oE 'https://[0-9a-f]+\.shotlab3\.pages\.dev' <<< "$summary" | head -n 1 || true)"

            if [ "$conclusion" = "success" ] && [ -n "$preview_url" ] && curl --fail --silent --show-error --location "$preview_url" >/dev/null; then
              echo "Exact-head Cloudflare deployment resolved for ${CANDIDATE_SHA}: ${preview_url}"
              echo "url=${preview_url}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            case "$conclusion" in
              failure|cancelled|timed_out|action_required)
                echo "Cloudflare deployment failed for ${CANDIDATE_SHA} with conclusion ${conclusion}." >&2
                exit 1
                ;;
            esac

            echo "Waiting for exact-head Cloudflare deployment for ${CANDIDATE_SHA} (${attempt}/30)..."
            sleep 10
          done

          echo "No successful exact-head Cloudflare deployment found for ${CANDIDATE_SHA}." >&2
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Team Store before merge
        if: github.event_name == 'pull_request'
        env:
          VITE_SQUADLOCKER_PARTNER_URL: https://partner.example/shotlab?affiliate_id=ci-fixture
        run: |
          set -o pipefail
          npx playwright test tests/e2e/team-store-production.spec.mjs \
            --config=playwright.acceptance.config.mjs \
            --project=mobile-chromium \
            --retries=0 \
            --reporter=line 2>&1 | tee team-store-production-gate.txt

      - name: Verify deployed Team Store after release
        if: github.event_name != 'pull_request'
        env:
          ACCEPTANCE_BASE_URL: ${{ github.event_name == 'push' && steps.deployment.outputs.url || inputs.target_url }}
        shell: bash
        run: |
          set -o pipefail
          echo "Team Store deployed verification against ${ACCEPTANCE_BASE_URL}"
          npx playwright test tests/e2e/team-store-production.spec.mjs \
            --config=playwright.acceptance.config.mjs \
            --project=mobile-chromium \
            --retries=0 \
            --reporter=line 2>&1 | tee team-store-production-gate.txt

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: team-store-production-gate-artifacts
          path: |
            team-store-production-gate.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
