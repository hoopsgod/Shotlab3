name: Team Store Production Release Gate

on:
  pull_request:
    paths:
      - src/components/TeamStorePortal.jsx
      - src/lib/teamStore.js
      - src/teamStoreEntry.jsx
      - index.html
      - tests/e2e/team-store-production.spec.mjs
      - .github/workflows/team-store-production-gate.yml
  push:
    branches:
      - march-3-reset-85393dd
  workflow_dispatch:
    inputs:
      target_url:
        description: Deployed ShotLab Pages URL to verify
        required: false
        default: https://shotlab3.pages.dev

permissions:
  contents: read

concurrency:
  group: team-store-production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  team-store-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACCEPTANCE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url || github.event_name == 'push' && 'https://shotlab3.pages.dev' || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Team Store before merge
        if: github.event_name == 'pull_request'
        env:
          VITE_SQUADLOCKER_PARTNER_URL: https://partner.example/shotlab?affiliate_id=ci-fixture
        run: |
          set -o pipefail
          npx playwright test tests/e2e/team-store-production.spec.mjs \
            --config=playwright.acceptance.config.mjs \
            --project=mobile-chromium \
            --retries=0 \
            --reporter=line 2>&1 | tee team-store-production-gate.txt

      - name: Verify deployed Team Store after release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          for attempt in $(seq 1 10); do
            echo "Team Store production attempt ${attempt}/10 against ${ACCEPTANCE_BASE_URL}"
            if npx playwright test tests/e2e/team-store-production.spec.mjs \
              --config=playwright.acceptance.config.mjs \
              --project=mobile-chromium \
              --retries=0 \
              --reporter=line 2>&1 | tee team-store-production-gate.txt; then
              exit 0
            fi
            if [ "${attempt}" -lt 10 ]; then
              echo "Cloudflare Pages may still be propagating; retrying in 30 seconds."
              sleep 30
            fi
          done
          echo "The deployed Team Store failed the release gate after 10 attempts."
          exit 1

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: team-store-production-gate-artifacts
          path: |
            team-store-production-gate.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
