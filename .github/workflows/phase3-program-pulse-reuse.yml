name: Phase 3 Program Pulse Reuse Wiring

on:
  push:
    branches:
      - agent/phase-3-coach-dashboard
    paths:
      - scripts/apply-phase3-program-pulse-reuse.mjs
      - .github/workflows/phase3-program-pulse-reuse.yml

permissions:
  contents: write

jobs:
  wire-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-coach-dashboard
          fetch-depth: 0
      - run: node scripts/apply-phase3-program-pulse-reuse.mjs
      - name: Validate exact App patch
        run: |
          git diff --check
          git diff -- src/App.jsx
      - name: Commit App reuse wiring
        run: |
          if git diff --quiet -- src/App.jsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Reuse Coach player rows for Program Pulse"
          git push origin HEAD:agent/phase-3-coach-dashboard
