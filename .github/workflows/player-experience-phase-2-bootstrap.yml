name: Bootstrap Player Experience Phase 2

on:
  push:
    branches:
      - agent/player-experience-phase-2-command-surfaces
    paths:
      - .github/workflows/player-experience-phase-2-bootstrap.yml
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - .github/workflows/player-experience-phase-2-bootstrap.yml
      - scripts/patch-player-experience-phase-2.mjs
      - src/components/PlayerExperiencePhase2.jsx
      - src/components/PlayerExperiencePhase2.css

permissions:
  contents: write

jobs:
  integrate-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: agent/player-experience-phase-2-command-surfaces
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic App integration
        run: node scripts/patch-player-experience-phase-2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify player experience contracts
        run: node --test tests/player-experience-phase-2-contract.test.mjs tests/player-daily-command-center.test.mjs tests/player-experience-phase-1-contract.test.mjs

      - name: Build production bundle
        run: npm run build

      - name: Commit verified integration
        run: |
          rm -f scripts/patch-player-experience-phase-2.mjs
          rm -f .github/workflows/player-experience-phase-2-bootstrap.yml
          git config user.name "ShotLab Build Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "integrate player experience phase 2 command surfaces"
          git push origin HEAD:agent/player-experience-phase-2-command-surfaces
