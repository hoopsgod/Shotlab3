name: Signed Player Identity Persistence

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - "functions/v1/players/**"
      - "src/lib/playerIdentityPersistenceService.js"
      - "src/lib/apiFetchBridge.js"
      - "migrations/046_players_signed_api_boundary.sql"
      - "tests/signed-player-identity-persistence.test.mjs"
      - "tests/coach-player-data-management.test.mjs"
      - "tests/signed-session-integrity.test.mjs"
      - "tests/e2e/production-acceptance.spec.mjs"
      - "docs/signed-player-identity-persistence.md"
      - ".github/workflows/signed-player-identity-persistence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-player-identity-persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-player-identity-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify signed player identity contracts
        run: |
          node --test tests/signed-player-identity-persistence.test.mjs
          node --test tests/coach-player-data-management.test.mjs
          node --test tests/signed-session-integrity.test.mjs tests/legacy-registration-session.test.mjs
          node --test tests/team-memberships-confirm-context-route.test.mjs tests/teams-restore-context-route.test.mjs

      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Run isolated production acceptance flow
        run: npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signed-player-identity-persistence-failure
          path: |
            npm-debug.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
