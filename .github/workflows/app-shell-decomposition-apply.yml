name: App Shell Decomposition Apply

on:
  push:
    branches:
      - agent/post-1515-release-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/post-1515-release-stabilization
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply verified App shell decomposition
        run: node scripts/apply-app-shell-default-drill-decomposition.mjs

      - name: Commit extracted drill model
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No decomposition changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract default drill model from App shell"
          git push origin HEAD:agent/post-1515-release-stabilization
