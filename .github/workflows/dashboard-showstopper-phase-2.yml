name: Dashboard Showstopper Phase 2

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - src/components/PlayerDailyCommandCenter.jsx
      - src/components/PlayerDailyCommandCenter.module.css
      - src/components/PlayerDailyPrimitives.jsx
      - src/components/PlayerDailyPrimitives.module.css
      - src/lib/playerPerformanceNarrative.js
      - src/lib/shotlabPerformanceVisual.js
      - tests/dashboard-showstopper-phase-2.test.mjs
      - tests/e2e/dashboard-showstopper-phase-1.spec.mjs
      - tests/e2e/dashboard-showstopper-phase-2.spec.mjs
      - .github/workflows/dashboard-showstopper-phase-2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-showstopper-phase-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify Phase 1 narrative and Phase 2 visual-state contracts
        run: node --test tests/player-daily-command-center.test.mjs tests/dashboard-showstopper-phase-1.test.mjs tests/player-experience-phase-1-contract.test.mjs tests/player-first-result-release-quality.test.mjs tests/dashboard-showstopper-phase-2.test.mjs

      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Verify performance budget
        run: npm run verify:performance-budget

      - name: Run exact-head Player Home hierarchy and proprietary visual E2E
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: dashboard-showstopper-phase-2-e2e.json
        run: |
          set -o pipefail
          npx playwright test tests/e2e/dashboard-showstopper-phase-1.spec.mjs tests/e2e/dashboard-showstopper-phase-2.spec.mjs --project=chromium-desktop --reporter=line,json 2>&1 | tee dashboard-showstopper-phase-2-e2e.log

      - name: Record exact candidate SHA and performance evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/dashboard-showstopper-phase-2
          git rev-parse HEAD > artifacts/dashboard-showstopper-phase-2/exact-head-sha.txt
          node scripts/verify-performance-budget.mjs > artifacts/dashboard-showstopper-phase-2/performance-budget.txt 2>&1 || true

      - name: Upload exact-head Phase 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-showstopper-phase-2-evidence
          path: |
            artifacts/dashboard-showstopper-phase-2/
            artifacts/dashboard-showstopper-phase-1/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-showstopper-phase-2-failure
          path: |
            dashboard-showstopper-phase-2-e2e.log
            dashboard-showstopper-phase-2-e2e.json
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
