name: Season Archive Live Preview Smoke

on:
  push:
    branches:
      - march-3-reset-85393dd
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: season-archive-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_PREVIEW_URL: https://shotlab3.pages.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deployed production smoke test
        run: |
          set +e
          npx playwright test tests/e2e/season-archive-live-preview.spec.mjs --project=chromium-desktop --reporter=line > live-preview-smoke.txt 2>&1
          status=$?
          cat live-preview-smoke.txt
          exit $status

      - name: Upload live smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: season-archive-production-smoke-artifacts
          path: |
            live-preview-smoke.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
