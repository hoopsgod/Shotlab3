name: Production Acceptance E2E

on:
  pull_request:
  push:
    branches:
      - march-3-reset-85393dd
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional deployed ShotLab URL to test instead of the local Vite server
        required: false
        default: https://shotlab3.pages.dev

permissions:
  contents: read

concurrency:
  group: production-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCEPTANCE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url || github.event_name == 'push' && 'https://shotlab3.pages.dev' || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify demo cleanup preserves registered rows
        run: node --test tests/demo-mode-cleanup.test.mjs

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run isolated acceptance flow
        if: github.event_name != 'push'
        run: npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Run post-deployment production acceptance
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            echo "Production acceptance attempt ${attempt}/10 against ${ACCEPTANCE_BASE_URL}"
            if npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line; then
              exit 0
            fi
            if [ "${attempt}" -lt 10 ]; then
              echo "Cloudflare deployment may still be propagating; retrying in 30 seconds."
              sleep 30
            fi
          done
          echo "Production acceptance failed after 10 attempts."
          exit 1

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
