name: Production Acceptance E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional deployed ShotLab URL to test instead of the local Vite server
        required: false
        default: https://shotlab3.pages.dev

permissions:
  contents: write

jobs:
  apply-roster-migration-fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/production-acceptance-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/production-acceptance-e2e
          fetch-depth: 0

      - name: Apply migration tombstone patch
        run: node scripts/apply-roster-migration-tombstone-fix.mjs

      - name: Verify targeted lifecycle tests
        run: node --test tests/player-removal-lifecycle-stabilization.test.mjs tests/remote-persistence-shape.test.mjs tests/coach-player-data-management.test.mjs

      - name: Commit migration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/lib/playerDataManagement.js tests/player-removal-lifecycle-stabilization.test.mjs
          git commit -m "fix: preserve removed roster tombstones during migration"
          git push origin HEAD:codex/production-acceptance-e2e

  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACCEPTANCE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify demo cleanup preserves registered rows
        run: node --test tests/demo-mode-cleanup.test.mjs

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run isolated production acceptance flow
        run: npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
