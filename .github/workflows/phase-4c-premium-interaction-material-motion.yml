name: Phase 4C Premium Interaction Material

on:
  pull_request:
    branches:
      - agent/phase-4b-premium-performance-marks
    paths:
      - "package.json"
      - "src/components/MobileNavigation.jsx"
      - "scripts/apply-phase4c-premium-interaction-material-motion.mjs"
      - "public/shotlab-phase4c-interaction-material-motion.css"
      - "tests/phase-4c-premium-interaction-material-motion.test.mjs"
      - "tests/phase-4b-premium-performance-marks.test.mjs"
      - "tests/e2e/phase-4c-premium-interaction-material-motion-screenshots.spec.mjs"
      - ".github/workflows/phase-4c-premium-interaction-material-motion.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-4c-interaction-material-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-interaction-material:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply full production enhancer chain
        run: npm run prepare:route-enhancers

      - name: Verify Phase 4C and predecessor contracts
        run: node --test tests/phase-4c-premium-interaction-material-motion.test.mjs tests/phase-4b-premium-performance-marks.test.mjs tests/phase-4a-signature-visual-identity.test.mjs tests/phase-3v-final-reconciliation.test.mjs tests/phase-3u-player-account-control.test.mjs tests/mobile-navigation-contract.test.mjs tests/app-store-mobile-shell.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify current mobile navigation
        run: npx playwright test tests/e2e/mobile-navigation.spec.mjs --config=playwright.config.mjs --reporter=line

      - name: Verify production acceptance
        run: npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Capture Phase 4C iPhone evidence
        run: npx playwright test tests/e2e/phase-4c-premium-interaction-material-motion-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload Phase 4C evidence
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-4c-premium-interaction-material-motion-evidence
          path: |
            artifacts/design-audit/iphone/10a-phase4c-player-dock-material.png
            artifacts/design-audit/iphone/10b-phase4c-player-more-material.png
            artifacts/design-audit/iphone/10c-phase4c-player-score-focus.png
            artifacts/design-audit/iphone/10d-phase4c-player-training-completion.png
            artifacts/design-audit/iphone/10e-phase4c-coach-material-regression.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 4C failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-4c-premium-interaction-material-motion-failure
          path: |
            test-results/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
