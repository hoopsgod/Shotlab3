name: Phase 4F Minifier Lock Generator

on:
  pull_request:
    branches:
      - agent/phase-4e-final-polish

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve exact structural CSS optimizer
        run: npm install --save-dev --save-exact csso@latest

      - name: Verify production optimizer toolchain is exact
        run: |
          node -e "const p=require('./package.json'); const d=p.devDependencies; if(d.terser!=='5.49.2'||d.lightningcss!=='1.33.0'||!/^\\d+\\.\\d+\\.\\d+$/.test(d.csso||'')) process.exit(1); console.log('terser', d.terser); console.log('lightningcss', d.lightningcss); console.log('csso', d.csso)"

      - name: Commit reproducible manifests if needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Optimizer manifests already reproducible."
            exit 0
          fi
          git config user.name "shotlab-ci"
          git config user.email "shotlab-ci@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Phase 4F: lock structural CSS optimizer"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
