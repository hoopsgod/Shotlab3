name: Phase 4F Minifier Lock Generator

on:
  pull_request:
    branches:
      - agent/phase-4e-final-polish

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from exact manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify exact production minifiers are locked
        run: |
          node -e "const lock=require('./package-lock.json'); const root=lock.packages[''].devDependencies; if(root.terser!=='5.49.2'||root.lightningcss!=='1.33.0') process.exit(1); console.log('terser', root.terser); console.log('lightningcss', root.lightningcss)"

      - name: Commit reproducible lockfile if needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Minifier manifests already reproducible."
            exit 0
          fi
          git config user.name "shotlab-ci"
          git config user.email "shotlab-ci@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Phase 4F: lock production minifier dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
