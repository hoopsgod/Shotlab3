name: Temporary Title Authority Source Migration

on:
  push:
    branches: [agent/title-authority-repair-2026]
    paths:
      - '.github/workflows/title-authority-source-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/title-authority-repair-2026
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move residual Coach decision mutation into React source
        run: node scripts/title-authority-source-migration.mjs
      - name: Verify migration shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'const unresolvedRsvps = Math.max(0, Number(eventReadiness?.missing) || 0);' src/components/CoachCommandCenter.jsx
          grep -F 'label: "Review RSVPs"' src/components/CoachCommandCenter.jsx
          ! grep -F 'update("src/components/CoachCommandCenter.jsx"' scripts/apply-phase5a-coach-daily-intelligence.mjs
      - name: Commit source-ownership migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CoachCommandCenter.jsx scripts/apply-phase5a-coach-daily-intelligence.mjs
          if git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git commit -m 'Move Coach RSVP intelligence into source ownership'
          git push origin HEAD:agent/title-authority-repair-2026
