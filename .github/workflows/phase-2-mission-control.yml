name: Phase 2 Mission Control Hierarchy

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - "src/styles/MissionControlHierarchy2026.css"
      - "src/main.jsx"
      - "src/components/CoachCommandCenter.jsx"
      - "tests/mission-control-hierarchy-2026.test.mjs"
      - "tests/e2e/mission-control-hierarchy-2026.spec.mjs"
      - ".github/workflows/phase-2-mission-control.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-2-mission-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 2 source contracts
        run: node --test tests/mission-control-hierarchy-2026.test.mjs tests/visual-foundation-2026.test.mjs tests/workspace-recovery.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Run Mission Control mobile acceptance
        run: npx playwright test tests/e2e/mission-control-hierarchy-2026.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Upload Phase 2 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-2-mission-control-evidence
          path: artifacts/mission-control-phase-2/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-2-mission-control-failure
          path: |
            playwright-report/
            test-results/
            artifacts/mission-control-phase-2/
          if-no-files-found: ignore
          retention-days: 7
