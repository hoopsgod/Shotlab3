name: Player Experience Phase 2 E2E

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - src/App.jsx
      - src/components/PlayerOperationalWorkspace.jsx
      - src/components/PlayerOperationalWorkspace.module.css
      - src/lib/playerOperationalWorkspaces.js
      - tests/player-operational-workspaces.test.mjs
      - tests/player-experience-phase-2-contract.test.mjs
      - tests/e2e/player-experience-phase-2.spec.mjs
      - .github/workflows/player-experience-phase-2-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-experience-phase-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  player-operational-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify workspace selectors and source contracts
        run: node --test tests/player-operational-workspaces.test.mjs tests/player-experience-phase-2-contract.test.mjs tests/player-daily-command-center.test.mjs tests/player-experience-phase-1-contract.test.mjs

      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run Player operational workspace mobile flows
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: player-experience-phase-2.json
        run: |
          set -o pipefail
          npx playwright test tests/e2e/player-experience-phase-2.spec.mjs --project=chromium-desktop --reporter=line,json 2>&1 | tee player-experience-phase-2.log

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: player-experience-phase-2-e2e-artifacts
          path: |
            player-experience-phase-2.log
            player-experience-phase-2.json
            test-results
            playwright-report
          if-no-files-found: error
          retention-days: 7
