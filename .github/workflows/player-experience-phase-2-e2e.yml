name: Player Experience Phase 2 E2E
run-name: Phase 1 visual verification · ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - src/App.jsx
      - src/main.jsx
      - src/styles/VisualFoundation2026.css
      - src/theme/appTokens.js
      - src/theme/semanticColors.js
      - src/components/AppHeader.jsx
      - src/components/AuthWorkspace.jsx
      - src/components/MobileNavigation.module.css
      - src/components/DeferredShotLabCharts.jsx
      - src/components/ShotLabCharts.jsx
      - src/components/DeferredPremiumLeaderboardsHub.jsx
      - src/components/PremiumLeaderboardsHub.jsx
      - src/components/DeferredCoachCommandCenter.jsx
      - src/components/CoachCommandCenter.jsx
      - src/components/CoachMissionControlV2.css
      - src/components/CoachMissionControlShell.css
      - src/components/CoachMissionControlHeader.css
      - src/components/CoachMissionControlPolish.css
      - src/components/CoachMissionControl2026.css
      - src/components/CoachMissionControlFinal.css
      - src/components/CoachActivationPath.css
      - src/components/CoachPriorityOverlay.css
      - src/components/DeferredCoachDashboardPhase2.jsx
      - src/components/CoachDashboardPhase2.jsx
      - src/components/CoachDashboardPhase2.module.css
      - src/components/DeferredCoachInteractiveDashboards.jsx
      - src/components/CoachInteractiveDashboards.jsx
      - src/components/SecondaryPageSystem.jsx
      - src/components/ExperiencePrimitives.jsx
      - src/components/DeferredPlayerCareerHistory.jsx
      - src/components/PlayerCareerHistory.jsx
      - src/components/PlayerCareerHistory.module.css
      - src/components/DeferredPlayerDashboardHeader.jsx
      - src/components/DeferredPlayerDailyCommandCenter.jsx
      - src/components/DeferredPlayerOperationalWorkspace.jsx
      - src/components/PlayerInterfaceFallback.jsx
      - src/components/PlayerInterfaceFallback.module.css
      - src/components/PlayerDashboardHeader.jsx
      - src/components/PlayerDashboardHeader.module.css
      - src/components/PlayerDailyCommandCenter.jsx
      - src/components/PlayerDailyCommandCenter.module.css
      - src/components/PlayerDailyPrimitives.jsx
      - src/components/PlayerDailyPrimitives.module.css
      - src/components/PlayerOperationalWorkspace.jsx
      - src/components/PlayerOperationalWorkspace.module.css
      - src/components/PlayerCoachAssignmentCard.jsx
      - src/components/PlayerCoachAssignmentCard.module.css
      - src/lib/playerOperationalWorkspaces.js
      - vite.config.js
      - tests/visual-foundation-2026.test.mjs
      - tests/performance-decomposition.test.mjs
      - tests/player-interface-decomposition.test.mjs
      - tests/player-operational-workspaces.test.mjs
      - tests/player-experience-phase-2-contract.test.mjs
      - tests/e2e/visual-foundation-2026.spec.mjs
      - tests/e2e/performance-decomposition.spec.mjs
      - tests/e2e/player-experience-phase-2.spec.mjs
      - .github/workflows/player-experience-phase-2-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-experience-phase-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  player-operational-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify workspace selectors and source contracts
        run: node --test tests/visual-foundation-2026.test.mjs tests/player-operational-workspaces.test.mjs tests/player-experience-phase-2-contract.test.mjs tests/player-daily-command-center.test.mjs tests/player-experience-phase-1-contract.test.mjs tests/performance-decomposition.test.mjs tests/player-interface-decomposition.test.mjs

      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run Player operational, deferred-workspace, and Phase 1 visual flows
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: player-experience-phase-2.json
        run: |
          set -o pipefail
          npx playwright test tests/e2e/visual-foundation-2026.spec.mjs tests/e2e/player-experience-phase-2.spec.mjs tests/e2e/performance-decomposition.spec.mjs --project=chromium-desktop --reporter=line,json 2>&1 | tee player-experience-phase-2.log

      - name: Upload Phase 1 visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-visual-foundation-screenshots
          path: artifacts/visual-foundation
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: player-experience-phase-2-e2e-artifacts
          path: |
            player-experience-phase-2.log
            player-experience-phase-2.json
            test-results
            playwright-report
          if-no-files-found: error
          retention-days: 7
