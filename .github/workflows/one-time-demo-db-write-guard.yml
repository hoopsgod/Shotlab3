name: One-time Demo DB Write Guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-demo-db-write-guard:
    if: github.head_ref == 'codex/add-season-archive-functionality-for-shotlab-0b4b9f'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/add-season-archive-functionality-for-shotlab-0b4b9f
          fetch-depth: 0

      - name: Block direct remote writes during demo mode
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()
          old = '''    if (strictLocal && !localPersisted) throw (localError || new Error("local_persist_failed"));
    const table = TABLE_MAP[k];'''
          new = '''    if (strictLocal && !localPersisted) throw (localError || new Error("local_persist_failed"));
    if (isDemoMode()) return { localPersisted, remoteSkipped: "demo_local_only" };
    const table = TABLE_MAP[k];'''

          if new in text:
              print('Direct demo write guard is already present.')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print('Patched direct demo write guard.')
          else:
              raise SystemExit('Expected DB.set persistence boundary was not found.')
          PY

      - name: Commit guard fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix(demo): block direct remote persistence writes"
          git push origin HEAD:codex/add-season-archive-functionality-for-shotlab-0b4b9f
