name: Apply Player Experience Phase 2

on:
  push:
    branches:
      - agent/player-experience-phase-2
    paths:
      - scripts/apply-player-experience-phase-2.mjs
      - .github/workflows/apply-player-experience-phase-2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/player-experience-phase-2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace selectors
        run: node --test tests/player-operational-workspaces.test.mjs tests/player-daily-command-center.test.mjs

      - name: Apply Player Experience Phase 2 integration
        run: node scripts/apply-player-experience-phase-2.mjs

      - name: Verify production build
        run: npm run build

      - name: Commit verified integration
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "integrate player operational workspaces"
          git push origin HEAD:agent/player-experience-phase-2
