name: Phase 5A Route Enhancer Orchestration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5a-route-enhancer-orchestration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route-enhancer-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify orchestration contract
        run: node --test tests/phase-5a-route-enhancer-orchestration.test.mjs
      - name: Build through centralized enhancer pipeline
        run: npm run build
      - name: Verify production performance budget
        run: npm run verify:performance-budget
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5a-route-enhancer-orchestration-performance
          path: artifacts/performance/
          if-no-files-found: warn
          retention-days: 14
