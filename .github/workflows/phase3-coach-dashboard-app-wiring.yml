name: Phase 3 Coach Dashboard App Wiring

on:
  push:
    branches:
      - agent/phase-3-coach-dashboard
    paths:
      - scripts/apply-phase3-coach-dashboard-app-wiring.mjs
      - .github/workflows/phase3-coach-dashboard-app-wiring.yml

permissions:
  contents: write

jobs:
  wire-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-3-coach-dashboard
          fetch-depth: 0
      - name: Apply guarded App wiring
        run: node scripts/apply-phase3-coach-dashboard-app-wiring.mjs
      - name: Validate patch
        run: |
          git diff --check
          git diff -- src/App.jsx
      - name: Commit exact App wiring
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App wiring changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Wire truthful Program Pulse into Coach Home"
          git push origin HEAD:agent/phase-3-coach-dashboard
