name: Isolate Demo Auth Session

on:
  push:
    branches:
      - agent/demo-paid-experience-unification
    paths:
      - ".github/workflows/isolate-demo-auth-session.yml"

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/demo-paid-experience-unification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clear real auth before demo session startup
        run: node scripts/isolate-demo-auth-session.mjs
      - name: Run auth, capability, and cleanup contracts
        run: node --test tests/demo-mode-cleanup.test.mjs tests/account-capabilities.test.mjs tests/demo-capability-boundary.test.mjs tests/demo-data-isolation.test.mjs tests/demo-invitation-safety.test.mjs
      - name: Commit isolated source and remove one-time tooling
        run: |
          rm scripts/isolate-demo-auth-session.mjs
          rm .github/workflows/isolate-demo-auth-session.yml
          git config user.name "shotlab-unification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Clear subscribed auth before demo entry"
          git push origin HEAD:agent/demo-paid-experience-unification
