name: Phase 3 Desktop Authority Closure

on:
  push:
    branches:
      - agent/phase-3-coach-dashboard
    paths:
      - '.github/workflows/phase3-desktop-authority-closure.yml'
      - 'scripts/apply-phase3-desktop-authority-closure.mjs'

permissions:
  contents: write

concurrency:
  group: phase3-desktop-authority-closure
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-3-coach-dashboard
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned viewport debugger
        run: npm install --no-save --package-lock=false @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Move desktop authority to source-owned title stage
        run: node scripts/apply-phase3-desktop-authority-closure.mjs

      - name: Verify hierarchy ownership and Phase 3 scope
        run: node --test tests/mission-control-hierarchy-2026.test.mjs tests/phase3-coach-home-scope.test.mjs

      - name: Run Viewport Debug fast loop
        run: npm run debug:viewport -- --widths=320,375,390,430

      - name: Enforce production performance budget
        run: npm run build:performance

      - name: Verify production build
        run: npm run build

      - name: Commit only verified source repair
        run: |
          git rm .github/workflows/phase3-desktop-authority-closure.yml scripts/apply-phase3-desktop-authority-closure.mjs
          git add src/styles/MissionControlHierarchy2026.css src/components/CoachMissionControlTitleStage.css tests/phase3-coach-home-scope.test.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize Coach Home desktop authority closure"
          git push origin HEAD:agent/phase-3-coach-dashboard
