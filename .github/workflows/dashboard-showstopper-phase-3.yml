name: Dashboard Showstopper Phase 3

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - src/components/PlayerDailyPrimitives.jsx
      - src/components/PlayerDailyPrimitives.module.css
      - src/components/PlayerProgressStory.jsx
      - src/components/PlayerProgressStory.module.css
      - src/components/PlayerTrainingCompletion.jsx
      - src/components/PlayerTrainingCompletion.module.css
      - src/lib/shotlabPerformanceVisual.js
      - tests/dashboard-showstopper-phase-3.test.mjs
      - tests/e2e/dashboard-showstopper-phase-2.spec.mjs
      - tests/e2e/phase-3p-player-training-completion-screenshots.spec.mjs
      - tests/e2e/phase-3r-player-progress-story-screenshots.spec.mjs
      - tests/e2e/coach-dashboard-phase-2.spec.mjs
      - tests/e2e/demo-paid-parity.spec.mjs
      - playwright.phase3-mobile.config.mjs
      - .github/workflows/dashboard-showstopper-phase-3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-showstopper-phase-3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact production-closeout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify Phase 1 through Phase 3 architecture contracts
        run: node --test tests/player-daily-command-center.test.mjs tests/dashboard-showstopper-phase-1.test.mjs tests/dashboard-showstopper-phase-2.test.mjs tests/dashboard-showstopper-phase-3.test.mjs tests/player-experience-phase-1-contract.test.mjs tests/player-first-result-release-quality.test.mjs tests/player-interface-decomposition.test.mjs tests/phase-2-command-hierarchy.test.mjs tests/phase-3-unified-experience.test.mjs

      - name: Install pinned Playwright test runner
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Verify unchanged performance budget
        run: npm run verify:performance-budget

      - name: Run exact-head Target Court propagation and regression E2E
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: dashboard-showstopper-phase-3-e2e.json
        run: |
          set -o pipefail
          npx playwright test tests/e2e/dashboard-showstopper-phase-2.spec.mjs tests/e2e/coach-dashboard-phase-2.spec.mjs tests/e2e/demo-paid-parity.spec.mjs --project=chromium-desktop --reporter=line,json 2>&1 | tee dashboard-showstopper-phase-3-e2e.log
          npx playwright test tests/e2e/phase-3p-player-training-completion-screenshots.spec.mjs tests/e2e/phase-3r-player-progress-story-screenshots.spec.mjs --config=playwright.phase3-mobile.config.mjs --project=chromium-phase3-mobile --reporter=line 2>&1 | tee -a dashboard-showstopper-phase-3-e2e.log

      - name: Record exact candidate SHA and performance evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/dashboard-showstopper-phase-3
          git rev-parse HEAD > artifacts/dashboard-showstopper-phase-3/exact-head-sha.txt
          node scripts/verify-performance-budget.mjs > artifacts/dashboard-showstopper-phase-3/performance-budget.txt 2>&1 || true
          if [ -f build-metrics.json ]; then cp build-metrics.json artifacts/dashboard-showstopper-phase-3/build-metrics.json; fi
          cp -R artifacts/design-audit artifacts/dashboard-showstopper-phase-3/design-audit 2>/dev/null || true

      - name: Upload exact-head Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-showstopper-phase-3-evidence
          path: |
            artifacts/dashboard-showstopper-phase-3/
            artifacts/dashboard-showstopper-phase-2/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-showstopper-phase-3-failure
          path: |
            dashboard-showstopper-phase-3-e2e.log
            dashboard-showstopper-phase-3-e2e.json
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
