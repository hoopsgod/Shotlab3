name: Phase 3P Player Training Completion

on:
  pull_request:
    branches:
      - agent/phase-3o-player-training-session
    paths:
      - "src/App.jsx"
      - "src/components/PlayerTrainingCompletion.jsx"
      - "src/components/PlayerTrainingCompletion.module.css"
      - "public/shotlab-phase3p-player-training-completion.css"
      - "index.html"
      - "playwright.screenshots.config.mjs"
      - "scripts/apply-phase3p-player-training-completion.mjs"
      - "tests/phase-3p-player-training-completion.test.mjs"
      - "tests/e2e/phase-3p-player-training-completion-screenshots.spec.mjs"
      - "package.json"
      - ".github/workflows/phase-3p-player-training-completion.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-3p-player-training-completion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-player-training-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 3P contracts
        run: node --test tests/phase-3p-player-training-completion.test.mjs tests/phase-3o-player-training-session.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture and verify iPhone training completion
        run: npx playwright test tests/e2e/phase-3p-player-training-completion-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload Phase 3P evidence
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3p-player-training-completion-evidence
          path: |
            artifacts/design-audit/iphone/04r-player-training-completion.png
            artifacts/design-audit/iphone/04s-player-training-share-secondary.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 3P failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3p-player-training-completion-failure
          path: |
            test-results/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
