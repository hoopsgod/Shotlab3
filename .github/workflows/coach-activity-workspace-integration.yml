name: Coach Activity Workspace Integration

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-activity-workspace:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/coach-dashboard-phase-2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/coach-dashboard-phase-2
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply dedicated Activity workspace
        run: node scripts/apply-coach-activity-workspace.mjs

      - name: Verify Phase 2 selectors and contracts
        run: node --test tests/coach-operational-intelligence.test.mjs tests/coach-dashboard-phase-2-contract.test.mjs

      - name: Install application dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Commit verified Activity workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx tests/coach-dashboard-phase-2-contract.test.mjs tests/e2e/coach-dashboard-phase-2.spec.mjs
          git commit -m "feat: add dedicated coach activity intelligence workspace"
          git pull --rebase origin agent/coach-dashboard-phase-2
          git push origin HEAD:agent/coach-dashboard-phase-2
