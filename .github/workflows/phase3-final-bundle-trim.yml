name: Phase 3 Final Bundle Trim

on:
  push:
    branches:
      - agent/phase-3-coach-dashboard
    paths:
      - scripts/apply-phase3-final-bundle-trim.mjs
      - .github/workflows/phase3-final-bundle-trim.yml

permissions:
  contents: write

jobs:
  trim-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3-coach-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-phase3-final-bundle-trim.mjs
      - run: |
          cp src/components/CoachCommandCenter.jsx /tmp/CoachCommandCenter.jsx
          cp tests/coach-command-center-10x.test.mjs /tmp/coach-command-center-10x.test.mjs
          git diff --check
          node --test tests/coach-program-pulse.test.mjs tests/phase3-coach-home-scope.test.mjs tests/coach-command-center-10x.test.mjs tests/coach-operational-dashboard.test.mjs
      - run: npm run build:performance
      - run: |
          cp /tmp/CoachCommandCenter.jsx src/components/CoachCommandCenter.jsx
          cp /tmp/coach-command-center-10x.test.mjs tests/coach-command-center-10x.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3-final-bundle-trim.yml scripts/apply-phase3-final-bundle-trim.mjs
          git add src/components/CoachCommandCenter.jsx tests/coach-command-center-10x.test.mjs
          git diff --cached --check
          git commit -m "Trim redundant Program Pulse presentation cost"
          git push origin HEAD:agent/phase-3-coach-dashboard
