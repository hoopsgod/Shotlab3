name: Phase 3 Release Certification

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-3-release-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact Phase 3 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 2 and Phase 3 visual contracts
        run: node --test tests/phase-2-contrast-integrity.test.mjs tests/phase-3-visual-coherence-contract.test.mjs

      - name: Verify exact-head production build
        run: npm run build

      - name: Install Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture 390px primary visual matrix
        run: npx playwright test tests/e2e/phase-3a-cross-screen-visual-audit.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Capture secondary, 430px, and desktop certification matrix
        run: npx playwright test tests/e2e/phase-3-release-certification.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload Phase 3 certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3-release-certification
          path: |
            artifacts/phase-3a-cross-screen-visual-audit/
            artifacts/phase-3-release-certification/
            test-results/
          if-no-files-found: warn
          retention-days: 14
