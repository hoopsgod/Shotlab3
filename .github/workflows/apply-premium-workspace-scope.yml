name: Apply Premium Workspace Scope

on:
  push:
    branches:
      - codex/high-end-workspace-system
  pull_request:
    branches:
      - march-3-reset-85393dd

permissions:
  contents: write

jobs:
  apply-scope:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/high-end-workspace-system'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/high-end-workspace-system
          fetch-depth: 0

      - name: Apply workspace scope patch
        run: node scripts/apply-premium-workspace-scope.mjs

      - name: Verify source contracts
        run: |
          grep -q 'import "./styles/PremiumWorkspace.css";' src/App.jsx
          grep -q 'performance-shell--player' src/App.jsx
          grep -q 'performance-shell--coach' src/App.jsx
          grep -q 'performance-workspace--coach' src/App.jsx
          grep -q 'performance-workspace--player' src/App.jsx

      - name: Commit scoped shell changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "Premium workspace scopes are already committed."
            exit 0
          fi
          git commit -m "feat: apply premium workspace scopes across coach and player shells"
          git fetch origin codex/high-end-workspace-system
          git rebase origin/codex/high-end-workspace-system
          git push --force-with-lease origin HEAD:codex/high-end-workspace-system
