name: V9 Apply Focused Fixes

on:
  pull_request:
    paths:
      - ".github/workflows/v9-apply-focused-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-decomposition-v9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused mobile and bootstrap fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          mobile = Path("public/shotlab-v3-mobile-corrections.css")
          mobile_text = mobile.read_text()
          old_mobile = '''/* Assignment accountability is a secondary workflow, not home-screen priority. */
          @media (max-width: 700px) {
            body.mission-control-active [data-testid="coach-assignment-accountability"] {
              display: none !important;
            }
          '''
          new_mobile = '''/* Mobile coaches must retain access to live operational evidence and assignment follow-up. */
          @media (max-width: 700px) {
            body.mission-control-active [data-testid="coach-assignment-accountability"],
            body.mission-control-active [data-testid="coach-live-activity"] {
              display: block !important;
            }
          '''
          if new_mobile not in mobile_text:
              if old_mobile not in mobile_text:
                  raise SystemExit("Expected mobile accountability rule not found")
              mobile.write_text(mobile_text.replace(old_mobile, new_mobile, 1))

          main = Path("src/main.jsx")
          main_text = main.read_text()
          main_import = "import { installPlayerAssignmentEnhancer } from './lib/playerAssignmentEnhancer.js'\n"
          if main_import not in main_text:
              anchor = "import { clearStaleDemoSession, isDemoRuntimeEnabled } from './lib/runtimeReleaseReadiness.js'\n"
              if anchor not in main_text:
                  raise SystemExit("main.jsx import anchor missing")
              main_text = main_text.replace(anchor, anchor + main_import, 1)
          main_call = "installPlayerAssignmentEnhancer()\n"
          if main_call not in main_text:
              anchor = "registerRuntimeListeners()\n"
              if anchor not in main_text:
                  raise SystemExit("main.jsx startup anchor missing")
              main_text = main_text.replace(anchor, anchor + main_call, 1)
          main.write_text(main_text)

          invitation = Path("tests/e2e/coach-player-invitation.spec.mjs")
          invitation_text = invitation.read_text()
          old_invitation = '''async function enterCoachPlayers(page) {
            await page.goto("/");
            const demoCoach = page.getByRole("button", { name: "Demo Coach", exact: true });
            const players = page.getByRole("button", { name: "Players", exact: true });
            await expect(page.getByRole("button", { name: /^(Demo Coach|Players)$/ }).first()).toBeVisible({ timeout: 15_000 });
            if (await demoCoach.isVisible()) await demoCoach.click();
            await expect(players).toBeVisible({ timeout: 15_000 });
            await players.click();
          }
          '''
          new_invitation = '''async function enterCoachPlayers(page) {
            await page.goto("/");
            const dock = page.getByTestId("mobile-navigation-dock");
            await expect(dock).toBeVisible({ timeout: 15_000 });
            const players = dock.getByRole("button", { name: "Players", exact: true });
            await expect(players).toBeVisible();
            await players.click();
          }
          '''
          if new_invitation not in invitation_text:
              if old_invitation not in invitation_text:
                  raise SystemExit("Invitation navigation helper block missing")
              invitation.write_text(invitation_text.replace(old_invitation, new_invitation, 1))

          accountability_test = Path("tests/coach-assignment-accountability.test.mjs")
          accountability_text = accountability_test.read_text()
          marker = 'test("mobile accountability remains visible and actionable", () => {'
          if marker not in accountability_text:
              accountability_text += '''

          test("mobile accountability remains visible and actionable", () => {
            const mobileCss = fs.readFileSync(new URL("../public/shotlab-v3-mobile-corrections.css", import.meta.url), "utf8");
            assert.match(mobileCss, /coach-assignment-accountability[\\s\\S]{0,180}display:\\s*block\\s*!important/);
            assert.doesNotMatch(mobileCss, /coach-assignment-accountability[^}]*display:\\s*none\\s*!important/);
          });
          '''
              accountability_test.write_text(accountability_text)

          response_test = Path("tests/coach-player-response-loop.test.mjs")
          response_text = response_test.read_text()
          marker = 'test("mobile live activity remains visible for coach response workflows", () => {'
          if marker not in response_text:
              response_text += '''

          test("mobile live activity remains visible for coach response workflows", () => {
            const mobileCss = fs.readFileSync(new URL("../public/shotlab-v3-mobile-corrections.css", import.meta.url), "utf8");
            assert.match(mobileCss, /coach-live-activity[\\s\\S]{0,120}display:\\s*block\\s*!important/);
          });
          '''
              response_test.write_text(response_text)

          delivery_test = Path("tests/player-assignment-delivery.test.mjs")
          delivery_text = delivery_test.read_text()
          main_read = '  const startup = fs.readFileSync(new URL("../src/main.jsx", import.meta.url), "utf8");\n'
          if main_read not in delivery_text:
              anchor = '  const bootstrap = fs.readFileSync(new URL("../src/lib/coachActivationPath.js", import.meta.url), "utf8");\n'
              if anchor not in delivery_text:
                  raise SystemExit("Player assignment source contract anchor missing")
              delivery_text = delivery_text.replace(anchor, anchor + main_read, 1)
          startup_assertions = '''  assert.match(startup, /import \\{ installPlayerAssignmentEnhancer \\} from ['"]\\.\\/lib\\/playerAssignmentEnhancer\\.js['"]/);
            assert.match(startup, /installPlayerAssignmentEnhancer\\(\\)/);
          '''
          if "assert.match(startup, /installPlayerAssignmentEnhancer" not in delivery_text:
              anchor = '  assert.match(bootstrap, /installPlayerAssignmentEnhancer\\(\\)/);\n'
              if anchor not in delivery_text:
                  raise SystemExit("Player assignment assertion anchor missing")
              delivery_text = delivery_text.replace(anchor, anchor + startup_assertions, 1)
          delivery_test.write_text(delivery_text)
          PY
      - name: Run focused source contracts
        run: node --test tests/coach-assignment-accountability.test.mjs tests/coach-player-response-loop.test.mjs tests/player-assignment-delivery.test.mjs
      - name: Commit focused fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shotlab-v3-mobile-corrections.css src/main.jsx tests/e2e/coach-player-invitation.spec.mjs tests/coach-assignment-accountability.test.mjs tests/coach-player-response-loop.test.mjs tests/player-assignment-delivery.test.mjs
          git commit -m "fix: restore mobile operational workflows"
          git push origin HEAD:agent/performance-decomposition-v9
