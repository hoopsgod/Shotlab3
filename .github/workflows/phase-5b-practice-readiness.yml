name: Phase 5B Practice Readiness

on:
  pull_request:
    branches:
      - agent/phase-5a1-performance-headroom
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_ENABLE_PRODUCTION_DEMOS: 'true'

jobs:
  verify-practice-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and enforce unchanged performance budget
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/performance
          npm run build:performance 2>&1 | tee artifacts/performance/phase5b-build.log

      - name: Preserve Phase 5A.1 headroom
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const metrics = JSON.parse(fs.readFileSync('artifacts/performance/build-metrics.json', 'utf8'))
          const total = Number(metrics?.totals?.javaScriptGzipBytes || 0)
          const ceiling = 348000
          if (!total || total > ceiling) {
            console.error(`Phase 5B total JavaScript gzip ${total} exceeds ${ceiling}-byte headroom guard.`)
            process.exit(1)
          }
          console.log(`Phase 5B JS gzip ${total} <= ${ceiling}; at least ${365000 - total} bytes remain under the unchanged global ceiling.`)
          NODE

      - name: Verify Phase 5B and predecessor contracts
        run: >-
          node --test
          tests/phase-5b-practice-readiness.test.mjs
          tests/coach-operational-dashboard.test.mjs
          tests/coach-action-briefings.test.mjs
          tests/coach-inbox.test.mjs
          tests/coach-operational-intelligence.test.mjs
          tests/phase-5a1-performance-headroom.test.mjs
          tests/phase-5a-coach-daily-intelligence.test.mjs
          tests/phase-4f-performance-architecture-hardening.test.mjs

      - name: Verify production chunk graph is acyclic
        shell: bash
        run: |
          if grep -F "Circular chunk" artifacts/performance/phase5b-build.log; then
            echo "Circular manual-chunk relationship detected."
            exit 1
          fi
          echo "No circular chunk warnings detected."

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production acceptance
        run: npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Verify Auth and Player Demo entry
        run: npx playwright test tests/e2e/auth-player-entry-regression.spec.mjs --config=playwright.production-built.config.mjs --reporter=line

      - name: Verify Phase 5B practice readiness and capture iPhone evidence
        run: npx playwright test tests/e2e/phase-5b-practice-readiness.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Verify Phase 5A Coach decision hierarchy regression
        run: npx playwright test tests/e2e/phase-5a-coach-daily-intelligence.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Verify inherited four-screen 430x932 visual regression
        run: npx playwright test tests/e2e/phase-4e-final-polish-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload Phase 5B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-5b-practice-readiness-evidence
          path: |
            artifacts/performance/
            artifacts/design-audit/iphone/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
