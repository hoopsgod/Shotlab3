name: Phase 4 Product Reset Certification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: true
  BASELINE_SHA: b0f1181f126b52f1816ea99887d0c2b309ad2c83

concurrency:
  group: phase-4-product-reset-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head and certified baseline ancestry
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'Expected head: %s\nActual head:   %s\nBaseline:      %s\n' "$expected" "$actual" "$BASELINE_SHA"
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 4 behavioral contracts
        run: >-
          node --test
          tests/phase-4-product-reset-interaction-contract.test.mjs
          tests/phase-4-premium-experience-closure.test.mjs
          tests/phase-4-premium-states-motion.test.mjs
          tests/coach-player-invitation-contract.test.mjs
          tests/phase-3-visual-coherence-contract.test.mjs
          tests/demo-visual-parity-contract.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build exact production candidate
        run: npm run build

      - name: Verify unchanged performance budget
        run: npm run verify:performance-budget

      - name: Start built production preview
        shell: bash
        run: |
          npm run preview:agent > /tmp/phase-4-product-reset-preview.log 2>&1 &
          echo $! > /tmp/phase-4-product-reset-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase-4-product-reset-preview.log
          exit 1

      - name: Certify premium mobile interactions and working states
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase-4-product-reset-interaction-certification.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Retain broad Coach and Player interaction ergonomics
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase-4a-interaction-state-audit.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Retain targeted mobile touch contracts
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          tests/e2e/phase-4d-shared-back-hit-area.spec.mjs
          tests/e2e/phase-4e4-player-program-rsvp-hit-area.spec.mjs
          tests/e2e/phase-4e6-player-profile-tabs-hit-area.spec.mjs
          tests/e2e/phase-4e10-player-profile-account-touch-safety.spec.mjs
          tests/e2e/phase-4e11-coach-residual-touch-safety.spec.mjs
          --config=playwright.acceptance.config.mjs --reporter=line

      - name: Certify mobile navigation and Coach Player flows
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/mobile-navigation.spec.mjs tests/e2e/design-system-screenshots.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Run production acceptance
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Certify Demo and registered parity
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/demo-registered-live-parity.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Capture mandatory 375-430 mobile visual matrix
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase-3a-cross-screen-visual-audit.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Capture secondary, Team Store, 430px, and desktop matrix
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase-3-release-certification.spec.mjs tests/e2e/phase-3-team-store-portal-certification.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Record exact certified SHA
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/phase-4-product-reset-certification
          git rev-parse HEAD > artifacts/phase-4-product-reset-certification/exact-head-sha.txt
          printf '%s\n' "$BASELINE_SHA" > artifacts/phase-4-product-reset-certification/baseline-sha.txt

      - name: Upload Phase 4 interaction and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-product-reset-certification
          path: |
            artifacts/phase-4-product-reset-interaction/
            artifacts/phase-4a-interaction-state-audit/
            artifacts/phase-4d-shared-back-hit-area/
            artifacts/phase-4e4-player-program-rsvp-hit-area/
            artifacts/phase-4e6-player-profile-tabs-hit-area/
            artifacts/phase-4e10-player-profile-account-touch-safety/
            artifacts/phase-4e11-coach-residual-touch-safety/
            artifacts/phase-3a-cross-screen-visual-audit/
            artifacts/phase-3-release-certification/
            artifacts/phase-4-product-reset-certification/
            tests/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-product-reset-certification-failure
          path: |
            playwright-report/
            test-results/
            /tmp/phase-4-product-reset-preview.log
          if-no-files-found: ignore
          retention-days: 7
