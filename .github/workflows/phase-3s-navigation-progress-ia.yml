name: Phase 3S Navigation Progress IA

on:
  pull_request:
    branches:
      - agent/phase-3r-player-progress-intelligence
    paths:
      - "src/components/MobileNavigation.jsx"
      - "tests/mobile-navigation-contract.test.mjs"
      - "tests/app-store-mobile-shell.test.mjs"
      - "tests/e2e/mobile-navigation.spec.mjs"
      - "tests/e2e/phase-3s-navigation-progress-ia-screenshots.spec.mjs"
      - "playwright.screenshots.config.mjs"
      - ".github/workflows/phase-3s-navigation-progress-ia.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-3s-navigation-progress-ia-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-navigation-progress-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 3S contracts
        run: node --test tests/app-store-mobile-shell.test.mjs tests/mobile-navigation-contract.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify player and coach mobile navigation
        run: npx playwright test tests/e2e/mobile-navigation.spec.mjs --config=playwright.config.mjs --reporter=line

      - name: Capture exact-head iPhone navigation evidence
        run: npx playwright test tests/e2e/phase-3s-navigation-progress-ia-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload Phase 3S evidence
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3s-navigation-progress-ia-evidence
          path: |
            artifacts/design-audit/iphone/04x-player-development-first-dock.png
            artifacts/design-audit/iphone/04y-player-progress-direct-destination.png
            artifacts/design-audit/iphone/04z-player-more-rankings-hierarchy.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 3S failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3s-navigation-progress-ia-failure
          path: |
            test-results/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
