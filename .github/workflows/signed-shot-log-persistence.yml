name: Signed Shot Log Persistence

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - "functions/v1/home-shots/_middleware.js"
      - "functions/v1/home-shots/log.js"
      - "functions/v1/shot-logs/**"
      - "src/lib/apiFetchBridge.js"
      - "src/lib/apiIdentityHeaders.js"
      - "src/lib/legacySignedCollectionPersistence.js"
      - "src/lib/remotePersistence.js"
      - "src/lib/scorePersistenceService.js"
      - "src/lib/shotLogPersistenceService.js"
      - "src/lib/supabase.js"
      - "migrations/042_shot_logs_signed_api_boundary.sql"
      - "tests/signed-shot-log-persistence.test.mjs"
      - "tests/remote-persistence-hydration-merge.test.mjs"
      - "tests/phase3c-shot-log-hydration-ownership.test.mjs"
      - "tests/home-shots-legacy-profile-fallback-middleware.test.mjs"
      - "tests/home-shots-log-route.test.mjs"
      - "tests/home-shots-roster-identity.test.mjs"
      - "tests/player-home-shot-logging-save-path.test.mjs"
      - "tests/demo-capability-boundary.test.mjs"
      - "docs/signed-shot-log-persistence.md"
      - ".github/workflows/signed-shot-log-persistence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-shot-log-persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-shot-log-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify signed shot-log authorization and API boundary
        run: node --test tests/signed-shot-log-persistence.test.mjs

      - name: Verify shot-log hydration reconciliation
        run: node --test tests/remote-persistence-hydration-merge.test.mjs tests/phase3c-shot-log-hydration-ownership.test.mjs

      - name: Verify legacy profile fallback middleware
        run: node --test tests/home-shots-legacy-profile-fallback-middleware.test.mjs

      - name: Verify home-shot route and roster identity
        run: node --test tests/home-shots-log-route.test.mjs tests/home-shots-roster-identity.test.mjs

      - name: Verify Player home-shot save path
        shell: bash
        run: |
          node --test --test-name-pattern='^(?!(index\.html does not use a MutationObserver workaround to hide Team Sync panel|stale local_pending or background_saved rows do not show the orange retry panel, but failed_sync rows do|Demo Player logs 123 shots locally without Team Sync warning or retry repair|Demo Player session shot logs are removed on logout while registered shots remain)$).*' tests/player-home-shot-logging-save-path.test.mjs

      - name: Verify current sandbox capability boundary
        run: node --test tests/demo-capability-boundary.test.mjs

      - name: Verify production build
        run: npm run build
