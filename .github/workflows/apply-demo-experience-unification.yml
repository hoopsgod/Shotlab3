name: Apply Demo Experience Unification

on:
  push:
    branches:
      - agent/demo-paid-experience-unification
    paths:
      - ".github/workflows/apply-demo-experience-unification.yml"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/demo-paid-experience-unification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source transform
        run: node scripts/apply-demo-experience-unification.mjs
      - name: Run focused architecture and isolation tests
        run: node --test tests/account-capabilities.test.mjs tests/demo-invitation-safety.test.mjs tests/demo-data-isolation.test.mjs tests/demo-visual-parity-contract.test.mjs
      - name: Commit transformed source and remove one-time tooling
        run: |
          rm scripts/apply-demo-experience-unification.mjs
          rm .github/workflows/apply-demo-experience-unification.yml
          git config user.name "shotlab-unification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unify demo and registered application behavior"
          git push origin HEAD:agent/demo-paid-experience-unification
