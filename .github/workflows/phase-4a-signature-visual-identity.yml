name: Phase 4A Signature Visual Identity

on:
  pull_request:
    branches:
      - agent/phase-3v-final-reconciliation-closure
    paths:
      - "package.json"
      - "src/components/ShotLabSignatureField.jsx"
      - "src/components/ShotLabSignatureField.module.css"
      - "scripts/apply-phase4a-signature-visual-identity.mjs"
      - "public/shotlab-phase4a-signature-identity.css"
      - "tests/phase-4a-signature-visual-identity.test.mjs"
      - "tests/phase-3u-player-account-control.test.mjs"
      - "tests/e2e/phase-4a-signature-visual-identity-screenshots.spec.mjs"
      - "playwright.screenshots.config.mjs"
      - ".github/workflows/phase-4a-signature-visual-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-4a-signature-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-signature-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply full production enhancer chain
        run: npm run prepare:route-enhancers

      - name: Verify Phase 4A and predecessor contracts
        run: node --test tests/phase-4a-signature-visual-identity.test.mjs tests/phase-3v-final-reconciliation.test.mjs tests/phase-3u-player-account-control.test.mjs tests/mobile-navigation-contract.test.mjs tests/app-store-mobile-shell.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify current mobile navigation
        run: npx playwright test tests/e2e/mobile-navigation.spec.mjs --config=playwright.config.mjs --reporter=line

      - name: Verify production acceptance
        run: npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Capture Phase 4A iPhone evidence
        run: npx playwright test tests/e2e/phase-4a-signature-visual-identity-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload Phase 4A evidence
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-4a-signature-visual-identity-evidence
          path: |
            artifacts/design-audit/iphone/08a-phase4a-auth-signature.png
            artifacts/design-audit/iphone/08b-phase4a-player-home-signature.png
            artifacts/design-audit/iphone/08c-phase4a-player-progress-signature.png
            artifacts/design-audit/iphone/08d-phase4a-player-rankings-signature.png
            artifacts/design-audit/iphone/08e-phase4a-coach-existing-signature.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 4A failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-4a-signature-visual-identity-failure
          path: |
            test-results/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
