name: Phase 1C Focused Visual Runtime Guardrails

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1c-focused-visual-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-visual-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_ENABLE_PRODUCTION_DEMOS: "true"
      VITE_SUPABASE_URL: "https://parity.supabase.co"
      VITE_SUPABASE_ANON_KEY: "parity-anon-key"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright runner and Chromium
        run: |
          npm install --no-save @playwright/test@1.55.1
          npx playwright install --with-deps chromium

      - name: Build exact production assets
        run: npm run build

      - name: Regenerate only reviewed Players 390 baseline
        run: |
          npx playwright test --config=playwright.phase1c.config.mjs --grep "coach-players-registered-populated-390 focused visual/runtime contract" --update-snapshots=changed

      - name: Commit baseline and restore closure workflow
        env:
          SNAPSHOT: tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/coach-players-registered-populated-390-mobile-chromium-linux.png
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git checkout HEAD^ -- .github/workflows/phase1c-focused-visual-runtime.yml
          git add "$SNAPSHOT" .github/workflows/phase1c-focused-visual-runtime.yml
          mapfile -t changed < <(git diff --cached --name-only)
          printf 'staged: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/phase1c-focused-visual-runtime.yml'
          printf '%s\n' "${changed[@]}" | grep -Fxq "$SNAPSHOT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update intentional Phase 2 Players visual baseline"
          git push origin HEAD:"$BRANCH"
