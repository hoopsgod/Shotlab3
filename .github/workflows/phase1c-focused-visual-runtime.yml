name: Phase 1C Focused Visual Runtime Guardrails

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: phase1c-focused-visual-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-visual-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_ENABLE_PRODUCTION_DEMOS: "true"
      VITE_SUPABASE_URL: "https://parity.supabase.co"
      VITE_SUPABASE_ANON_KEY: "parity-anon-key"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Restore reviewed Coach Home 320 baseline
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/coach-accountability-team-context'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/phase1c-reviewed
          mkdir -p /tmp/phase1c-reviewed
          gh run download 34179242864 \
            --repo "${{ github.repository }}" \
            --name phase1c-focused-mobile-visual-runtime-4235c4b7ba2ab1744559ed1465ac42bb9c9b5704 \
            --dir /tmp/phase1c-reviewed
          ACTUAL="$(find /tmp/phase1c-reviewed -type f -name 'coach-home-edge-320-actual.png' -print -quit)"
          test -n "$ACTUAL"
          file "$ACTUAL" | grep -q 'PNG image data'
          TARGET='tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/coach-home-edge-320-mobile-chromium-linux.png'
          cp "$ACTUAL" "$TARGET"
          git add -- "$TARGET"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Restore reviewed Coach Home 320 visual baseline'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright runner and Chromium
        run: |
          npm install --no-save @playwright/test@1.55.1
          npx playwright install --with-deps chromium

      - name: Build exact production assets
        run: npm run build

      - name: Record exact head
        run: |
          mkdir -p artifacts/phase1c
          git rev-parse HEAD > artifacts/phase1c/exact-head-sha.txt

      - name: Run committed Phase 1C mobile visual/runtime guardrails
        run: npx playwright test --config=playwright.phase1c.config.mjs

      - name: Re-run accepted Phase 1B mobile parity on Chromium
        run: npx playwright test --config=playwright.phase1b.config.mjs --project=mobile-chromium

      - name: Re-run accepted Phase 1A mobile geometry on Chromium
        run: npm run test:e2e:phase1a -- --project=mobile-chromium

      - name: Upload Phase 1C mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-focused-mobile-visual-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/phase1c/
            tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/
          if-no-files-found: error
          retention-days: 21
