name: Phase 1C Focused Visual Runtime Guardrails

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1c-focused-visual-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-visual-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_ENABLE_PRODUCTION_DEMOS: "true"
      VITE_SUPABASE_URL: "https://parity.supabase.co"
      VITE_SUPABASE_ANON_KEY: "parity-anon-key"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright runner and Chromium
        run: |
          npm install --no-save @playwright/test@1.55.1
          npx playwright install --with-deps chromium

      - name: Build exact production assets
        run: npm run build

      - name: Record exact head
        run: |
          mkdir -p artifacts/phase1c
          git rev-parse HEAD > artifacts/phase1c/exact-head-sha.txt

      - name: Accept the reviewed Coach Home baselines and restore this workflow
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.phase1c.config.mjs --update-snapshots
          snapshot_root='tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots'
          cat > /tmp/expected-snapshots.txt <<'EOF'
          tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/coach-home-branding-stress-390-mobile-chromium-linux.png
          tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/coach-home-edge-320-mobile-chromium-linux.png
          tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/coach-home-edge-430-mobile-chromium-linux.png
          tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/coach-mission-control-demo-empty-390-mobile-chromium-linux.png
          tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/coach-mission-control-registered-empty-390-mobile-chromium-linux.png
          EOF
          git diff --name-only -- "$snapshot_root" | sort > /tmp/actual-snapshots.txt
          sort -o /tmp/expected-snapshots.txt /tmp/expected-snapshots.txt
          if ! diff -u /tmp/expected-snapshots.txt /tmp/actual-snapshots.txt; then
            echo 'Unexpected visual baseline change set; refusing to commit.' >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin 16b41cd2d7898cff2c7855f493ce25e67842a9ac
          git show 16b41cd2d7898cff2c7855f493ce25e67842a9ac:.github/workflows/phase1c-focused-visual-runtime.yml > .github/workflows/phase1c-focused-visual-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$snapshot_root" .github/workflows/phase1c-focused-visual-runtime.yml
          git commit -m 'Accept approved Coach Home visual baselines'
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Run committed Phase 1C mobile visual/runtime guardrails
        run: npx playwright test --config=playwright.phase1c.config.mjs

      - name: Re-run accepted Phase 1B mobile parity on Chromium
        run: npx playwright test --config=playwright.phase1b.config.mjs --project=mobile-chromium

      - name: Re-run accepted Phase 1A mobile geometry on Chromium
        run: npm run test:e2e:phase1a -- --project=mobile-chromium

      - name: Upload Phase 1C mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1c-focused-mobile-visual-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/phase1c/
            tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/
          if-no-files-found: error
          retention-days: 21
