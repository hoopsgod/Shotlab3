name: Phase 1C Focused Visual Runtime Guardrails

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1c-focused-visual-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-visual-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_ENABLE_PRODUCTION_DEMOS: "true"
      VITE_SUPABASE_URL: "https://parity.supabase.co"
      VITE_SUPABASE_ANON_KEY: "parity-anon-key"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright runner and Chromium
        run: |
          npm install --no-save @playwright/test@1.55.1
          npx playwright install --with-deps chromium

      - name: Build exact production assets
        run: npm run build

      - name: Update reviewed Player Progress snapshot only
        run: >-
          npx playwright test
          --config=playwright.phase1c.config.mjs
          --grep "player-progress-registered-populated-390"
          --update-snapshots

      - name: Restore workflow and commit reviewed baseline
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT='tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/player-progress-registered-populated-390-mobile-chromium-linux.png'
          test -f "$SNAPSHOT"
          git show bad8689e7ca2990c1ea851959d76a38e233335a2:.github/workflows/phase1c-focused-visual-runtime.yml > .github/workflows/phase1c-focused-visual-runtime.yml
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "$SNAPSHOT"
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/phase1c-focused-visual-runtime.yml'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SNAPSHOT" .github/workflows/phase1c-focused-visual-runtime.yml
          git commit -m 'test: accept reviewed Player Progress baseline'
          git push origin HEAD:agent/player-phase1-mobile-layout-readability-repair
