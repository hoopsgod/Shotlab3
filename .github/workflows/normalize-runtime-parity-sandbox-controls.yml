name: Normalize Runtime Parity Sandbox Controls

on:
  push:
    branches:
      - agent/demo-paid-experience-unification
    paths:
      - ".github/workflows/normalize-runtime-parity-sandbox-controls.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/demo-paid-experience-unification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize the explicitly allowed sandbox-only utility
        run: node scripts/allow-sandbox-controls-in-runtime-parity.mjs
      - name: Run parity source contracts
        run: node --test tests/demo-visual-parity-contract.test.mjs tests/demo-capability-boundary.test.mjs tests/account-capabilities.test.mjs
      - name: Commit normalized spec and remove one-time tooling
        run: |
          rm scripts/allow-sandbox-controls-in-runtime-parity.mjs
          rm .github/workflows/normalize-runtime-parity-sandbox-controls.yml
          git config user.name "shotlab-unification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Normalize allowed sandbox controls in parity checks"
          git push origin HEAD:agent/demo-paid-experience-unification
