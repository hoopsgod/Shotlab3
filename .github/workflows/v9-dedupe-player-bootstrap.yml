name: V9 Deduplicate Player Bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/v9-dedupe-player-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-decomposition-v9
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Move Player assignment ownership fully out of Coach bootstrap
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          coach = Path("src/lib/coachActivationPath.js")
          text = coach.read_text()
          text = text.replace('import { installPlayerAssignmentEnhancer } from "./playerAssignmentEnhancer.js";\n', '')
          text = text.replace('installPlayerAssignmentEnhancer();\n', '')
          coach.write_text(text)

          delivery = Path("tests/player-assignment-delivery.test.mjs")
          text = delivery.read_text()
          text = text.replace(
              '  assert.match(bootstrap, /installPlayerAssignmentEnhancer\\(\\)/);\n',
              '  assert.doesNotMatch(bootstrap, /installPlayerAssignmentEnhancer\\(\\)/);\n',
          )
          delivery.write_text(text)

          visual = Path("tests/visual-system-reboot.test.mjs")
          text = visual.read_text()
          old = '''test("visual reboot installs last without adding product writes", () => {
            const playerIndex = bootstrap.indexOf("installPlayerAssignmentEnhancer();");
            const rebootIndex = bootstrap.indexOf("installVisualSystemReboot();");
            assert.ok(playerIndex >= 0 && rebootIndex > playerIndex);
            assert.doesNotMatch(source, /fetch\\(|localStorage|sessionStorage|supabase|XMLHttpRequest|\\.insert\\(|\\.update\\(/);
          });'''
          new = '''test("visual reboot installs last without adding product writes", () => {
            const responseIndex = bootstrap.indexOf("installCoachResponseLoopEnhancer();");
            const rebootIndex = bootstrap.indexOf("installVisualSystemReboot();");
            assert.ok(responseIndex >= 0 && rebootIndex > responseIndex);
            assert.doesNotMatch(bootstrap, /installPlayerAssignmentEnhancer\\(\\)/);
            assert.doesNotMatch(source, /fetch\\(|localStorage|sessionStorage|supabase|XMLHttpRequest|\\.insert\\(|\\.update\\(/);
          });'''
          if new not in text:
              if old not in text:
                  raise SystemExit("Visual reboot contract block not found")
              text = text.replace(old, new, 1)
          visual.write_text(text)
          PY
      - name: Verify source contracts
        run: node --test tests/player-assignment-delivery.test.mjs tests/visual-system-reboot.test.mjs tests/player-interface-decomposition.test.mjs
      - name: Verify production budget before commit
        run: npm run build:performance
      - name: Commit deduplicated ownership
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/coachActivationPath.js tests/player-assignment-delivery.test.mjs tests/visual-system-reboot.test.mjs
          git commit -m "perf: deduplicate player assignment bootstrap"
          git push origin HEAD:agent/performance-decomposition-v9
