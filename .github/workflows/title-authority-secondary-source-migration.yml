name: Temporary Secondary Title Source Migration

on:
  push:
    branches: [agent/title-authority-repair-2026]
    paths:
      - '.github/workflows/title-authority-secondary-source-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/title-authority-repair-2026
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/title-authority-secondary-source-migration.mjs
      - name: Commit source-owned Coach route titles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git commit -m 'Move Coach secondary titles into source ownership'
          git push origin HEAD:agent/title-authority-repair-2026
