name: Phase 3T Native Iconography Semantics

on:
  pull_request:
    branches:
      - agent/phase-3s-navigation-progress-ia
    paths:
      - "src/components/MobileNavigation.jsx"
      - "tests/app-store-mobile-shell.test.mjs"
      - "tests/mobile-navigation-contract.test.mjs"
      - "tests/e2e/mobile-navigation.spec.mjs"
      - "tests/e2e/phase-3t-native-iconography-screenshots.spec.mjs"
      - "playwright.screenshots.config.mjs"
      - ".github/workflows/phase-3t-native-iconography-semantics.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-3t-native-iconography-semantics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-iconography:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify navigation and App Store contracts
        run: node --test tests/app-store-mobile-shell.test.mjs tests/mobile-navigation-contract.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify player and coach navigation behavior
        run: npx playwright test tests/e2e/mobile-navigation.spec.mjs --config=playwright.config.mjs --reporter=line

      - name: Capture exact-head iPhone iconography evidence
        run: npx playwright test tests/e2e/phase-3t-native-iconography-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload Phase 3T evidence
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3t-native-iconography-evidence
          path: |
            artifacts/design-audit/iphone/05a-player-native-iconography.png
            artifacts/design-audit/iphone/05b-player-secondary-iconography.png
            artifacts/design-audit/iphone/05c-coach-native-iconography.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 3T failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3t-native-iconography-failure
          path: |
            test-results/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
