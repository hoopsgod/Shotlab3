name: Phase 5A.1 Performance Headroom

on:
  pull_request:
    branches:
      - agent/phase-5a-coach-daily-intelligence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5a1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_ENABLE_PRODUCTION_DEMOS: 'true'

jobs:
  verify-performance-headroom:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and enforce existing performance budget
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/performance
          npm run build:performance 2>&1 | tee artifacts/performance/phase5a1-build.log

      - name: Report source weight by production chunk
        run: node scripts/report-phase5a1-source-weight.mjs

      - name: Verify Phase 5A and Phase 4F contracts
        run: node --test tests/phase-5a-coach-daily-intelligence.test.mjs tests/phase-4f-performance-architecture-hardening.test.mjs

      - name: Verify production chunk graph is acyclic
        shell: bash
        run: |
          if grep -F "Circular chunk" artifacts/performance/phase5a1-build.log; then
            echo "Circular manual-chunk relationship detected."
            exit 1
          fi
          echo "No circular chunk warnings detected."

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production acceptance
        run: npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Verify Auth and Player Demo entry
        run: npx playwright test tests/e2e/auth-player-entry-regression.spec.mjs --config=playwright.production-built.config.mjs --reporter=line

      - name: Verify Phase 5A Coach Daily Brief and capture iPhone evidence
        run: npx playwright test tests/e2e/phase-5a-coach-daily-intelligence.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Verify inherited 430x932 visual regression
        run: npx playwright test tests/e2e/phase-4e-final-polish-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Report rendered production weight by source module
        shell: bash
        run: |
          set -o pipefail
          npx vite build --config vite.phase5a1.config.js 2>&1 | tee artifacts/performance/rendered-analysis-build.log

      - name: Upload Phase 5A.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-5a1-performance-evidence
          path: |
            artifacts/performance/
            artifacts/design-audit/iphone/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
