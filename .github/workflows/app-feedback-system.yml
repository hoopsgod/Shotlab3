name: Phase 4 Premium States and Feedback

on:
  pull_request:
    paths:
      - "src/components/AppFeedbackLayer.jsx"
      - "src/components/AppFeedbackLayer.css"
      - "src/components/ReleaseReadinessBoundary.jsx"
      - "src/components/ShotLabStatePanel.jsx"
      - "src/components/ShotLabStatePanel.module.css"
      - "src/components/MobileNavigation.module.css"
      - "src/components/VisualHierarchy.jsx"
      - "src/components/VisualHierarchy.module.css"
      - "src/components/PlayerTrainingCompletion.jsx"
      - "src/components/PlayerTrainingCompletion.module.css"
      - "src/styles/PremiumMotion2026.css"
      - "src/screens/CoachTeamBrandingScreen.jsx"
      - "tests/app-feedback-system.test.mjs"
      - "tests/phase-4-premium-states-motion.test.mjs"
      - "tests/phase-4-premium-experience-closure.test.mjs"
      - "tests/phase-5-cross-screen-reconciliation.test.mjs"
      - ".github/workflows/app-feedback-system.yml"

jobs:
  verify-phase-4-premium-states:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify premium state and motion contracts
        run: node --test tests/app-feedback-system.test.mjs tests/phase-4-premium-states-motion.test.mjs tests/phase-4-premium-experience-closure.test.mjs tests/phase-5-cross-screen-reconciliation.test.mjs
      - name: Build application
        run: npm run build
