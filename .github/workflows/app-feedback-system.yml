name: App Feedback System

on:
  pull_request:
    paths:
      - "src/components/AppFeedbackLayer.jsx"
      - "src/components/AppFeedbackLayer.css"
      - "src/screens/CoachTeamBrandingScreen.jsx"
      - "tests/app-feedback-system.test.mjs"
      - ".github/workflows/app-feedback-system.yml"

jobs:
  verify-feedback-system:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify feedback contracts
        run: node --test tests/app-feedback-system.test.mjs
      - name: Build application
        run: npm run build
