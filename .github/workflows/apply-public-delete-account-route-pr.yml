name: Apply Public Delete Account Route PR

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - "scripts/route-public-delete-account-page.mjs"
      - "tests/legal-routes-regression.test.mjs"
      - "tests/e2e/public-submission-routes.spec.mjs"
      - "native/app-store-public-urls.json"
      - ".github/workflows/apply-public-delete-account-route-pr.yml"

permissions:
  contents: write

concurrency:
  group: apply-public-delete-account-route-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply signed-out deletion route behavior
        run: node scripts/route-public-delete-account-page.mjs

      - name: Verify legal and public URL contracts
        run: |
          node --test tests/legal-routes-regression.test.mjs
          node --test tests/app-store-public-url-readiness.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify direct public routes
        run: npx playwright test tests/e2e/public-submission-routes.spec.mjs --config=playwright.acceptance.config.mjs --project=chromium-desktop --reporter=json > public-route-results.json

      - name: Upload route diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-delete-route-diagnostics
          path: |
            public-route-results.json
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit verified App integration
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx route changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "route signed-out account deletion to public information"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
