name: Phase 3 Coach Home Finish

on:
  push:
    branches:
      - agent/phase-3-coach-dashboard
    paths:
      - scripts/apply-phase3-coach-home-finish.mjs
      - .github/workflows/phase3-coach-home-finish.yml

permissions:
  contents: write

jobs:
  stabilize-coach-home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-3-coach-dashboard
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Apply scoped Coach Home architecture repair
        run: node scripts/apply-phase3-coach-home-finish.mjs

      - name: Minimize Program Pulse runtime model to required fields
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const patch = (path, pairs) => {
            let source = readFileSync(path, 'utf8');
            for (const [before, after] of pairs) {
              if (!source.includes(before)) throw new Error(`Missing final seam in ${path}: ${before}`);
              source = source.replace(before, after);
            }
            writeFileSync(path, source);
          };
          patch('src/lib/coachOperationalDashboard.js', [
            ['  const eligibleAthletes = safeRows.length;\n', ''],
            ['  const totalGoal = goal > 0 ? goal * eligibleAthletes : 0;', '  const totalGoal = goal > 0 ? goal * safeRows.length : 0;'],
            ['  const creditedMakes = totalGoal ? safeRows.reduce((total, row) => total + Math.min(Math.max(0, safeNumber(row.weeklyMakes)), goal), 0) : 0;\n  const value = totalGoal ? Math.round((creditedMakes / totalGoal) * 100) : null;', '  const value = totalGoal ? Math.round((safeRows.reduce((total, row) => total + Math.min(row.weeklyMakes, goal), 0) / totalGoal) * 100) : null;'],
            ['    total: eligibleAthletes,', '    total: safeRows.length,'],
            ['    programPulse: totalGoal\n      ? { available: true, value, displayValue: `${value}%`, detail: `${Math.round(creditedMakes)} of ${Math.round(totalGoal)} weekly makes`, eligibleAthletes, creditedMakes, totalGoal }\n      : { available: false, value: null, displayValue: "—", detail: "No weekly goal data", eligibleAthletes, creditedMakes: 0, totalGoal: 0 },', '    programPulse: { value },'],
          ]);
          patch('src/components/CoachCommandCenter.jsx', [
            ['  const available = Boolean(model?.available);\n', ''],
            ['{model?.displayValue || "—"}', '{model?.value == null ? "—" : `${model.value}%`}'],
            ['`${available ? model?.value : 0}%`', '`${model?.value || 0}%`'],
            ['<strong>{available ? "Weekly goal progress" : "Goal data unavailable"}</strong>', '<strong>Weekly goal progress</strong>'],
            ['<small>{model?.detail || "No weekly goal data"}</small>', '<small>{model?.value == null ? "No weekly goal data" : "Weekly makes target"}</small>'],
          ]);
          patch('tests/coach-command-center-10x.test.mjs', [
            ['  assert.match(source,/model\\?\\.displayValue \\|\\| "—"/);', '  assert.match(source,/model\\?\\.value == null \\? "—"/);'],
            ['  assert.match(source,/model\\?\\.detail \\|\\| "No weekly goal data"/);', '  assert.match(source,/model\\?\\.value == null \\? "No weekly goal data"/);'],
          ]);
          NODE

      - name: Lock behavioral Program Pulse contracts
        shell: bash
        run: |
          cat > tests/coach-program-pulse.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { buildCoachPlayerDashboardMetrics, buildCoachPlayerDashboardRows } from "../src/lib/coachOperationalDashboard.js";

          const roster = [
            { email: "ava@example.com", name: "Ava" },
            { email: "jordan@example.com", name: "Jordan" },
          ];
          const rowsFor = (shotLogs = [], players = roster) => buildCoachPlayerDashboardRows({ players, shotLogs, weekStart: "2026-08-23" });
          const pulseFor = (shotLogs = [], weeklyGoal = 500, players = roster) => buildCoachPlayerDashboardMetrics(rowsFor(shotLogs, players), weeklyGoal).programPulse.value;

          test("Program Pulse caps every athlete at the shared Coach weekly goal", () => {
            assert.equal(pulseFor([
              { email: "ava@example.com", made: 650, date: "2026-08-24" },
              { email: "jordan@example.com", made: 250, date: "2026-08-25" },
            ]), 75);
          });

          test("one over-goal athlete cannot compensate beyond that athlete's capped 100 percent", () => {
            assert.equal(pulseFor([
              { email: "ava@example.com", made: 900, date: "2026-08-24" },
              { email: "jordan@example.com", made: 100, date: "2026-08-25" },
            ]), 60);
          });

          test("valid weekly goal with zero weekly makes produces zero percent", () => assert.equal(pulseFor([], 500), 0));

          test("missing, zero, negative, or rosterless weekly goals are unavailable", () => {
            assert.deepEqual([
              buildCoachPlayerDashboardMetrics(rowsFor(), undefined).programPulse.value,
              pulseFor([], 0), pulseFor([], -25), pulseFor([], 500, []),
            ], [null, null, null, null]);
          });

          test("out-of-week activity does not inflate Program Pulse", () => {
            assert.equal(pulseFor([
              { email: "ava@example.com", made: 100, date: "2026-08-23" },
              { email: "ava@example.com", made: 500, date: "2026-08-16" },
            ], 400), 13);
          });

          test("non-roster activity does not inflate Program Pulse", () => {
            assert.equal(pulseFor([
              { email: "ava@example.com", made: 100, date: "2026-08-23" },
              { email: "not-on-roster@example.com", made: 999, date: "2026-08-25" },
            ], 400), 13);
          });

          test("Coach identity never counts as an eligible Program Pulse athlete", () => {
            const players = [...roster, { email: "coach@example.com", name: "Coach", role: "coach", isCoach: true }];
            const rows = rowsFor([
              { email: "ava@example.com", made: 100, date: "2026-08-23" },
              { email: "coach@example.com", made: 999, date: "2026-08-25" },
            ], players);
            assert.equal(rows.length, 2);
            assert.equal(buildCoachPlayerDashboardMetrics(rows, 400).programPulse.value, 13);
          });
          EOF

      - name: Run focused Coach Home contracts
        run: |
          git diff --check
          node --test tests/coach-program-pulse.test.mjs tests/phase3-coach-home-scope.test.mjs tests/coach-command-center-10x.test.mjs tests/coach-operational-dashboard.test.mjs

      - name: Install pinned viewport debugger
        run: npm install --no-save --package-lock=false @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify viewport debugger contracts
        run: node --test tests/viewport-debug-tooling.test.mjs

      - name: Run Coach Home viewport fast loop
        run: npm run debug:viewport -- --role=coach --widths=320,375,390,430

      - name: Enforce production performance budget
        run: npm run build:performance

      - name: Verify final tree discipline
        run: |
          git diff --check
          test ! -e scripts/apply-phase3-coach-home-finish.mjs
          test ! -e .github/workflows/phase3-coach-home-finish.yml
          git status --short

      - name: Commit stabilized Phase 3 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fold Program Pulse into Coach metrics pipeline"
          git push origin HEAD:agent/phase-3-coach-dashboard
