name: Phase 3 Coach Home Finish

on:
  push:
    branches:
      - agent/phase-3-coach-dashboard
    paths:
      - scripts/apply-phase3-coach-home-finish.mjs
      - .github/workflows/phase3-coach-home-finish.yml

permissions:
  contents: write

jobs:
  performance-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-3-coach-dashboard
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Apply scoped Coach Home architecture repair
        run: node scripts/apply-phase3-coach-home-finish.mjs

      - name: Minimize Program Pulse runtime model to rendered fields
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const patch = (path, pairs) => {
            let source = readFileSync(path, 'utf8');
            for (const [before, after] of pairs) {
              if (!source.includes(before)) throw new Error(`Missing optimization seam in ${path}: ${before}`);
              source = source.replace(before, after);
            }
            writeFileSync(path, source);
          };
          patch('src/lib/coachOperationalDashboard.js', [
            ['  const eligibleAthletes = safeRows.length;\n', ''],
            ['  const totalGoal = goal > 0 ? goal * eligibleAthletes : 0;', '  const totalGoal = goal > 0 ? goal * safeRows.length : 0;'],
            ['  const creditedMakes = totalGoal ? safeRows.reduce((total, row) => total + Math.min(Math.max(0, safeNumber(row.weeklyMakes)), goal), 0) : 0;', '  const creditedMakes = totalGoal ? safeRows.reduce((total, row) => total + Math.min(row.weeklyMakes, goal), 0) : 0;'],
            ['    total: eligibleAthletes,', '    total: safeRows.length,'],
            ['? { available: true, value, displayValue: `${value}%`, detail: `${Math.round(creditedMakes)} of ${Math.round(totalGoal)} weekly makes`, eligibleAthletes, creditedMakes, totalGoal }', '? { value, detail: `${creditedMakes}/${totalGoal} weekly makes` }'],
            [': { available: false, value: null, displayValue: "—", detail: "No weekly goal data", eligibleAthletes, creditedMakes: 0, totalGoal: 0 },', ': { value: null, detail: "No weekly goal data" },'],
          ]);
          patch('src/components/CoachCommandCenter.jsx', [
            ['  const available = Boolean(model?.available);\n', ''],
            ['{model?.displayValue || "—"}', '{model?.value == null ? "—" : `${model.value}%`}'],
            ['`${available ? model?.value : 0}%`', '`${model?.value || 0}%`'],
            ['<strong>{available ? "Weekly goal progress" : "Goal data unavailable"}</strong>', '<strong>Weekly goal progress</strong>'],
          ]);
          patch('tests/coach-command-center-10x.test.mjs', [
            ['  assert.match(source,/model\\?\\.displayValue \\|\\| "—"/);', '  assert.match(source,/model\\?\\.value == null \\? "—"/);'],
          ]);
          NODE

      - name: Lock behavioral Program Pulse contracts
        shell: bash
        run: |
          cat > tests/coach-program-pulse.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { buildCoachPlayerDashboardMetrics, buildCoachPlayerDashboardRows } from "../src/lib/coachOperationalDashboard.js";

          const roster = [
            { email: "ava@example.com", name: "Ava" },
            { email: "jordan@example.com", name: "Jordan" },
          ];
          const rowsFor = (shotLogs = [], players = roster) => buildCoachPlayerDashboardRows({ players, shotLogs, weekStart: "2026-08-23" });
          const pulseFor = (shotLogs = [], weeklyGoal = 500, players = roster) => buildCoachPlayerDashboardMetrics(rowsFor(shotLogs, players), weeklyGoal).programPulse;

          test("Program Pulse caps each athlete at the shared Coach weekly goal", () => {
            const model = pulseFor([
              { email: "ava@example.com", made: 650, date: "2026-08-24" },
              { email: "jordan@example.com", made: 250, date: "2026-08-25" },
            ]);
            assert.deepEqual(model, { value: 75, detail: "750/1000 weekly makes" });
          });

          test("one over-goal athlete cannot compensate past 100% for another athlete", () => {
            const model = pulseFor([
              { email: "ava@example.com", made: 900, date: "2026-08-24" },
              { email: "jordan@example.com", made: 100, date: "2026-08-25" },
            ]);
            assert.deepEqual(model, { value: 60, detail: "600/1000 weekly makes" });
          });

          test("Program Pulse reports zero when a valid weekly goal exists but the week has no makes", () => {
            const model = pulseFor([], 500);
            assert.deepEqual(model, { value: 0, detail: "0/1000 weekly makes" });
          });

          test("Program Pulse is unavailable for missing, zero, negative, or rosterless goal denominators", () => {
            const models = [
              buildCoachPlayerDashboardMetrics(rowsFor(), undefined).programPulse,
              pulseFor([], 0),
              pulseFor([], -25),
              pulseFor([], 500, []),
            ];
            for (const model of models) assert.deepEqual(model, { value: null, detail: "No weekly goal data" });
          });

          test("out-of-week activity does not inflate Program Pulse", () => {
            const model = pulseFor([
              { email: "ava@example.com", made: 100, date: "2026-08-23" },
              { email: "ava@example.com", made: 500, date: "2026-08-16" },
            ], 400);
            assert.deepEqual(model, { value: 13, detail: "100/800 weekly makes" });
          });

          test("non-roster activity does not inflate Program Pulse", () => {
            const model = pulseFor([
              { email: "ava@example.com", made: 100, date: "2026-08-23" },
              { email: "not-on-roster@example.com", made: 999, date: "2026-08-25" },
            ], 400);
            assert.deepEqual(model, { value: 13, detail: "100/800 weekly makes" });
          });

          test("Coach identity never counts as an eligible Program Pulse athlete", () => {
            const players = [...roster, { email: "coach@example.com", name: "Coach", role: "coach", isCoach: true }];
            const rows = rowsFor([
              { email: "ava@example.com", made: 100, date: "2026-08-23" },
              { email: "coach@example.com", made: 999, date: "2026-08-25" },
            ], players);
            assert.equal(rows.length, 2);
            assert.deepEqual(buildCoachPlayerDashboardMetrics(rows, 400).programPulse, { value: 13, detail: "100/800 weekly makes" });
          });
          EOF

      - name: Validate focused contracts
        run: |
          git diff --check
          node --test tests/coach-program-pulse.test.mjs tests/phase3-coach-home-scope.test.mjs tests/coach-command-center-10x.test.mjs tests/coach-operational-dashboard.test.mjs

      - name: Enforce production performance budget
        id: performance
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:performance 2>&1 | tee performance.log

      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-performance-${{ github.sha }}
          path: |
            performance.log
            artifacts/performance/
          if-no-files-found: warn
          retention-days: 3

      - name: Stop on performance failure
        if: steps.performance.outcome == 'failure'
        run: exit 1

      - name: Performance diagnostic passed
        run: echo "Phase 3 source is inside the production JS budget; final viewport gate is next."
