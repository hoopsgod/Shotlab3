name: Phase 3 Coach Home Finish

on:
  push:
    branches:
      - agent/phase-3-coach-dashboard
    paths:
      - scripts/apply-phase3-coach-home-finish.mjs
      - .github/workflows/phase3-coach-home-finish.yml

permissions:
  contents: write

jobs:
  performance-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-3-coach-dashboard
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Apply scoped Coach Home architecture repair
        run: node scripts/apply-phase3-coach-home-finish.mjs

      - name: Lock explicit missing-goal contract
        run: sed -i 's/pulseFor(\[\], undefined)/buildCoachPlayerDashboardMetrics(rowsFor(), undefined).programPulse/' tests/coach-program-pulse.test.mjs

      - name: Validate focused contracts
        run: |
          git diff --check
          node --test tests/coach-program-pulse.test.mjs tests/phase3-coach-home-scope.test.mjs tests/coach-command-center-10x.test.mjs tests/coach-operational-dashboard.test.mjs

      - name: Enforce production performance budget
        id: performance
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:performance 2>&1 | tee performance.log

      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-performance-${{ github.sha }}
          path: |
            performance.log
            artifacts/performance/
          if-no-files-found: warn
          retention-days: 3

      - name: Stop on performance failure
        if: steps.performance.outcome == 'failure'
        run: exit 1

      - name: Commit stabilized Phase 3 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fold Program Pulse into Coach metrics pipeline"
          git push origin HEAD:agent/phase-3-coach-dashboard
