name: Leaderboards Build Diagnostics

on:
  push:
    branches:
      - agent-leaderboards-mobile-premium-redesign
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture production build output
        shell: bash
        run: |
          set +e
          npm run build > leaderboards-build.log 2>&1
          code=$?
          echo "" >> leaderboards-build.log
          echo "BUILD_EXIT_CODE=$code" >> leaderboards-build.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: leaderboards-build-diagnostic
          path: leaderboards-build.log
          if-no-files-found: error
          retention-days: 1
