name: Phase 2 Premium UI Layer

on:
  pull_request:
    branches:
      - agent/phase-5c-production-promotion
    paths:
      - "src/components/CoachDashboardPrimitives.jsx"
      - "src/components/CoachDashboardPrimitives.module.css"
      - "src/components/Phase2PremiumMetricLayer.css"
      - "src/components/CoachInteractiveDashboards.jsx"
      - "src/components/SecondaryPageSystem.jsx"
      - "src/components/SecondaryPageSystem.css"
      - "src/components/ShotLabIcon.jsx"
      - "tests/phase-2-premium-ui-layer.test.mjs"
      - "tests/e2e/phase-2-premium-ui-layer.spec.mjs"
      - ".github/workflows/phase-2-premium-ui-layer.yml"
      - "package.json"
      - "playwright.acceptance.config.mjs"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-2-premium-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  premium-metric-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 2 premium metric contracts
        run: node --test tests/phase-2-premium-ui-layer.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Run Coach premium metric browser flows
        run: npx playwright test tests/e2e/phase-2-premium-ui-layer.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Upload Phase 2 premium metric screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-premium-ui-layer-evidence
          path: artifacts/phase-2-premium-ui/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Phase 2 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-premium-ui-layer-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
