name: Team Store Production Smoke

on:
  pull_request:
    paths:
      - 'src/components/TeamStorePortal.jsx'
      - 'src/lib/teamStore.js'
      - 'src/teamStoreEntry.jsx'
      - 'index.html'
      - 'tests/team-store-phase-1-contract.test.mjs'
      - '.github/workflows/team-store-production-smoke.yml'
  push:
    branches:
      - march-3-reset-85393dd
    paths:
      - 'src/components/TeamStorePortal.jsx'
      - 'src/lib/teamStore.js'
      - 'src/teamStoreEntry.jsx'
      - 'index.html'
      - 'tests/team-store-phase-1-contract.test.mjs'
      - '.github/workflows/team-store-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-store-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Team Store contract tests
        run: node --test tests/team-store-phase-1-contract.test.mjs
      - name: Production build
        run: npm run build

  production-probe:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: contract-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_URL: https://shotlab3.pages.dev
    steps:
      - name: Wait for Cloudflare Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            echo "Production probe attempt ${attempt}/36"
            if curl --fail --silent --show-error --location --max-time 20 "$PRODUCTION_URL" -o /tmp/shotlab-index.html; then
              if grep -q 'id="team-store-root"' /tmp/shotlab-index.html; then
                echo "Team Store mount found in production HTML."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Cloudflare production did not expose the Team Store mount within six minutes."
          exit 1

      - name: Verify production Team Store bundle content
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          base = 'https://shotlab3.pages.dev/'
          html = open('/tmp/shotlab-index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script[^>]+src="([^"]+\.js)"', html)
          if not scripts:
              raise SystemExit('No production JavaScript assets found.')

          payload = ''
          for src in scripts:
              url = urllib.parse.urljoin(base, src)
              with urllib.request.urlopen(url, timeout=25) as response:
                  payload += response.read().decode('utf-8', errors='ignore')

          required = [
              'SHOTLAB COMMERCE',
              'TEAM STORE',
              'ShotLab may earn a commission',
              'PUBLISH STORE',
              'SHOP TEAM STORE',
          ]
          missing = [text for text in required if text not in payload]
          if missing:
              raise SystemExit(f'Missing Team Store production markers: {missing}')
          print('Production Team Store bundle markers verified.')
          PY
