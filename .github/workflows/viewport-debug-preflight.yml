name: Viewport Debug Preflight

# Coach Home is the Phase 4 visual migration gate. The implementation may not
# spread to additional product surfaces until this workflow emits rendered
# Coach Home evidence at both the primary mobile and desktop comparison widths.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**/*.css'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'vite*.js'
      - '.github/workflows/viewport-debug-preflight.yml'
  workflow_dispatch:

concurrency:
  group: viewport-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coach-home-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned viewport debugger
        run: npm install --no-save --package-lock=false @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify viewport debugger unit contracts
        run: node --test tests/viewport-debug-tooling.test.mjs

      - name: Render Coach Home comparison gate at 390px and 1440px
        run: npm run debug:viewport -- --role=coach --widths=390,1440

      - name: Run remaining mobile containment regression
        run: npm run debug:viewport -- --widths=320,430

      - name: Upload rendered viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-home-rendered-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/viewport-debug/
          if-no-files-found: error
          retention-days: 7
