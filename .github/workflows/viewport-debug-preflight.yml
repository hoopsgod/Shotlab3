name: Viewport Debug Preflight

# Phase 4 exact-head visual certification trigger. No workflow logic change.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**/*.css'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'vite*.js'
      - '.github/workflows/viewport-debug-preflight.yml'
  workflow_dispatch:

concurrency:
  group: viewport-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-viewport-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned viewport debugger
        run: npm install --no-save --package-lock=false @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify viewport debugger unit contracts
        run: node --test tests/viewport-debug-tooling.test.mjs

      - name: Run fast Coach and Player viewport preflight
        run: npm run debug:viewport -- --widths=320,390,430

      - name: Upload viewport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewport-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/viewport-debug/
          if-no-files-found: warn
          retention-days: 7