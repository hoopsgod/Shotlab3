name: Player Career History

on:
  pull_request:
    paths:
      - "src/lib/playerCareerHistory.js"
      - "src/components/PlayerCareerHistory.jsx"
      - "src/App.jsx"
      - "tests/player-career-history*.test.mjs"
      - "tests/e2e/player-career-history.spec.mjs"
      - ".github/workflows/player-career-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Career history domain and integration contracts
        run: node --test tests/player-career-history.test.mjs tests/player-career-history-contract.test.mjs
      - name: Archive and roster regressions
        run: node --test tests/season-archive.test.mjs tests/coach-player-development-profile.test.mjs tests/player-removal-lifecycle-stabilization.test.mjs
      - name: Production build
        run: npm run build
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Coach and player career-history browser flow
        run: npx playwright test tests/e2e/player-career-history.spec.mjs
