name: Signed Events and RSVP Persistence

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - "functions/v1/events/**"
      - "functions/v1/rsvps/**"
      - "src/lib/apiFetchBridge.js"
      - "src/lib/apiIdentityHeaders.js"
      - "src/lib/schedulePersistenceService.js"
      - "migrations/043_events_rsvps_signed_api_boundary.sql"
      - "tests/signed-events-rsvp-persistence.test.mjs"
      - "tests/events-visibility-rsvp-contract.test.mjs"
      - "tests/coach-event-create-flow-contract.test.mjs"
      - "tests/remote-persistence-hydration-merge.test.mjs"
      - "tests/remotePersistence-rsvps.test.mjs"
      - "docs/signed-events-rsvp-persistence.md"
      - ".github/workflows/signed-events-rsvp-persistence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-events-rsvp-persistence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-events-rsvp-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify signed events and RSVP authorization contracts
        run: |
          node --test tests/signed-events-rsvp-persistence.test.mjs
          node --test tests/events-visibility-rsvp-contract.test.mjs
          node --test tests/coach-event-create-flow-contract.test.mjs
          node --test tests/remote-persistence-hydration-merge.test.mjs
          node --test tests/remotePersistence-rsvps.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signed-events-rsvp-persistence-failure
          path: |
            npm-debug.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
