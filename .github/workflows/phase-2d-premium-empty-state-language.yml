name: Phase 2D Premium Empty-State Language

on:
  pull_request:
    branches:
      - agent/demo-paid-parity-lock
    paths:
      - "src/components/CoachDashboardPhase2.jsx"
      - "src/components/Phase2PremiumEmptyStateLanguage.css"
      - "scripts/apply-phase2d-premium-empty-state-language.mjs"
      - "tests/phase-2d-premium-empty-state-language.test.mjs"
      - "tests/e2e/phase-2d-premium-empty-state-language.spec.mjs"
      - ".github/workflows/phase-2d-premium-empty-state-language.yml"
      - "package.json"
      - "playwright.acceptance.config.mjs"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-2d-premium-empty-state-language-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  premium-empty-state-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 2D source contract
        run: node --test tests/phase-2d-premium-empty-state-language.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Verify premium empty states at 390px
        run: npx playwright test tests/e2e/phase-2d-premium-empty-state-language.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Upload Phase 2D visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2d-premium-empty-state-evidence
          path: artifacts/phase-2d-empty-state-language/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Phase 2D failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2d-premium-empty-state-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
