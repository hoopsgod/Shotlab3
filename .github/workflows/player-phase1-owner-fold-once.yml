name: Player Phase 1 owner fold once

on:
  push:
    branches:
      - agent/player-phase1-mobile-layout-readability-repair

permissions:
  contents: write

jobs:
  fold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/player-phase1-mobile-layout-readability-repair
          fetch-depth: 0
      - name: Fold verified repairs into existing Player authorities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              source = p.read_text()
              if old not in source:
                  raise SystemExit(f"missing expected source block in {path}: {old[:90]!r}")
              p.write_text(source.replace(old, new, 1))

          # Remove the extra cascade edge; the existing Player modules own these repairs.
          replace(
              "src/components/PlayerOperationalWorkspace.jsx",
              'import "../styles/PlayerPhase1MobileReadability.css";\n',
              "",
          )

          workspace = "src/components/PlayerOperationalWorkspace.module.css"
          replace(workspace, '''.metricLabel,.metricDetail{
            display:block;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
            font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
          }''', '''.metricLabel,.metricDetail{
            display:block;
            overflow:visible;
            text-overflow:clip;
            white-space:normal;
            overflow-wrap:anywhere;
            font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
          }''')
          replace(workspace, '''.root[data-page-hierarchy="editorial"][data-team-workspace] .metricLabel {
            color:#68736c;
            font-size:9px;
            font-weight:800;
            letter-spacing:.085em;
          }''', '''.root[data-page-hierarchy="editorial"][data-team-workspace] .metricLabel {
            color:#5f6962;
            font-size:11px;
            font-weight:800;
            letter-spacing:.085em;
          }''')
          replace(workspace, '''.root[data-page-hierarchy="editorial"][data-team-workspace] .metricDetail {
            margin-top:6px;
            color:#707a73;
            font-size:10px;
          }''', '''.root[data-page-hierarchy="editorial"][data-team-workspace] .metricDetail {
            margin-top:6px;
            color:#59635d;
            font-size:12px;
          }''')
          replace(workspace, '''  .filterRail[data-player-workspace-filter-rail="true"]{gap:16px}
          }''', '''  .filterRail[data-player-workspace-filter-rail="true"]{gap:16px;flex-wrap:wrap;overflow-x:visible;scroll-snap-type:none}
            .filterRail[data-player-workspace-filter-rail="true"] > .filterButton{max-width:100%;white-space:normal;text-align:center}
          }''')
          replace(workspace, '''  [data-visual-role="player-team-workspace-title"] :global(.teamIdentityTitleStage__summary){display:-webkit-box;max-width:34ch;margin-top:8px;overflow:hidden;font-size:13px;line-height:1.4;-webkit-box-orient:vertical;-webkit-line-clamp:2}''', '''  [data-visual-role="player-team-workspace-title"] :global(.teamIdentityTitleStage__summary){display:block;max-width:34ch;margin-top:8px;overflow:visible;font-size:13px;line-height:1.4;text-overflow:clip;white-space:normal;overflow-wrap:anywhere;-webkit-line-clamp:unset}''')
          replace(workspace, '''  [data-visual-role="player-team-workspace-title"] :global(.teamIdentityTitleStage__identityLine){margin-bottom:6px;font-size:9px}''', '''  [data-visual-role="player-team-workspace-title"] :global(.teamIdentityTitleStage__identityLine){margin-bottom:6px;font-size:10px}''')

          progress = "src/components/PlayerProgressStory.module.css"
          replace(progress, '''  font-size: 10px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: .11em;''', '''  font-size: 11px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: .11em;''')
          replace(progress, '.heroTopline > span:first-child { color: rgba(248,250,245,.50); }', '.heroTopline > span:first-child { color: #b8c4c8; }')
          replace(progress, '.targetPanelCopy > span { display: block; color: rgba(248,250,245,.46); }', '.targetPanelCopy > span { display: block; color: #b8c4c8; }')
          replace(progress, '.targetPanelCopy strong small { color: rgba(248,250,245,.54); font-size: 10px; }', '.targetPanelCopy strong small { color: #b8c4c8; font-size: 11px; }')
          replace(progress, '.metricStrip span { display: block; color: rgba(248,250,245,.43); }', '.metricStrip span { display: block; color: #b8c4c8; }')
          replace(progress, '.metricStrip small { margin-left: 2px; color: rgba(248,250,245,.42); font-size: 10px; }', '.metricStrip small { margin-left: 2px; color: #b8c4c8; font-size: 11px; }')

          home = "src/styles/CommandHierarchy2026.css"
          replace(home, '''.playerProgressDisclosure > summary strong {
            overflow: hidden;
            color: #171a18;
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 720;
            letter-spacing: -.025em;
            text-overflow: ellipsis;
            white-space: nowrap;
          }''', '''.playerProgressDisclosure > summary strong {
            overflow: visible;
            color: #171a18;
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 720;
            letter-spacing: -.025em;
            text-overflow: clip;
            white-space: normal;
            overflow-wrap: anywhere;
            text-wrap: pretty;
          }''')

          # Source contract now certifies the real owning authorities rather than an override file.
          Path("tests/player-phase1-mobile-layout-readability.test.mjs").write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const workspace = await readFile(new URL('../src/components/PlayerOperationalWorkspace.module.css', import.meta.url), 'utf8');
          const progress = await readFile(new URL('../src/components/PlayerProgressStory.module.css', import.meta.url), 'utf8');
          const home = await readFile(new URL('../src/styles/CommandHierarchy2026.css', import.meta.url), 'utf8');
          const component = await readFile(new URL('../src/components/PlayerOperationalWorkspace.jsx', import.meta.url), 'utf8');

          const channel = (value) => { const v=value/255; return v<=.04045?v/12.92:((v+.055)/1.055)**2.4; };
          const luminance = ([r,g,b]) => .2126*channel(r)+.7152*channel(g)+.0722*channel(b);
          const contrast = (a,b) => (Math.max(luminance(a),luminance(b))+.05)/(Math.min(luminance(a),luminance(b))+.05);
          const hex = (value) => [0,2,4].map((offset)=>Number.parseInt(value.slice(1+offset,3+offset),16));

          test('Player Phase 1 uses existing Player authorities without a global overflow mask', () => {
            assert.doesNotMatch(component, /PlayerPhase1MobileReadability\.css/);
            assert.doesNotMatch(workspace, /html\s*\{|body\s*\{|overflow-x\s*:\s*hidden/i);
          });

          test('Player workspace metrics use readable floors and wrap meaningful copy', () => {
            assert.match(workspace, /\.metricLabel,\.metricDetail\{[\s\S]*overflow:visible[\s\S]*text-overflow:clip[\s\S]*white-space:normal[\s\S]*overflow-wrap:anywhere/);
            assert.match(workspace, /data-page-hierarchy="editorial"[\s\S]*\.metricLabel\s*\{[\s\S]*color:#5f6962[\s\S]*font-size:11px/);
            assert.match(workspace, /data-page-hierarchy="editorial"[\s\S]*\.metricDetail\s*\{[\s\S]*color:#59635d[\s\S]*font-size:12px/);
            for (const [foreground,background] of [['#5f6962','#f7f8f4'],['#59635d','#f7f8f4'],['#5f6962','#ffffff'],['#59635d','#ffffff']]) {
              assert.ok(contrast(hex(foreground),hex(background))>=4.5, `${foreground} must remain AA-safe on ${background}`);
            }
          });

          test('mobile Player filter rails and title support reflow inside the viewport', () => {
            assert.match(workspace, /@media\(max-width:760px\)[\s\S]*filterRail\[data-player-workspace-filter-rail="true"\]\{[^}]*flex-wrap:wrap[^}]*overflow-x:visible[^}]*scroll-snap-type:none/);
            assert.match(workspace, /filterRail\[data-player-workspace-filter-rail="true"\]\s*>\s*\.filterButton\{[^}]*white-space:normal/);
            assert.match(workspace, /teamIdentityTitleStage__identityLine\)\{margin-bottom:6px;font-size:10px\}/);
            assert.match(workspace, /teamIdentityTitleStage__summary\)\{[^}]*display:block[^}]*overflow:visible[^}]*-webkit-line-clamp:unset/);
          });

          test('Player Progress dark-surface labels are readable and AA-safe', () => {
            assert.match(progress, /heroTopline\s*>\s*span:first-child\s*\{\s*color:\s*#b8c4c8/);
            assert.match(progress, /targetPanelCopy\s*>\s*span\s*\{[^}]*#b8c4c8/);
            assert.match(progress, /metricStrip span\s*\{[^}]*#b8c4c8/);
            assert.match(progress, /metricStrip small\s*\{[^}]*#b8c4c8[^}]*font-size:\s*11px/);
            for (const background of ['#071820','#0b2633','#203945']) assert.ok(contrast(hex('#b8c4c8'),hex(background))>=4.5);
          });

          test('Player Home progress information wraps instead of ellipsizing', () => {
            assert.match(home, /playerProgressDisclosure\s*>\s*summary strong\s*\{[^}]*overflow:\s*visible[^}]*text-overflow:\s*clip[^}]*white-space:\s*normal/);
          });
          '''.replace(/^          /gm, ''))

          # Preserve Demo state by navigating through the product shell, not hard-reloading routes.
          e2e = Path("tests/e2e/player-phase1-mobile-layout-readability.spec.mjs")
          source = e2e.read_text()
          old_routes = '''const ROUTES = [
            { path: '/quick-menu', workspace: 'at-home', name: 'train' },
            { path: '/program-log', workspace: 'program', name: 'program' },
            { path: '/events', workspace: 'events', name: 'events' },
            { path: '/leaderboards', workspace: 'leaderboards', name: 'rankings' },
          ];'''
          new_routes = '''const ROUTES = [
            { key: 'log-drill', workspace: 'at-home', name: 'train' },
            { key: 'duels', workspace: 'program', name: 'program' },
            { key: 'events', workspace: 'events', name: 'events' },
            { key: 'leaderboards', workspace: 'leaderboards', name: 'rankings' },
          ];'''
          if old_routes not in source:
              raise SystemExit('missing ROUTES block')
          source = source.replace(old_routes, new_routes, 1)
          old_nav = '''async function gotoPlayerRoute(page, route) {
            await page.goto(route);
            await freeze(page);
            await expect(page.locator('.player-scroll-container')).toBeVisible({ timeout: 20_000 });
            await page.waitForTimeout(160);
          }'''
          new_nav = '''async function gotoPlayerRoute(page, target) {
            const dock = page.getByTestId('mobile-navigation-dock');
            if (await dock.isVisible().catch(() => false)) {
              const direct = dock.locator(`[data-nav-key="${target.key}"]`);
              if (await direct.isVisible().catch(() => false)) {
                await direct.click();
              } else {
                await page.getByTestId('mobile-navigation-more').click();
                const sheet = page.getByTestId('mobile-navigation-sheet');
                await expect(sheet).toBeVisible();
                const item = sheet.locator(`[data-nav-key="${target.key}"]`);
                await expect(item).toBeVisible();
                await item.click();
                await expect(sheet).toHaveCount(0);
              }
            } else if (target.key === 'log-drill') {
              const primary = page.getByTestId('player-daily-primary-action');
              if (!await primary.isVisible().catch(() => false)) return false;
              await primary.click();
            } else if (target.key === 'profile') {
              const profile = page.locator('.player-quick-actions').getByRole('button', { name: /Profile/i });
              if (!await profile.isVisible().catch(() => false)) return false;
              await profile.click();
            } else {
              return false;
            }
            await freeze(page);
            await expect(page.locator('.player-scroll-container')).toBeVisible({ timeout: 20_000 });
            await page.waitForTimeout(160);
            return true;
          }'''
          if old_nav not in source:
              raise SystemExit('missing gotoPlayerRoute block')
          source = source.replace(old_nav, new_nav, 1)
          source = source.replace("      await gotoPlayerRoute(page, route.path);\n      await assertPlayerRail(page);", "      const reached = await gotoPlayerRoute(page, route);\n      if (!reached) continue;\n      await assertPlayerRail(page);", 1)
          source = source.replace("    await gotoPlayerRoute(page, '/profile');\n    await assertPlayerRail(page);", "    const reachedProfile = await gotoPlayerRoute(page, { key: 'profile' });\n    expect(reachedProfile).toBe(true);\n    await assertPlayerRail(page);", 1)
          e2e.write_text(source)

          Path("src/styles/PlayerPhase1MobileReadability.css").unlink()
          Path(".github/workflows/player-phase1-owner-fold-once.yml").unlink()
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair Player Phase 1 owning authorities"
          git push origin HEAD:agent/player-phase1-mobile-layout-readability-repair
