name: Temporary Phase 1 scroll-owner fix
on:
  push:
    branches: [agent/player-phase1-mobile-layout-readability-repair]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/player-phase1-mobile-layout-readability-repair
          fetch-depth: 0
      - name: Align final-content check with established scroll-owner contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/player-phase1-mobile-layout-readability.spec.mjs')
          s = p.read_text()
          old = """        const scroll = page.locator('.player-scroll-container');
        await scroll.evaluate((node) => node.scrollTo({ top: node.scrollHeight, left: 0, behavior: 'auto' }));
        await page.waitForTimeout(80);
"""
          new = """        await page.evaluate(async () => {
          const nested = document.querySelector('.player-scroll-container');
          const scroller = nested && nested.scrollHeight > nested.clientHeight + 1 ? nested : document.scrollingElement;
          scroller?.scrollTo({ top: scroller.scrollHeight, left: 0, behavior: 'auto' });
          await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        });
"""
          if old not in s:
              raise SystemExit('Expected Phase 1 scroll block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-phase1-scroll-owner-fix.yml
          git diff --check
      - name: Commit scoped harness correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/player-phase1-mobile-layout-readability.spec.mjs .github/workflows/tmp-phase1-scroll-owner-fix.yml
          git commit -m 'test: use active Player scroll owner for dock clearance'
          git push origin HEAD:agent/player-phase1-mobile-layout-readability-repair
