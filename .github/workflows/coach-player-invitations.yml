name: Coach Player Invitations

on:
  pull_request:
    paths:
      - "src/components/CoachPlayerInviteForm.jsx"
      - "src/lib/coachPlayerInvitationService.js"
      - "src/App.jsx"
      - "public/player-setup.html"
      - "functions/v1/coach/players/provision.js"
      - "functions/v1/player-auth/claim.js"
      - "functions/_utils/transactionalEmail.js"
      - "migrations/036_coach_player_invitations.sql"
      - "tests/coach-player-invitation*.test.mjs"
      - ".github/workflows/coach-player-invitations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Invitation domain and safety tests
        run: node --test tests/coach-player-invitation-service.test.mjs tests/coach-player-invitation-contract.test.mjs
      - name: Existing authentication and roster regressions
        run: node --test tests/legacy-auth-persistence.test.mjs tests/team-memberships-confirm-context-route.test.mjs tests/release-candidate-stability.test.mjs
      - name: Production build
        run: npm run build
