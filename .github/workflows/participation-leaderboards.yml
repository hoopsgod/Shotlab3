name: Participation Leaderboards

on:
  pull_request:
    paths:
      - "src/lib/participationLeaderboardRows.js"
      - "src/components/PremiumLeaderboardsHub.jsx"
      - "src/App.jsx"
      - "tests/participation-leaderboards*.test.mjs"
      - ".github/workflows/participation-leaderboards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Participation leaderboard domain tests
        run: node --test tests/participation-leaderboards.test.mjs
      - name: Existing leaderboard and roster regressions
        run: node --test tests/season-leaderboard-analytics.test.mjs tests/season-leaderboard-roster-boundary.test.mjs tests/player-removal-lifecycle-stabilization.test.mjs
      - name: Production build
        run: npm run build
