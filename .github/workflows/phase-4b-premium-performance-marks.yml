name: Phase 4B Premium Performance Marks

on:
  pull_request:
    branches:
      - agent/phase-4a-signature-visual-identity
    paths:
      - "package.json"
      - "src/components/ShotLabPerformanceMark.jsx"
      - "src/components/ShotLabPerformanceMark.module.css"
      - "src/components/PlayerProgressStory.jsx"
      - "src/components/CompactLeaderboardPreviewCard.jsx"
      - "scripts/apply-phase4b-premium-performance-marks.mjs"
      - "public/shotlab-phase4b-performance-marks.css"
      - "tests/phase-4b-premium-performance-marks.test.mjs"
      - "tests/phase-4a-signature-visual-identity.test.mjs"
      - "tests/phase-3u-player-account-control.test.mjs"
      - "tests/e2e/phase-4b-premium-performance-marks-screenshots.spec.mjs"
      - "playwright.screenshots.config.mjs"
      - ".github/workflows/phase-4b-premium-performance-marks.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-4b-performance-marks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-performance-marks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply full production enhancer chain
        run: npm run prepare:route-enhancers

      - name: Verify Phase 4B and predecessor contracts
        run: node --test tests/phase-4b-premium-performance-marks.test.mjs tests/phase-4a-signature-visual-identity.test.mjs tests/phase-3v-final-reconciliation.test.mjs tests/phase-3u-player-account-control.test.mjs tests/mobile-navigation-contract.test.mjs tests/app-store-mobile-shell.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify current mobile navigation
        run: npx playwright test tests/e2e/mobile-navigation.spec.mjs --config=playwright.config.mjs --reporter=line

      - name: Verify production acceptance
        run: npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Capture Phase 4B iPhone evidence
        run: npx playwright test tests/e2e/phase-4b-premium-performance-marks-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload Phase 4B evidence
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-4b-premium-performance-marks-evidence
          path: |
            artifacts/design-audit/iphone/09a-phase4b-player-progress-performance-marks.png
            artifacts/design-audit/iphone/09b-phase4b-player-rank-marks.png
            artifacts/design-audit/iphone/09c-phase4b-player-pb-achievement.png
            artifacts/design-audit/iphone/09d-phase4b-player-achievement-cabinet.png
            artifacts/design-audit/iphone/09e-phase4b-coach-regression.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 4B failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-4b-premium-performance-marks-failure
          path: |
            test-results/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
