name: Repair Phase 1C 320 Baseline

on:
  push:
    branches:
      - agent/coach-accountability-team-context

permissions:
  contents: write

env:
  VITE_ENABLE_PRODUCTION_DEMOS: true
  VITE_SUPABASE_URL: https://parity.supabase.co
  VITE_SUPABASE_ANON_KEY: parity-anon-key

jobs:
  repair-baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright runner and Chromium
        run: |
          npm install --no-save @playwright/test@1.55.1
          npx playwright install --with-deps chromium

      - name: Build exact production assets
        run: npm run build

      - name: Regenerate only the malformed 320px Coach Home baseline
        run: npx playwright test --config=playwright.phase1c.config.mjs --grep "coach-home-edge-320" --update-snapshots=all

      - name: Commit repaired baseline and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/coach-home-edge-320-mobile-chromium-linux.png
          git rm .github/workflows/repair-phase1c-baseline.yml
          git commit -m "Repair Coach Home 320 visual baseline"
          git push origin HEAD:agent/coach-accountability-team-context
