name: Phase 2B Action Language

on:
  pull_request:
    branches:
      - agent/phase-2-premium-ui-layer
    paths:
      - "src/main.jsx"
      - "src/styles/Phase2BActionLanguage.css"
      - "tests/phase-2b-action-language.test.mjs"
      - "tests/e2e/phase-2b-action-language.spec.mjs"
      - ".github/workflows/phase-2b-action-language.yml"
      - "package.json"
      - "playwright.acceptance.config.mjs"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-2b-action-language-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  action-empty-state-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 2B and Coach source contracts
        run: node --test tests/phase-2b-action-language.test.mjs tests/coach-operational-dashboard.test.mjs tests/coach-interactive-dashboard-contract.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Run Phase 2B and existing Coach dashboard browser flows
        run: npx playwright test tests/e2e/phase-2b-action-language.spec.mjs tests/e2e/coach-interactive-dashboards.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Upload Phase 2B screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2b-action-language-evidence
          path: artifacts/phase-2b-action-language/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Phase 2B failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2b-action-language-failure
          path: |
            playwright-report/
            test-results/
            artifacts/phase-2b-action-language/
          if-no-files-found: ignore
          retention-days: 7
