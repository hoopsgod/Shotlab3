name: Session Table Lockdown

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - "src/lib/appDataModels.js"
      - "migrations/044_session_table_lockdown.sql"
      - "tests/session-table-lockdown.test.mjs"
      - "tests/signed-session-integrity.test.mjs"
      - "tests/legacy-registration-session.test.mjs"
      - "tests/session-revocation-failure.test.mjs"
      - "docs/session-table-lockdown.md"
      - ".github/workflows/session-table-lockdown.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session-table-lockdown-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  session-table-lockdown:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify local session and database lockdown contracts
        run: |
          node --test tests/session-table-lockdown.test.mjs
          node --test tests/signed-session-integrity.test.mjs tests/legacy-registration-session.test.mjs tests/session-revocation-failure.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-table-lockdown-failure
          path: |
            npm-debug.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
