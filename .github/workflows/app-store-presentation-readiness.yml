      - ".github/workflows/app-store-presentation-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: app-store-presentation-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify integrated Phase 1, Phase 2, Phase 3, Phase 3B, Phase 3C, Phase 3D, Phase 3E, Phase 3F, and Phase 3G contracts
        run: node --test tests/app-store-presentation-readiness.test.mjs tests/design-system-completion.test.mjs tests/demo-data-currentness.test.mjs tests/visual-foundation-2026.test.mjs tests/native-identity-shell.test.mjs tests/mobile-navigation-contract.test.mjs tests/phase-2-command-hierarchy.test.mjs tests/phase-3-secondary-cohesion.test.mjs tests/phase-3b-interaction-polish.test.mjs tests/phase-3c-native-route-framing.test.mjs tests/phase-3d-player-analytics-unification.test.mjs tests/phase-3e-profile-information-hierarchy.test.mjs tests/phase-3f-profile-intelligence.test.mjs tests/phase-3g-coach-drills-hierarchy.test.mjs tests/mission-control-hierarchy-2026.test.mjs tests/workspace-recovery.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Verify integrated mobile presentation flows
        run: npx playwright test tests/e2e/visual-foundation-2026.spec.mjs tests/e2e/native-app-shell-2026.spec.mjs tests/e2e/phase-2-command-hierarchy.spec.mjs tests/e2e/mission-control-hierarchy-2026.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Generate branded App Store screenshots and raw mobile audits
        run: npx playwright test --config=playwright.screenshots.config.mjs

      - name: Validate screenshot count, format, and dimensions
        run: node scripts/validate-app-store-screenshots.mjs

      - name: Upload App Store presentation package
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3g-coach-drills-hierarchy-evidence
          path: |
            artifacts/visual-foundation/
            artifacts/native-app-shell/
            artifacts/phase-2-command-hierarchy/
            artifacts/mission-control-phase-2/
            artifacts/app-store/iphone-6.9/
            artifacts/design-audit/iphone/
            native/app-store-listing.json
            docs/app-store-presentation-package.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3g-coach-drills-hierarchy-failure
          path: |
            playwright-report-app-store/
            playwright-report/
            test-results/
            artifacts/visual-foundation/
            artifacts/native-app-shell/
            artifacts/phase-2-command-hierarchy/
            artifacts/mission-control-phase-2/
            artifacts/app-store/iphone-6.9/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
