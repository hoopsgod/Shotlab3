name: App Store Presentation Readiness

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
      - agent/phase-3-secondary-cohesion
      - agent/phase-3b-interaction-polish
      - agent/phase-3c-native-route-framing
      - agent/phase-3d-player-analytics-unification
      - agent/phase-3e-profile-information-hierarchy
    paths:
      - "native/app-store-listing.json"
      - "docs/app-store-presentation-package.md"
      - "docs/phase-4-workspace-recovery.md"
      - "playwright.screenshots.config.mjs"
      - "tests/e2e/app-store-screenshots.spec.mjs"
      - "tests/e2e/design-system-screenshots.spec.mjs"
      - "tests/e2e/visual-foundation-2026.spec.mjs"
      - "tests/e2e/native-app-shell-2026.spec.mjs"
      - "tests/e2e/phase-2-command-hierarchy.spec.mjs"
      - "tests/e2e/mission-control-hierarchy-2026.spec.mjs"
      - "tests/app-store-presentation-readiness.test.mjs"
      - "tests/design-system-completion.test.mjs"
      - "tests/demo-data-currentness.test.mjs"
      - "tests/visual-foundation-2026.test.mjs"
      - "tests/native-identity-shell.test.mjs"
      - "tests/mobile-navigation-contract.test.mjs"
      - "tests/phase-2-command-hierarchy.test.mjs"
      - "tests/phase-3-secondary-cohesion.test.mjs"
      - "tests/phase-3b-interaction-polish.test.mjs"
      - "tests/phase-3c-native-route-framing.test.mjs"
      - "tests/phase-3d-player-analytics-unification.test.mjs"
      - "tests/phase-3e-profile-information-hierarchy.test.mjs"
      - "tests/phase-3f-profile-progressive-disclosure.test.mjs"
      - "tests/mission-control-hierarchy-2026.test.mjs"
      - "tests/workspace-recovery.test.mjs"
      - "scripts/apply-expert-app-review-v2.mjs"
      - "scripts/apply-phase3f-profile-disclosure.py"
      - "scripts/validate-app-store-screenshots.mjs"
      - "scripts/minify-visual-authority-css.mjs"
      - "public/shotlab-*.css"
      - "src/main.jsx"
      - "src/lib/demoData.js"
      - "src/lib/demoMode.js"
      - "src/lib/workspaceRecovery.js"
      - "src/components/AppHeader.jsx"
      - "src/components/AuthWorkspace.jsx"
      - "src/components/CoachCommandCenter.jsx"
      - "src/components/CoachInteractiveDashboards.jsx"
      - "src/components/CoachDashboardPrimitives.jsx"
      - "src/components/CoachDashboardPrimitives.module.css"
      - "src/components/CoachDashboardHeader.jsx"
      - "src/components/PlayerDashboardHeader.jsx"
      - "src/components/DashboardIdentityHeader.module.css"
      - "src/components/CoachMiniHeader.jsx"
      - "src/components/PlayerDailyCommandCenter.jsx"
      - "src/components/PlayerDailyCommandCenter.module.css"
      - "src/components/PlayerDailyPrimitives.jsx"
      - "src/components/PlayerDailyPrimitives.module.css"
      - "src/components/PlayerCareerHistory.jsx"
      - "src/components/PlayerCareerHistory.module.css"
      - "src/components/ShotLabIcon.jsx"
      - "src/components/SecondaryPageSystem.jsx"
      - "src/components/SecondaryPageSystem.css"
      - "src/components/MobileNavigation.jsx"
      - "src/components/MobileNavigation.module.css"
      - "src/components/MobileNavigationArchitecture.css"
      - "src/components/CompactLeaderboardPreviewCard.jsx"
      - "src/components/WorkspaceRecoveryBoundary.jsx"
      - "src/components/WorkspaceRecoveryBoundary.module.css"
      - "src/components/DeferredCoachDashboardPhase2.jsx"
      - "src/components/DeferredCoachInteractiveDashboards.jsx"
      - "src/components/DeferredPlayerCareerHistory.jsx"
      - "src/components/DeferredPlayerDailyCommandCenter.jsx"
      - "src/components/DeferredPlayerDashboardHeader.jsx"
      - "src/components/DeferredPlayerOperationalWorkspace.jsx"
      - "src/components/TeamStore/**"
      - "src/styles/**"
      - "src/theme/appTokens.js"
      - "src/theme/semanticColors.js"
      - "package.json"
      - "index.html"
      - ".github/workflows/app-store-presentation-readiness.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: app-store-presentation-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply guarded Phase 3F source transform
        id: phase3f_transform
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/phase-3f-profile-progressive-disclosure'
        run: |
          python scripts/apply-phase3f-profile-disclosure.py
          if git diff --quiet -- src/App.jsx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "shotlab-phase3f-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/App.jsx
            git commit -m "Phase 3F: progressively disclose deep Profile data"
            git push origin HEAD:agent/phase-3f-profile-progressive-disclosure
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify integrated Phase 1 through Phase 3F contracts
        run: |
          tests=(
            tests/app-store-presentation-readiness.test.mjs
            tests/design-system-completion.test.mjs
            tests/demo-data-currentness.test.mjs
            tests/visual-foundation-2026.test.mjs
            tests/native-identity-shell.test.mjs
            tests/mobile-navigation-contract.test.mjs
            tests/phase-2-command-hierarchy.test.mjs
            tests/phase-3-secondary-cohesion.test.mjs
            tests/phase-3b-interaction-polish.test.mjs
            tests/phase-3c-native-route-framing.test.mjs
            tests/phase-3d-player-analytics-unification.test.mjs
            tests/phase-3e-profile-information-hierarchy.test.mjs
            tests/mission-control-hierarchy-2026.test.mjs
            tests/workspace-recovery.test.mjs
          )
          if [ -f tests/phase-3f-profile-progressive-disclosure.test.mjs ]; then
            tests+=(tests/phase-3f-profile-progressive-disclosure.test.mjs)
          fi
          node --test "${tests[@]}"

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Verify integrated mobile presentation flows
        run: npx playwright test tests/e2e/visual-foundation-2026.spec.mjs tests/e2e/native-app-shell-2026.spec.mjs tests/e2e/phase-2-command-hierarchy.spec.mjs tests/e2e/mission-control-hierarchy-2026.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Generate branded App Store screenshots and raw mobile audits
        run: npx playwright test --config=playwright.screenshots.config.mjs

      - name: Validate screenshot count, format, and dimensions
        run: node scripts/validate-app-store-screenshots.mjs

      - name: Upload App Store presentation package
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3f-profile-disclosure-evidence
          path: |
            artifacts/visual-foundation/
            artifacts/native-app-shell/
            artifacts/phase-2-command-hierarchy/
            artifacts/mission-control-phase-2/
            artifacts/app-store/iphone-6.9/
            artifacts/design-audit/iphone/
            native/app-store-listing.json
            docs/app-store-presentation-package.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3f-profile-disclosure-failure
          path: |
            playwright-report-app-store/
            playwright-report/
            test-results/
            artifacts/visual-foundation/
            artifacts/native-app-shell/
            artifacts/phase-2-command-hierarchy/
            artifacts/mission-control-phase-2/
            artifacts/app-store/iphone-6.9/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
