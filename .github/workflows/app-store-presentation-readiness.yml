name: App Store Presentation Readiness

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - "native/app-store-listing.json"
      - "docs/app-store-presentation-package.md"
      - "playwright.screenshots.config.mjs"
      - "tests/e2e/app-store-screenshots.spec.mjs"
      - "tests/app-store-presentation-readiness.test.mjs"
      - "scripts/validate-app-store-screenshots.mjs"
      - "public/shotlab-v3-foundation.css"
      - "public/shotlab-v3-mobile-corrections.css"
      - "public/shotlab-v4-reference.css"
      - "public/shotlab-v5-coach-integrity.css"
      - "public/shotlab-v6-decision-workspaces.css"
      - "src/components/CoachCommandCenter.jsx"
      - "src/components/CoachInteractiveDashboards.jsx"
      - "src/components/CoachDashboardPrimitives.jsx"
      - "src/components/CoachDashboardPrimitives.module.css"
      - "src/components/SecondaryPageSystem.jsx"
      - "src/components/SecondaryPageSystem.css"
      - "src/components/MobileNavigation.jsx"
      - "src/components/MobileNavigation.module.css"
      - "src/components/TeamStore/**"
      - "src/styles/**"
      - "index.html"
      - ".github/workflows/app-store-presentation-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: app-store-presentation-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify listing and presentation contracts
        run: node --test tests/app-store-presentation-readiness.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Generate branded App Store screenshots
        run: npx playwright test --config=playwright.screenshots.config.mjs

      - name: Validate screenshot count, format, and dimensions
        run: node scripts/validate-app-store-screenshots.mjs

      - name: Upload App Store presentation package
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-app-store-presentation
          path: |
            artifacts/app-store/iphone-6.9/
            native/app-store-listing.json
            docs/app-store-presentation-package.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-app-store-presentation-failure
          path: |
            playwright-report-app-store/
            test-results/app-store-screenshots/
            artifacts/app-store/iphone-6.9/
          if-no-files-found: ignore
          retention-days: 7
