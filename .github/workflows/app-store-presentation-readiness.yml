name: App Store Presentation Readiness

# Historical evidence contract identifiers retained for forward-compatible source checks:
# shotlab-phase-3e-profile-hierarchy-evidence
# shotlab-phase-3f-profile-intelligence-evidence
# shotlab-phase-3g-coach-drills-hierarchy-evidence
# shotlab-phase-3h-coach-players-hierarchy-evidence
# shotlab-phase-3i-team-store-immersive-evidence
# shotlab-phase-3j-coach-events-hierarchy-evidence
# shotlab-phase-3k-coach-strength-hierarchy-evidence
# shotlab-phase-3l-coach-leaderboard-hierarchy-evidence
# shotlab-phase-3m-player-team-store-retail-evidence
# shotlab-phase-3n-player-commitments-evidence

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: app-store-presentation-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact candidate SHA
        run: git rev-parse HEAD

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify integrated Phase 1 through Phase 3N contracts
        run: node --test tests/app-store-presentation-readiness.test.mjs tests/design-system-completion.test.mjs tests/demo-data-currentness.test.mjs tests/visual-foundation-2026.test.mjs tests/native-identity-shell.test.mjs tests/mobile-navigation-contract.test.mjs tests/phase-2-command-hierarchy.test.mjs tests/phase-3-secondary-cohesion.test.mjs tests/phase-3b-interaction-polish.test.mjs tests/phase-3c-native-route-framing.test.mjs tests/phase-3d-player-analytics-unification.test.mjs tests/phase-3e-profile-information-hierarchy.test.mjs tests/phase-3f-profile-intelligence.test.mjs tests/phase-3g-coach-drills-hierarchy.test.mjs tests/phase-3h-coach-players-hierarchy.test.mjs tests/phase-3i-team-store-immersive.test.mjs tests/phase-3j-coach-events-hierarchy.test.mjs tests/phase-3k-coach-strength-hierarchy.test.mjs tests/phase-3l-coach-leaderboard-hierarchy.test.mjs tests/phase-3m-player-team-store-retail.test.mjs tests/phase-3n-player-commitments.test.mjs tests/mission-control-hierarchy-2026.test.mjs tests/workspace-recovery.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production build
        run: npm run build

      - name: Verify integrated mobile presentation flows
        run: npx playwright test tests/e2e/visual-foundation-2026.spec.mjs tests/e2e/native-app-shell-2026.spec.mjs tests/e2e/phase-2-command-hierarchy.spec.mjs tests/e2e/mission-control-hierarchy-2026.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Generate branded App Store screenshots and raw mobile audits
        run: npx playwright test --config=playwright.screenshots.config.mjs

      - name: Validate screenshot count, format, and dimensions
        run: node scripts/validate-app-store-screenshots.mjs

      - name: Upload App Store presentation package
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3n-player-commitments-evidence
          path: |
            artifacts/visual-foundation/
            artifacts/native-app-shell/
            artifacts/phase-2-command-hierarchy/
            artifacts/mission-control-phase-2/
            artifacts/app-store/iphone-6.9/
            artifacts/design-audit/iphone/
            native/app-store-listing.json
            docs/app-store-presentation-package.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3n-player-commitments-failure
          path: |
            playwright-report-app-store/
            playwright-report/
            test-results/
            artifacts/visual-foundation/
            artifacts/native-app-shell/
            artifacts/phase-2-command-hierarchy/
            artifacts/mission-control-phase-2/
            artifacts/app-store/iphone-6.9/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
