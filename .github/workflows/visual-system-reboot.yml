name: Visual System Reboot

on:
  pull_request:
    paths:
      - "src/lib/visualSystemReboot.js"
      - "src/lib/coachActivationPath.js"
      - "tests/visual-system-reboot.test.mjs"
      - ".github/workflows/visual-system-reboot.yml"

jobs:
  verify-visual-system:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify visual system contracts
        run: node --test tests/visual-system-reboot.test.mjs
      - name: Build application
        run: npm run build
