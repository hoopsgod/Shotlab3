name: Phase 3U Player Account Control

on:
  pull_request:
    branches:
      - agent/phase-3t-native-iconography-semantics
    paths:
      - "package.json"
      - "scripts/apply-phase3u-player-account-control.mjs"
      - "src/App.jsx"
      - "src/components/MobileNavigation.jsx"
      - "src/components/MobileNavigation.module.css"
      - "tests/phase-3u-player-account-control.test.mjs"
      - "tests/e2e/mobile-navigation.spec.mjs"
      - "tests/e2e/phase-3u-player-account-control-screenshots.spec.mjs"
      - "playwright.screenshots.config.mjs"
      - ".github/workflows/phase-3u-player-account-control.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-3u-player-account-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-player-account-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Phase 3U source transformation
        run: node scripts/apply-phase3u-player-account-control.mjs

      - name: Verify account control contracts
        run: node --test tests/phase-3u-player-account-control.test.mjs tests/app-store-mobile-shell.test.mjs tests/mobile-navigation-contract.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify shared mobile navigation behavior
        run: npx playwright test tests/e2e/mobile-navigation.spec.mjs --config=playwright.config.mjs --reporter=line

      - name: Capture exact-head iPhone account-control evidence
        run: npx playwright test tests/e2e/phase-3u-player-account-control-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload Phase 3U evidence
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3u-player-account-control-evidence
          path: |
            artifacts/design-audit/iphone/06a-player-home-account-rhythm.png
            artifacts/design-audit/iphone/06b-player-more-account-actions.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 3U failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3u-player-account-control-failure
          path: |
            test-results/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
