name: Temporary Player Phase 1 readability fix
on:
  push:
    branches: [agent/player-phase1-mobile-layout-readability-repair]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/player-phase1-mobile-layout-readability-repair
          fetch-depth: 0
      - name: Apply scoped metric readability fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/PlayerProgressStory.module.css')
          s = p.read_text()
          needle = '.metricStrip small { margin-left: 2px; color: #b8c4c8; font-size: 11px; }\n'
          addition = needle + '.metricStrip [data-performance-kind] span,\n.metricStrip [data-performance-kind] small { font-size: 11px; }\n'
          if addition in s:
              pass
          elif needle in s:
              s = s.replace(needle, addition, 1)
          else:
              raise SystemExit('Expected metricStrip rule not found')
          p.write_text(s)
          PY
          rm .github/workflows/tmp-player-phase1-readability-fix.yml
          git diff --check
      - name: Commit scoped fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PlayerProgressStory.module.css .github/workflows/tmp-player-phase1-readability-fix.yml
          git commit -m 'fix: enforce readable Player progress metric labels'
          git push origin HEAD:agent/player-phase1-mobile-layout-readability-repair