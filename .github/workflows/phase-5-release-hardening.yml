name: Phase 5 Release Hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: true
  PHASE5_BASELINE_SHA: 34b489a49fed96e448e41992c10773617e1ba9ea

concurrency:
  group: phase-5-release-hardening-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Check out exact Phase 5 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate and locked production baseline
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          printf 'Expected head: %s\nActual head:   %s\nPhase 5 base: %s\n' "$expected" "$actual" "$PHASE5_BASELINE_SHA"
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$PHASE5_BASELINE_SHA" HEAD
          test "$(git rev-parse "$PHASE5_BASELINE_SHA")" = "$PHASE5_BASELINE_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 5 reliability, privacy, and mobile precision contracts
        run: >-
          node --test
          tests/phase-5-release-hardening.test.mjs
          tests/phase-5-mobile-precision.test.mjs
          tests/mobile-geometry-precision.test.mjs
          tests/coach-follow-up-integrity.test.mjs
          tests/coach-player-response-loop.test.mjs
          tests/coach-player-invitation-contract.test.mjs
          tests/player-assignment-delivery.test.mjs
          tests/demo-mode-cleanup.test.mjs
          tests/demo-visual-parity-contract.test.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build exact production candidate
        run: npm run build

      - name: Verify unchanged production performance budget
        id: performance_budget
        run: npm run verify:performance-budget

      - name: Start built production preview
        shell: bash
        run: |
          npm run preview:agent > /tmp/phase-5-preview.log 2>&1 &
          echo $! > /tmp/phase-5-preview.pid
          for attempt in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/phase-5-preview.log
          exit 1

      - name: Certify desktop workspace SPA routing, history, and responsive geometry
        id: desktop_workspace_local
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/desktop-workspace-routing.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line --retries=0

      - name: Certify Phase 5 trust, retry, duplicate-submit, and touch regressions
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase-5-release-hardening.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Capture exact Phase 5 mobile precision, Target Court, feedback, and 1280 evidence
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase-5-mobile-precision-evidence.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Retain Phase 4 Player Intelligence, overlay, form, navigation, and reduced-motion contracts
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase-4-product-reset-interaction-certification.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Verify Coach assignment delivery and Player response loop
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          tests/e2e/coach-player-assignment-delivery.spec.mjs
          tests/e2e/coach-follow-up-queue.spec.mjs
          --config=playwright.acceptance.config.mjs --reporter=line

      - name: Verify event management and Player RSVP touch path
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          tests/e2e/phase-4c-coach-event-manage-hit-area.spec.mjs
          tests/e2e/phase-4e4-player-program-rsvp-hit-area.spec.mjs
          --config=playwright.acceptance.config.mjs --reporter=line

      - name: Run production acceptance
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/production-acceptance.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Certify Demo and registered presentation parity
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          tests/e2e/demo-paid-parity.spec.mjs
          tests/e2e/demo-paid-responsive-parity.spec.mjs
          --config=playwright.acceptance.config.mjs --reporter=line

      - name: Capture mandatory 375-430 Coach and Player visual matrix
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase-3a-cross-screen-visual-audit.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Capture secondary, Team Store, 430px, and desktop evidence
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          tests/e2e/phase-3-release-certification.spec.mjs
          tests/e2e/phase-3-team-store-portal-certification.spec.mjs
          --config=playwright.acceptance.config.mjs --reporter=line

      - name: Resolve exact-head Cloudflare Pages deployment
        id: cloudflare
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100")"
            check="$(printf '%s' "$checks" | jq -c --arg sha "$EXPECTED_SHA" '
              [.check_runs[]
                | select(.name == "Cloudflare Pages")
                | select(.head_sha == $sha)
                | select(.app.slug == "cloudflare-workers-and-pages")]
              | sort_by(.started_at)
              | last // empty')"
            if [[ -z "$check" ]]; then
              sleep 10
              continue
            fi

            status="$(printf '%s' "$check" | jq -r '.status // empty')"
            conclusion="$(printf '%s' "$check" | jq -r '.conclusion // empty')"
            deployment_id="$(printf '%s' "$check" | jq -r '.external_id // empty')"
            details_url="$(printf '%s' "$check" | jq -r '.details_url // empty')"
            completed_at="$(printf '%s' "$check" | jq -r '.completed_at // empty')"
            summary="$(printf '%s' "$check" | jq -r '.output.summary // empty')"
            preview_url="$(printf '%s\n' "$summary" | grep -Eo 'https://[0-9a-f]{8}\.shotlab3\.pages\.dev' | head -n 1 || true)"

            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
              if [[ -z "$deployment_id" || -z "$preview_url" ]]; then
                echo "Cloudflare exact-head check succeeded but did not expose immutable deployment identity and preview URL for $EXPECTED_SHA." >&2
                printf '%s\n' "$check" >&2
                exit 1
              fi
              curl --fail --silent --show-error "$preview_url/" > /dev/null
              printf 'Cloudflare exact-head proof: sha=%s preview=%s deployment_id=%s completed_at=%s\n' "$EXPECTED_SHA" "$preview_url" "$deployment_id" "$completed_at"
              echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
              echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
              echo "source_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
              echo "completed_at=$completed_at" >> "$GITHUB_OUTPUT"
              echo "details_url=$details_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
              echo "Cloudflare Pages completed unsuccessfully for exact head $EXPECTED_SHA: conclusion=$conclusion deployment_id=$deployment_id" >&2
              exit 1
            fi
            sleep 10
          done
          echo "No successful Cloudflare Pages check run completed for exact head $EXPECTED_SHA." >&2
          exit 1

      - name: Certify exact deployed Cloudflare build in Chromium
        id: desktop_workspace_deployed
        if: ${{ github.event_name == 'pull_request' }}
        env:
          ACCEPTANCE_BASE_URL: ${{ steps.cloudflare.outputs.preview_url }}
        run: npx playwright test tests/e2e/desktop-workspace-routing.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line --retries=0

      - name: Record exact Phase 5 candidate SHA and release provenance
        if: always()
        shell: bash
        env:
          CLOUDFLARE_PREVIEW_URL: ${{ steps.cloudflare.outputs.preview_url }}
          CLOUDFLARE_DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.deployment_id }}
          CLOUDFLARE_SOURCE_SHA: ${{ steps.cloudflare.outputs.source_sha }}
          CLOUDFLARE_COMPLETED_AT: ${{ steps.cloudflare.outputs.completed_at }}
          CLOUDFLARE_DETAILS_URL: ${{ steps.cloudflare.outputs.details_url }}
          PERFORMANCE_BUDGET_RESULT: ${{ steps.performance_budget.outcome }}
          LOCAL_WORKSPACE_RESULT: ${{ steps.desktop_workspace_local.outcome }}
          DEPLOYED_WORKSPACE_RESULT: ${{ steps.desktop_workspace_deployed.outcome }}
        run: |
          mkdir -p artifacts/phase-5-release-hardening
          candidate="$(git rev-parse HEAD)"
          printf '%s\n' "$candidate" > artifacts/phase-5-release-hardening/exact-head-sha.txt
          printf '%s\n' "$PHASE5_BASELINE_SHA" > artifacts/phase-5-release-hardening/baseline-sha.txt
          jq -n \
            --arg candidate_sha "$candidate" \
            --arg production_build_sha "$candidate" \
            --arg browser "Chromium" \
            --arg roles "Coach,Player" \
            --arg viewports "320,375,390,430,768,1024,1280,1440" \
            --arg routes "Coach Home,Players,Player context,Events,Settings/Season Archive; Player Home,Train/Quick Menu,Events; Back,Forward,direct deep-link,refresh" \
            --arg local_playwright "$LOCAL_WORKSPACE_RESULT" \
            --arg deployed_playwright "$DEPLOYED_WORKSPACE_RESULT" \
            --arg performance_budget "$PERFORMANCE_BUDGET_RESULT" \
            --arg cloudflare_preview_url "$CLOUDFLARE_PREVIEW_URL" \
            --arg cloudflare_deployment_id "$CLOUDFLARE_DEPLOYMENT_ID" \
            --arg cloudflare_source_sha "$CLOUDFLARE_SOURCE_SHA" \
            --arg cloudflare_status "success" \
            --arg cloudflare_completed_at "$CLOUDFLARE_COMPLETED_AT" \
            --arg cloudflare_details_url "$CLOUDFLARE_DETAILS_URL" \
            '{candidate_sha:$candidate_sha,production_build_sha:$production_build_sha,browser:$browser,roles:$roles,viewports:$viewports,routes:$routes,local_playwright:$local_playwright,deployed_playwright:$deployed_playwright,performance_budget:$performance_budget,cloudflare_preview_url:$cloudflare_preview_url,cloudflare_deployment_id:$cloudflare_deployment_id,cloudflare_source_sha:$cloudflare_source_sha,cloudflare_status:$cloudflare_status,cloudflare_completed_at:$cloudflare_completed_at,cloudflare_details_url:$cloudflare_details_url}' \
            > artifacts/phase-5-release-hardening/release-certification.json

      - name: Upload exact-head Phase 5 visual and certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-release-hardening-evidence
          path: |
            artifacts/phase-5-release-hardening/
            artifacts/phase-5-mobile-precision-evidence/
            artifacts/phase-4-product-reset-interaction/
            artifacts/phase-3a-cross-screen-visual-audit/
            artifacts/phase-3-release-certification/
            artifacts/phase-3-team-store-portal-certification/
            tests/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-release-hardening-failure
          path: |
            playwright-report/
            test-results/
            /tmp/phase-5-preview.log
          if-no-files-found: ignore
          retention-days: 7
