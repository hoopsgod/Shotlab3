name: Phase 3E Apply Profile Hierarchy

on:
  push:
    branches:
      - agent/phase-3e-profile-information-hierarchy

permissions:
  contents: write

jobs:
  apply-profile-hierarchy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-3e-profile-information-hierarchy
          fetch-depth: 0

      - name: Apply guarded Profile hierarchy transform
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()
          original = text

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          # Remove Career History from the top of the Profile so it can live behind deep-history disclosure.
          career_start = text.find('<PlayerCareerHistory\n')
          require(career_start >= 0, 'PlayerCareerHistory block not found')
          career_end = text.find('/>', career_start)
          require(career_end >= 0, 'PlayerCareerHistory closing token not found')
          career_end += 2
          career_block = text[career_start:career_end]
          text = text[:career_start] + text[career_end:]

          # Remove duplicate Profile identity hero; the season card + route header already own identity.
          hero_start = text.find('{/* Hero card */}')
          badges_start = text.find('{/* Badges */}', hero_start)
          require(hero_start >= 0 and badges_start > hero_start, 'duplicate Profile hero anchors not found')
          text = text[:hero_start] + text[badges_start:]

          # Move badges below current progress/readout instead of interrupting the decision path.
          badges_start = text.find('{/* Badges */}')
          progress_heading = text.find('>PLAYER PROGRESS PROFILE</div>', badges_start)
          require(badges_start >= 0 and progress_heading > badges_start, 'badges/progress anchors not found')
          progress_line_start = text.rfind('\n', 0, progress_heading) + 1
          badges_block = text[badges_start:progress_line_start].strip()
          text = text[:badges_start] + text[progress_line_start:]

          # Give the existing current-progress card a stable semantic owner without changing its calculations.
          progress_heading = text.find('>PLAYER PROGRESS PROFILE</div>')
          progress_line_start = text.rfind('\n', 0, progress_heading) + 1
          progress_line_end = text.find('\n', progress_heading)
          progress_line = text[progress_line_start:progress_line_end]
          require(progress_line.startswith('<div style='), 'current-progress opening div changed unexpectedly')
          progress_line = progress_line.replace('<div style=', '<div data-testid="player-profile-current-progress" style=', 1)
          text = text[:progress_line_start] + progress_line + text[progress_line_end:]

          # Decision readout + deep-detail stack begins immediately before the full interpreted trend detail.
          trend_heading = text.find('>INTERPRETED PERFORMANCE TRENDS</div>')
          require(trend_heading >= 0, 'interpreted trends heading not found')
          trend_block_start = text.rfind('\n<div style=', 0, trend_heading) + 1
          require(trend_block_start > 0, 'interpreted trends block start not found')
          hierarchy_intro = f'''<div data-testid="player-profile-readout" style={{{{background:CARD_BG,borderRadius:16,padding:"14px 16px",border:`1px solid ${{BORDER_CLR}}`,marginBottom:16}}}}>
  <div data-profile-readout-eyebrow style={{{{fontFamily:FB,color:VOLT,fontSize:10,fontWeight:800,letterSpacing:"0.10em"}}}}>PLAYER READOUT</div>
  <div data-profile-readout-primary style={{{{fontFamily:FB,color:LIGHT,fontSize:18,fontWeight:800,marginTop:5}}}}>Momentum: {{interpretedTrends.momentum}}</div>
  <div data-profile-readout-support style={{{{fontFamily:FB,color:MUTED,fontSize:11,lineHeight:1.45,marginTop:8}}}}>
    <span>Focus area: {{interpretedTrends.weakArea}}</span>
    <span>Strongest drill: {{interpretedTrends.strongestDrill}}</span>
  </div>
</div>

{badges_block}

<div data-testid="player-profile-disclosure-stack">
<ProgressiveDisclosure title="Performance details" summary="Makes, sessions, charts, and recent logs" testId="player-profile-performance-details">\n'''
          text = text[:trend_block_start] + hierarchy_intro + text[trend_block_start:]

          # Keep all charts and metrics; only place them behind the Performance details disclosure.
          chart_line = '<ShotLabCharts scores={scores} drills={drills} programDrills={programDrills} user={u} />'
          require(text.count(chart_line) == 1, f'expected one Profile ShotLabCharts line, found {text.count(chart_line)}')
          chart_replacement = f'''<div data-testid="player-profile-analytics">{chart_line}</div>
</ProgressiveDisclosure>

<ProgressiveDisclosure title="Drill development" summary={{`${{drillStats.length}} drills tracked · personal bests and trends`}} testId="player-profile-drill-development">'''
          text = text.replace(chart_line, chart_replacement, 1)

          # Close drill development, then restore Career History as the third deep-data disclosure.
          privacy_heading = text.find('>PRIVACY</div>')
          require(privacy_heading >= 0, 'privacy heading not found')
          privacy_block_start = text.rfind('\n<div style=', 0, privacy_heading) + 1
          require(privacy_block_start > 0, 'privacy block start not found')
          hierarchy_outro = f'''</ProgressiveDisclosure>

<ProgressiveDisclosure title="Career history" summary="Season archive and verified history" testId="player-profile-career-disclosure">
{career_block}
</ProgressiveDisclosure>
</div>

'''
          text = text[:privacy_block_start] + hierarchy_outro + text[privacy_block_start:]

          # Guard the transformation before writing.
          require('data-testid="player-profile-current-progress"' in text, 'current progress test id missing')
          require('data-testid="player-profile-readout"' in text, 'readout missing')
          require('testId="player-profile-performance-details"' in text, 'performance disclosure missing')
          require('testId="player-profile-drill-development"' in text, 'drill disclosure missing')
          require('testId="player-profile-career-disclosure"' in text, 'career disclosure missing')
          require('data-testid="player-profile-analytics"' in text, 'stable analytics wrapper missing')
          require(text.count('<PlayerCareerHistory\n') == 1, 'Career History should exist exactly once')
          require(text.count('<ShotLabCharts scores={scores} drills={drills} programDrills={programDrills} user={u} />') == 1, 'ShotLabCharts should exist exactly once')
          require('{/* Hero card */}' not in text, 'duplicate Profile hero should be removed')
          require(text != original, 'Profile transform produced no change')

          path.write_text(text)

      - name: Commit guarded transform and remove bootstrap workflow
        run: |
          git config user.name "shotlab-phase3e-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase3e-apply-profile-hierarchy.yml
          git add src/App.jsx
          git commit -m "Phase 3E: reframe Player Profile hierarchy"
          git push origin HEAD:agent/phase-3e-profile-information-hierarchy
