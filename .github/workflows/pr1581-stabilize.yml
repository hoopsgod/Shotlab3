name: PR 1581 Stabilization Patch
# closure retrigger

on:
  push:
    branches:
      - agent/desktop-single-page-workspace-shell
    paths:
      - .github/workflows/pr1581-stabilize.yml
      - scripts/patch-pr1581-stabilization.cjs
      - scripts/refine-pr1581-stabilization.cjs
      - scripts/finalize-pr1581-deeplink.cjs
      - tests/e2e/desktop-workspace-routing.spec.mjs
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: pr1581-stabilize
  cancel-in-progress: true

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-single-page-workspace-shell
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply stabilization patch
        run: |
          node scripts/patch-pr1581-stabilization.cjs
          node scripts/refine-pr1581-stabilization.cjs
          node scripts/finalize-pr1581-deeplink.cjs
      - name: Run focused source regressions
        run: node --test tests/desktop-single-page-workspace-shell.test.mjs tests/mobile-coach-navigation.test.mjs tests/desktop-hudl-workspace-2026.test.mjs
      - name: Verify fixed production performance budget
        run: npm run build:performance
      - name: Confirm fixed budget retains positive JavaScript headroom
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const metrics=JSON.parse(await readFile('artifacts/performance/build-metrics.json','utf8'));
          const used=metrics.totals.javaScriptGzipBytes;
          const limit=metrics.budget.maxTotalJavaScriptGzipBytes;
          const headroom=limit-used;
          console.log(`JS_GZIP_BYTES=${used}`);
          console.log(`JS_GZIP_BUDGET=${limit}`);
          console.log(`JS_GZIP_HEADROOM=${headroom}`);
          if(headroom<1) throw new Error(`JavaScript gzip budget exceeded by ${Math.abs(headroom)} B.`);
          NODE
      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.1
      - name: Install Chromium for focused browser certification
        run: npx playwright install --with-deps chromium
      - name: Verify Coach and Player workspace routing, history, responsive safety
        id: routing
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/desktop-workspace-routing.spec.mjs 2>&1 | tee routing-playwright.log
      - name: Upload focused browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1581-routing-evidence
          path: |
            routing-playwright.log
            test-results
            artifacts/performance/build-metrics.json
          if-no-files-found: ignore
      - name: Enforce focused browser gate
        if: steps.routing.outcome != 'success'
        run: exit 1
      - name: Restore Season Archive E2E
        run: npm run test:e2e:season-archive
      - name: Ensure patch is clean
        run: git diff --check
      - name: Commit tested stabilization
        id: final
        shell: bash
        run: |
          rm scripts/patch-pr1581-stabilization.cjs scripts/refine-pr1581-stabilization.cjs scripts/finalize-pr1581-deeplink.cjs .github/workflows/pr1581-stabilize.yml
          git config user.name "shotlab-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize desktop workspace routing"
          FINAL_SHA=$(git rev-parse HEAD)
          echo "sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          echo "FINAL_SOURCE_SHA=$FINAL_SHA"
          git push origin HEAD:agent/desktop-single-page-workspace-shell
      - name: Resolve exact-head Cloudflare preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA=${FINAL_SHA:0:7}
          PREVIEW=""
          for attempt in $(seq 1 60); do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1581/comments?per_page=100" > /tmp/pr1581-comments.json
            PREVIEW=$(SHORT_SHA="$SHORT_SHA" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const comments=JSON.parse(fs.readFileSync('/tmp/pr1581-comments.json','utf8'));
          const short=process.env.SHORT_SHA;
          const comment=[...comments].reverse().find(c=>c.user?.login==='cloudflare-workers-and-pages[bot]'&&String(c.body||'').includes(short));
          const match=String(comment?.body||'').match(/https:\/\/[0-9a-f]+\.shotlab3\.pages\.dev/);
          if(match) process.stdout.write(match[0]);
          NODE
            )
            if [ -n "$PREVIEW" ]; then
              if curl -fsS --retry 3 --retry-delay 2 "$PREVIEW/" >/dev/null; then break; fi
            fi
            PREVIEW=""
            sleep 5
          done
          if [ -z "$PREVIEW" ]; then
            echo "No successful Cloudflare preview found for exact final SHA $FINAL_SHA" >&2
            exit 1
          fi
          echo "url=$PREVIEW" >> "$GITHUB_OUTPUT"
          echo "EXACT_PREVIEW_URL=$PREVIEW"
      - name: Verify exact deployed build in Chromium
        env:
          DEPLOYED_BASE_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          cat > /tmp/pr1581-deployed.config.mjs <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: process.cwd() + '/tests/e2e',
            fullyParallel: false,
            forbidOnly: true,
            retries: 1,
            workers: 1,
            reporter: 'line',
            outputDir: process.cwd() + '/test-results-deployed',
            use: {
              ...devices['Desktop Chrome'],
              baseURL: process.env.DEPLOYED_BASE_URL,
              viewport: { width: 1280, height: 900 },
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
            },
          });
          EOF
          npx playwright test tests/e2e/desktop-workspace-routing.spec.mjs --config=/tmp/pr1581-deployed.config.mjs
      - name: Prove exact final source remains unchanged after deployed certification
        env:
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git diff --exit-code
