name: Phase 1C Exact-CI Snapshot Refresh

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase1c-exact-ci-snapshot-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-one-baseline:
    if: github.event.pull_request.number == 1569
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_ENABLE_PRODUCTION_DEMOS: "true"
      VITE_SUPABASE_URL: "https://parity.supabase.co"
      VITE_SUPABASE_ANON_KEY: "parity-anon-key"
      TARGET: tests/e2e/phase1c-focused-visual-runtime.spec.mjs-snapshots/coach-mission-control-registered-empty-390-mobile-chromium-linux.png
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Playwright runner and Chromium
        run: |
          npm install --no-save @playwright/test@1.55.1
          npx playwright install --with-deps chromium

      - name: Build exact production assets
        run: npm run build

      - name: Refresh only registered-empty Coach baseline
        run: |
          npx playwright test tests/e2e/phase1c-focused-visual-runtime.spec.mjs \
            --config=playwright.phase1c.config.mjs \
            --project=mobile-chromium \
            --grep '^coach-mission-control-registered-empty-390 focused visual/runtime contract$' \
            --update-snapshots

      - name: Prove only the intended snapshot changed
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "$TARGET"

      - name: Commit exact-CI baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "Refresh registered empty Coach visual baseline from exact CI"
          git push origin "HEAD:${{ github.head_ref }}"
