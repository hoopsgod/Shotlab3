name: App Store Privacy and TestFlight Readiness

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "ios/App/App/PrivacyInfo.xcprivacy"
      - "ios/App/App/Info.plist"
      - "ios/App/App.xcodeproj/project.pbxproj"
      - "ios/App/App/capacitor.config.json"
      - "native/app-store-connect-privacy.json"
      - "native/app-store-listing.json"
      - "native/ios-release-profile.json"
      - "scripts/configure-ios-privacy-readiness.mjs"
      - "scripts/configure-ios-signing.mjs"
      - "scripts/native-release-doctor.mjs"
      - "scripts/ios-release.mjs"
      - "scripts/testflight-readiness.mjs"
      - "docs/app-store-review-package.md"
      - "docs/testflight-release-runbook.md"
      - "tests/app-store-privacy-review-readiness.test.mjs"
      - "tests/app-store-release-hardening.test.mjs"
      - "tests/phase-4-native-ios-foundation.test.mjs"
      - "tests/phase-4-signed-device-layer.test.mjs"
      - "tests/testflight-release-readiness.test.mjs"
      - ".github/workflows/app-store-privacy-review-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-testflight-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned native asset toolchain
        run: npm run native:install:toolchain

      - name: Verify deterministic privacy configuration
        run: |
          node scripts/configure-ios-privacy-readiness.mjs
          git diff --exit-code -- ios/App/App.xcodeproj/project.pbxproj ios/App/App/Info.plist

      - name: Verify TestFlight release metadata
        run: node scripts/testflight-readiness.mjs

      - name: Verify privacy and review contracts
        run: node --test tests/app-store-privacy-review-readiness.test.mjs

      - name: Verify release hardening contracts
        run: node --test tests/app-store-release-hardening.test.mjs

      - name: Verify native iOS foundation
        run: node --test tests/phase-4-native-ios-foundation.test.mjs

      - name: Verify signed-device layer
        run: node --test tests/phase-4-signed-device-layer.test.mjs

      - name: Verify TestFlight release regression contracts
        run: node --test tests/testflight-release-readiness.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Upload TestFlight readiness report
        uses: actions/upload-artifact@v4
        with:
          name: testflight-static-readiness
          path: artifacts/testflight/readiness.json
          if-no-files-found: error
          retention-days: 14

  xcode-release-bundle:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26.*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          echo "Selected ${XCODE_PATH}."

      - name: Verify Apple upload toolchain minimums
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          test "$XCODE_MAJOR" -ge 26
          test "$IOS_SDK_MAJOR" -ge 26
          echo "Verified Xcode ${XCODE_VERSION} with iOS SDK ${IOS_SDK_VERSION}."

      - name: Build and sync current production web assets
        run: |
          npm run native:install:toolchain
          npm run native:sync:ios

      - name: Validate native property lists
        run: |
          plutil -lint ios/App/App/Info.plist
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy

      - name: Verify macOS TestFlight readiness
        run: node scripts/testflight-readiness.mjs --require-macos

      - name: Compile simulator app with explicit derived data
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/TestFlightSimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile unsigned Release build against iPhoneOS SDK
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/TestFlightDeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify privacy manifest is bundled in simulator app
        run: |
          APP_BUNDLE="build/TestFlightSimulatorDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_BUNDLE"
          test -f "$APP_BUNDLE/PrivacyInfo.xcprivacy"
          plutil -lint "$APP_BUNDLE/PrivacyInfo.xcprivacy"

      - name: Upload macOS readiness report
        uses: actions/upload-artifact@v4
        with:
          name: testflight-macos-readiness
          path: artifacts/testflight/readiness.json
          if-no-files-found: error
          retention-days: 14
