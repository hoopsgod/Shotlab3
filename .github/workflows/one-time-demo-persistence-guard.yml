name: One-time Demo Persistence Guard

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-demo-persistence-guard:
    if: github.head_ref == 'codex/add-season-archive-functionality-for-shotlab-0b4b9f'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/add-season-archive-functionality-for-shotlab-0b4b9f
          fetch-depth: 0

      - name: Move demo persistence guard before writes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()

          replacements = [
              (
                  'import { isDemoAccount, isDemoMode, isDemoPlayerSessionShotLog } from "./lib/demoMode.js";',
                  'import { isDemoAccount, isDemoMode, isDemoPlayerSessionShotLog, setDemoMode } from "./lib/demoMode.js";',
              ),
              (
                  'const register=async(email,password,name,role)=>{\nconst normalizedEmail=normalizeEmail(email);',
                  'const register=async(email,password,name,role)=>{\nsetDemoMode(false);\nconst normalizedEmail=normalizeEmail(email);',
              ),
              (
                  'const login=async(email,password)=>{\nconst normalizedEmail=normalizeEmail(email);',
                  'const login=async(email,password)=>{\nsetDemoMode(false);\nconst normalizedEmail=normalizeEmail(email);',
              ),
              (
                  'const demoSignIn=async(kind="player")=>{\nconst acct=kind==="coach"?DEMO_COACH:DEMO_PLAYER;',
                  'const demoSignIn=async(kind="player")=>{\nsetDemoMode(true);\nconst acct=kind==="coach"?DEMO_COACH:DEMO_PLAYER;',
              ),
              (
                  'if(isDemoMode()||isDemoAccount(exitingUser))await cleanupDemoPlayerSessionData(exitingUser);if(SUPABASE_AUTH_ENABLED)',
                  'if(isDemoMode()||isDemoAccount(exitingUser))await cleanupDemoPlayerSessionData(exitingUser);setDemoMode(false);if(SUPABASE_AUTH_ENABLED)',
              ),
              (
                  'if(isDemoMode()||isDemoAccount(user))await cleanupDemoPlayerSessionData(user);\nawait P("sl:players"',
                  'if(isDemoMode()||isDemoAccount(user))await cleanupDemoPlayerSessionData(user);\nsetDemoMode(false);\nawait P("sl:players"',
              ),
          ]

          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old[:80]}')
              text = text.replace(old, new, 1)
              changed = True

          if changed:
              path.write_text(text)
              print('Patched demo persistence guard ordering.')
          else:
              print('Demo persistence guard ordering already patched.')
          PY

      - name: Commit guard fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix(demo): block persistence before demo data setup"
          git push origin HEAD:codex/add-season-archive-functionality-for-shotlab-0b4b9f
