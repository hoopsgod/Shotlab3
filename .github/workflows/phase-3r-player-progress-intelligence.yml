name: Phase 3R Player Progress Intelligence

on:
  pull_request:
    branches:
      - agent/phase-3q-player-session-closeout
    paths:
      - "src/App.jsx"
      - "src/components/PlayerProgressStory.jsx"
      - "src/components/PlayerProgressStory.module.css"
      - "src/lib/playerProgressStory.js"
      - "public/shotlab-phase3r-player-progress-story.css"
      - "index.html"
      - "playwright.screenshots.config.mjs"
      - "scripts/apply-phase3r-player-progress-intelligence.mjs"
      - "tests/phase-3r-player-progress-intelligence.test.mjs"
      - "tests/e2e/phase-3r-player-progress-story-screenshots.spec.mjs"
      - "package.json"
      - ".github/workflows/phase-3r-player-progress-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_ENABLE_PRODUCTION_DEMOS: "true"

concurrency:
  group: phase-3r-player-progress-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-player-progress-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Phase 3R contracts
        run: node --test tests/phase-3r-player-progress-intelligence.test.mjs tests/phase-3q-player-session-closeout.test.mjs

      - name: Verify production build
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture and verify iPhone progress story
        run: npx playwright test tests/e2e/phase-3r-player-progress-story-screenshots.spec.mjs --config=playwright.screenshots.config.mjs --reporter=line

      - name: Upload Phase 3R evidence
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3r-player-progress-intelligence-evidence
          path: |
            artifacts/design-audit/iphone/04v-player-progress-story.png
            artifacts/design-audit/iphone/04w-player-progress-full-profile.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 3R failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shotlab-phase-3r-player-progress-intelligence-failure
          path: |
            test-results/
            artifacts/design-audit/iphone/
          if-no-files-found: ignore
          retention-days: 7
