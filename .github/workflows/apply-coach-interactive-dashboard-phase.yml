name: Apply Coach Interactive Dashboard Phase

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-coach-interactive-dashboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-dashboard-phase:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/coach-interactive-dashboards'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/coach-interactive-dashboards
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply dashboard integration
        run: |
          set -o pipefail
          node scripts/run-coach-interactive-dashboard-patch.mjs 2>&1 | tee coach-dashboard-patch.log

      - name: Upload patch diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coach-dashboard-patch-diagnostic
          path: coach-dashboard-patch.log
          if-no-files-found: error
          retention-days: 2

      - name: Install dependencies
        run: npm ci

      - name: Verify dashboard selectors and integration contracts
        run: node --test tests/coach-operational-dashboard.test.mjs tests/coach-interactive-dashboard-contract.test.mjs

      - name: Build application
        run: |
          set -o pipefail
          npm run build 2>&1 | tee coach-dashboard-build.log

      - name: Upload build diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coach-dashboard-build-diagnostic
          path: coach-dashboard-build.log
          if-no-files-found: error
          retention-days: 2

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "Dashboard integration is already committed."
            exit 0
          fi
          git commit -m "feat: wire interactive dashboards into coach routes"
          git fetch origin agent/coach-interactive-dashboards
          git rebase origin/agent/coach-interactive-dashboards
          git push --force-with-lease origin HEAD:agent/coach-interactive-dashboards
