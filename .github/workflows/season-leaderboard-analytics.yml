name: Season Leaderboard Analytics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-aware-leaderboards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out semantic color branch
        uses: actions/checkout@v4
        with:
          ref: codex/semantic-color-system-stabilization
          fetch-depth: 0

      - name: Apply semantic color wiring
        run: |
          set +e
          python scripts/apply_semantic_color_patch.py > semantic-color-patch.log 2>&1
          status=$?
          cat semantic-color-patch.log
          exit $status

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-color-patch-diagnostics
          path: semantic-color-patch.log
          if-no-files-found: error
          retention-days: 3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run archive-aware leaderboard, hierarchy, navigation, and semantic tests
        run: |
          node --test \
            tests/season-leaderboard-analytics.test.mjs \
            tests/season-leaderboard-roster-boundary.test.mjs \
            tests/season-leaderboard-ui-contract.test.mjs \
            tests/premium-leaderboards-hub-regression.test.mjs \
            tests/leaderboard-category-static-safety.test.mjs \
            tests/visual-hierarchy-contract.test.mjs \
            tests/mobile-navigation-contract.test.mjs \
            tests/semantic-color-system-contract.test.mjs

      - name: Build application
        run: npm run build

      - name: Commit semantic color wiring
        run: |
          if git diff --quiet; then
            echo "No semantic color changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/MobileNavigation.module.css
          git commit -m "refactor(ui): restore semantic color roles"
          git push origin HEAD:codex/semantic-color-system-stabilization
