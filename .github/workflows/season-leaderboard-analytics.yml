name: Season Leaderboard Analytics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-aware-leaderboards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out mobile navigation branch
        uses: actions/checkout@v4
        with:
          ref: codex/mobile-navigation-stabilization
          fetch-depth: 0

      - name: Apply mobile navigation wiring
        run: |
          python scripts/apply_mobile_navigation_patch.py
          python scripts/fix_mobile_navigation_padding.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run leaderboard, hierarchy, and navigation tests
        run: |
          node --test \
            tests/season-leaderboard-analytics.test.mjs \
            tests/season-leaderboard-roster-boundary.test.mjs \
            tests/season-leaderboard-ui-contract.test.mjs \
            tests/premium-leaderboards-hub-regression.test.mjs \
            tests/leaderboard-category-static-safety.test.mjs \
            tests/visual-hierarchy-contract.test.mjs \
            tests/mobile-navigation-contract.test.mjs

      - name: Build application
        run: npm run build

      - name: Commit mobile navigation wiring
        run: |
          if git diff --quiet; then
            echo "No navigation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "refactor(ui): simplify mobile navigation"
          git push origin HEAD:codex/mobile-navigation-stabilization
