name: Season Leaderboard Analytics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-aware-leaderboards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run archive-aware leaderboard tests
        run: |
          node --test \
            tests/season-leaderboard-analytics.test.mjs \
            tests/season-leaderboard-ui-contract.test.mjs \
            tests/premium-leaderboards-hub-regression.test.mjs \
            tests/leaderboard-category-static-safety.test.mjs

      - name: Build application
        run: npm run build
