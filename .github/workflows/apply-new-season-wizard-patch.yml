name: Apply New Season Wizard Patch

on:
  push:
    branches:
      - codex/new-season-wizard
    paths:
      - .github/workflows/apply-new-season-wizard-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/new-season-wizard
          fetch-depth: 0

      - name: Apply exact App.jsx patch
        run: node .github/scripts/apply-new-season-wizard-patch.mjs

      - name: Verify intended diff
        run: |
          git diff --check
          git diff -- src/App.jsx
          test ! -e .github/workflows/apply-new-season-wizard-patch.yml
          test ! -e .github/scripts/apply-new-season-wizard-patch.mjs

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/apply-new-season-wizard-patch.yml .github/scripts/apply-new-season-wizard-patch.mjs
          git commit -m "feat: mount new season wizard in coach players"
          git push origin HEAD:codex/new-season-wizard
