name: Season Archive E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-demo-db-write-guard:
    if: github.head_ref == 'codex/add-season-archive-functionality-for-shotlab-0b4b9f'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/add-season-archive-functionality-for-shotlab-0b4b9f
          fetch-depth: 0

      - name: Block direct remote writes during demo mode
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()
          old = '''    if (strictLocal && !localPersisted) throw (localError || new Error("local_persist_failed"));
    const table = TABLE_MAP[k];'''
          new = '''    if (strictLocal && !localPersisted) throw (localError || new Error("local_persist_failed"));
    if (isDemoMode()) return { localPersisted, remoteSkipped: "demo_local_only" };
    const table = TABLE_MAP[k];'''

          if new in text:
              print('Direct demo write guard is already present.')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print('Patched direct demo write guard.')
          else:
              raise SystemExit('Expected DB.set persistence boundary was not found.')
          PY

      - name: Commit guard fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix(demo): block direct remote persistence writes"
          git push origin HEAD:codex/add-season-archive-functionality-for-shotlab-0b4b9f

  season-archive-browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run season archive service tests
        run: |
          set +e
          node --test tests/season-archive.test.mjs tests/season-archive-react-compat.test.mjs tests/season-archives-route.test.mjs > season-archive-service-tests.txt 2>&1
          status=$?
          cat season-archive-service-tests.txt
          exit $status

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run season archive browser test
        run: npm run test:e2e:season-archive

      - name: Upload archive failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: season-archive-failure-artifacts
          path: |
            season-archive-service-tests.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
