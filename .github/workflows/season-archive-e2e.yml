name: Season Archive E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  season-archive-browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run season archive service tests
        run: |
          set +e
          node --test tests/season-archive.test.mjs tests/season-archives-route.test.mjs > season-archive-service-tests.txt 2>&1
          status=$?
          cat season-archive-service-tests.txt
          exit $status

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run season archive browser test
        run: npm run test:e2e:season-archive

      - name: Upload archive failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: season-archive-failure-artifacts
          path: |
            season-archive-service-tests.txt
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
