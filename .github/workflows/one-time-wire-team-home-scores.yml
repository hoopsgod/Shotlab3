name: One-time Wire Team Home Scores

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire-team-home-scores:
    if: github.head_ref == 'codex/add-all-time-offseason-leaderboards'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/add-all-time-offseason-leaderboards
          fetch-depth: 0

      - name: Use team score collection in player leaderboard hub
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text()
          old = 'teamId={u?.teamId||""} homeScores={homeScores} shotLogs={shotLogs} seasonArchives={seasonArchives} />'
          new = 'teamId={u?.teamId||""} homeScores={scores} shotLogs={shotLogs} seasonArchives={seasonArchives} />'
          if new in text and old not in text:
              print('Player leaderboard already receives the team score collection.')
          else:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one player leaderboard score fragment, found {count}.')
              path.write_text(text.replace(old, new, 1))
              print('Player leaderboard now receives the full team score collection.')
          PY

      - name: Commit team score wiring
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix(leaderboards): use team scores in player rankings"
          git push origin HEAD:codex/add-all-time-offseason-leaderboards
