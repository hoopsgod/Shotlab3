name: Coach Dashboard Phase 2 E2E

on:
  pull_request:
    branches:
      - march-3-reset-85393dd
  workflow_dispatch:

permissions:
  contents: read

# This gate is intentionally read-only and exercises the final PR head at a mobile viewport.
concurrency:
  group: coach-dashboard-phase-two-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coach-dashboard-phase-two:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Verify Phase 2 selectors and source contracts
        run: node --test tests/coach-operational-intelligence.test.mjs tests/coach-dashboard-phase-2-contract.test.mjs tests/coach-command-center-10x.test.mjs tests/coach-activation-path.test.mjs tests/coach-priority-delivery-integrity.test.mjs

      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.55.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run Coach Dashboard Phase 2 mobile flows
        run: npx playwright test tests/e2e/coach-dashboard-phase-2.spec.mjs tests/e2e/coach-activation-phase-1.spec.mjs tests/e2e/coach-priority-delivery.spec.mjs tests/e2e/coach-player-priority-handoff.spec.mjs --config=playwright.acceptance.config.mjs --reporter=line

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coach-dashboard-phase-2-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
